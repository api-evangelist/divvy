aid: divvy

name: Divvy

description: Divvy is a corporate card and spend-management platform (free software plus business credit cards) that was acquired by BILL and
  now operates as BILL Spend & Expense; getdivvy.com redirects to bill.com. Its API for budgets, users, virtual cards, transactions, and reimbursements
  is delivered through the BILL developer platform (developer.bill.com) as part of the BILL v3 API, authenticated with a Spend & Expense API token,
  with a documented webhook event surface, dated changelog, sandbox environment, and per-token rate limits. This profile was surfaced as an Insight
  Partners portfolio company and has been enriched from BILL's public developer surface.

