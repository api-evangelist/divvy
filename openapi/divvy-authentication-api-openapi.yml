openapi: 3.2.0
info:
  title: BILL v3 Authentication API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Authentication
paths:
  /v3/login:
    post:
      tags:
      - Authentication
      summary: API login
      description: 'Sign in to your BILL developer account. In the response, your API session is created and a BILL-generated `sessionId` is available. Use the `sessionId` in all subsequent API calls to confirm that you are in a signed-in session.


        To create an MFA-trusted API session, set `rememberMeId` and `device` in addition to the required fields. See MFA setup for information about the BILL MFA process.


        You can sign out with `POST /v3/logout`. If your API session is inactive for 35 minutes, the session expires and you are automatically signed out.


        See API partner login for information about the additional permissions you get with the API partner login.


        **Note**: This section is about authentication for working with the BILL v3 API. See Authentication with Spend & Expense API token for information about authentication for the Spend & Expense API endpoints.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
        required: true
      responses:
        '200':
          description: API login response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/login/organizations:
    get:
      tags:
      - Authentication
      summary: Get list of login organizations
      description: 'Get a list of organizations you can access with your current API session. You get 100 results on one page of results.


        In the response, you get a list of organizations and console organizations. When a console organization is available in the response, this indicates that the console organization is a parent of the listed organization.'
      operationId: listAllOrganizations
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of login organizations response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllOrganizationsResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/login/session:
    get:
      tags:
      - Authentication
      summary: Get API session details
      description: Get details about your current API session. This includes information about the current organization ID, user ID, and MFA status of the organization.
      operationId: getSessionInfo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      responses:
        '200':
          description: Get API session details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfoResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/logout:
    post:
      tags:
      - Authentication
      summary: API logout
      description: 'Sign out of your BILL developer account. In response, the current `sessionId` expires and your API session is terminated.


        You will be required to sign in again with `/v3/login` before you can make another API call.'
      operationId: logout
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      responses:
        '200':
          description: API logout response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    OrganizationDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
        name:
          type: string
          description: Organization name
        consoleOrganizationId:
          type: string
          description: 'BILL-generated ID of the console organization. The value begins with `008`.


            When a console organization is available in the response, this indicates that the console organization is a parent of the listed organization.'
      description: Organization response.
    ConsoleOrganization:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
        name:
          type: string
          description: Organization name
      description: Console organization response.
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    SessionInfoResponseDto:
      type: object
      properties:
        organizationId:
          type: string
          description: BILL-generated ID of the current organization
        userId:
          type: string
          description: BILL-generated ID of the current user
        mfaStatus:
          allOf:
          - $ref: '#/components/schemas/MfaStatus'
          - description: 'MFA status of the organization.

              * `DISABLED`: MFA is disabled for the organization.

              * `SETUP`: MFA setup is incomplete. Validate phone to complete MFA setup.

              * `CHALLENGE`: MFA setup is complete. MFA challenge is required for MFA sign in.

              * `COMPLETE`: Both MFA setup and MFA sign in steps are complete. The API session is MFA trusted.'
        mfaBypass:
          type: boolean
          description: This field is set as `true` when MFA is disabled at the developer key level. All organizations that are linked to this developer key do not require MFA.
      description: Login session info.
    BdcError:
      required:
      - category
      - code
      - severity
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        category:
          $ref: '#/components/schemas/Category'
        message:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        detail:
          type: string
        help:
          type: string
    LoginResponseDto:
      required:
      - organizationId
      - sessionId
      - trusted
      - userId
      type: object
      properties:
        sessionId:
          type: string
          description: API session ID. Use this value in all subsequent API calls to confirm that you are in a signed-in session.
        organizationId:
          type: string
          description: Organization ID associated with the signed-in user
        userId:
          type: string
          description: BILL-generated ID of the signed-in user
        trusted:
          type: boolean
          description: This field is set as `true` if the current API session is MFA-trusted
      description: Login response.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    ListAllResponseDto_AllOrganizationsResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
        prevPage:
          type: string
        results:
          $ref: '#/components/schemas/AllOrganizationsResponseDto'
      description: Response from a list API request with paging references.
    LoginRequestDto:
      required:
      - devKey
      - organizationId
      - username
      type: object
      properties:
        devKey:
          type: string
          description: Developer key sent to you by BILL when you create a developer account
        username:
          type: string
          description: Email address used to sign in to your BILL account
        password:
          type: string
          description: Password used to sign in to your BILL account
        consoleApiToken:
          type: string
          description: 'Console API token.


            As a BILL Accountant Console user, use `POST /v3/login` to sign in to a client organization.

            * `username`: Your BILL Accountant Console email address

            * `consoleApiToken`: Your Console API token

            * `devKey`: Developer key of the client organization

            * `organizationId`: Organization ID of the client organization


            See [BILL Accountant Console operations](https://developer.bill.com/docs/bill-accountant-console-operations) for more information.'
        organizationId:
          type: string
          description: Organization ID
        rememberMeId:
          type: string
          description: 'MFA ID. Set this field for creating an MFA-trusted API session.


            This MFA ID is generated when you set `rememberMe` as `true` in your `POST /v3/mfa/challenge/validate` request. This value expires in 30 days.


            See [Validate MFA challenge](https://developer.bill.com/reference/validatechallenge) for more information.'
        device:
          type: string
          description: Mobile device name. This is a nickname for your mobile device. Set this field when you set `rememberMeId`.
      description: API login
      example:
        username: '{{username}}'
        password: '{{password}}'
        organizationId: '{{organization_id}}'
        devKey: '{{developer_key}}'
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
      - DOWNSTREAM
    ListAllOrganizationsResponseDto:
      type: object
      description: Get list of organizations response.
      allOf:
      - $ref: '#/components/schemas/ListAllResponseDto_AllOrganizationsResponseDto_'
    MfaStatus:
      type: string
      enum:
      - DISABLED
      - SETUP
      - CHALLENGE
      - COMPLETE
      - UNDEFINED
    AllOrganizationsResponseDto:
      type: object
      properties:
        organizations:
          type: array
          description: List of organizations. When a console organization is available in the response, this indicates that the console organization is a parent of the listed organization.
          items:
            $ref: '#/components/schemas/OrganizationDto'
        consoleOrganizations:
          type: array
          description: List of console organizations
          items:
            $ref: '#/components/schemas/ConsoleOrganization'
      description: Get list of organizations response.
