openapi: 3.2.0
info:
  title: BILL v3 Custom Fields API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Custom Fields
paths:
  /v3/spend/custom-fields:
    get:
      tags:
      - Custom Fields
      summary: Get list of custom fields
      description: Get a list of custom field objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.
      operationId: listCustomFields
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int64
          example: 10
      - name: nextPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set this field as the `nextPage` value for navigation.'
      - name: prevPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Previous page of results. Set this field as the `prevPage` value for navigation.
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: "Field name and sort order. You can set only one sort field.\n\nThe format is `sort={field}:{sort_order}`.\n\nThe sortable fields are:\n - `name`\n - `createdTime`"
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: "Field name, operator, and value. You can set multiple filters.\n\nThe format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.\n\nExample: `filters=name:sw:Ad,retired:eq:false`\n\nThe filterable fields are:\n - `name` - String. Operators: `eq`, `sw`.\n - `retired` - `true` or `false`. Operators: `eq`."
          example: retired:eq:false
      responses:
        '200':
          description: Get list of custom fields response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomFieldResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Custom Fields
      summary: Create a custom field
      description: 'Create a new custom field.


        See Transactions in the Guides section for more information, sample requests, and responses.'
      operationId: createCustomField
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomFieldRequestDto'
        required: true
      responses:
        '200':
          description: Create a custom field response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/custom-fields/{customFieldId}:
    get:
      tags:
      - Custom Fields
      summary: Get custom field details
      description: Get details about an existing custom field.
      operationId: getCustomField
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: customFieldId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field
          example: '{{se_custom_field_uuid}}'
      responses:
        '200':
          description: Get custom field details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    delete:
      tags:
      - Custom Fields
      summary: Delete a custom field
      description: Delete an existing custom field. A deleted custom field cannot be restored. The deleted custom field is not available in the list of custom fields.
      operationId: deleteCustomField
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: customFieldId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field
          example: '{{se_custom_field_uuid}}'
      responses:
        '200':
          description: Delete a custom field response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Custom Fields
      summary: Update a custom field
      description: Update details about an existing custom field.
      operationId: updateCustomField
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: customFieldId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field
          example: '{{se_custom_field_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomFieldRequestDto'
        required: true
      responses:
        '200':
          description: Update a custom field response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/custom-fields/{customFieldId}/values:
    get:
      tags:
      - Custom Fields
      summary: Get list of custom field values
      description: Get a list of custom field value objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.
      operationId: listCustomFieldValues
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int64
          example: 10
      - name: nextPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set this field as the `nextPage` value for navigation.'
      - name: prevPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Previous page of results. Set this field as the `prevPage` value for navigation.
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: "Field name, operator, and value. You can set multiple filters.\n\nThe format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.\n\nExample: `filters=name:sw:Ad`\n\nThe filterable fields are:\n - `name` - String. Operators: `eq`, `sw`.\n - `retired` - `true` or `false`. Operators: `eq`. The default value is `false`."
          example: retired:eq:false
      - name: customFieldId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field
          example: '{{se_custom_field_uuid}}'
      responses:
        '200':
          description: Get list of custom field values response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomFieldValuesResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Custom Fields
      summary: Create a custom field value
      description: Create a new value for an existing custom field.
      operationId: createCustomFieldValues
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: customFieldId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field
          example: '{{se_custom_field_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomFieldValueRequestDto'
        required: true
      responses:
        '200':
          description: Create a custom field value response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomFieldValueResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    delete:
      tags:
      - Custom Fields
      summary: Delete a custom field value
      description: 'Delete an existing custom field value.


        A deleted value cannot be restored. The deleted value is not available in the list of custom field values. In addition, the deleted value cannot be assigned to current or future transactions. The deleted value will continue to be assigned to past transactions.'
      operationId: deleteCustomFieldValue
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: customFieldId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field
          example: '{{se_custom_field_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteCustomFieldValuesRequestDto'
        required: true
      responses:
        '200':
          description: Delete a custom field value response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/custom-fields/{customFieldId}/values/{customFieldValueId}:
    get:
      tags:
      - Custom Fields
      summary: Get custom field value details
      description: Get details about an existing custom field value.
      operationId: getCustomFieldValues
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: customFieldId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field
          example: '{{se_custom_field_uuid}}'
      - name: customFieldValueId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field value
          example: '{{se_custom_field_value_uuid01}}'
      responses:
        '200':
          description: Get custom field value details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldValueResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    PaginationResponseDto_CustomFieldValueResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
          description: Next page token
        prevPage:
          type: string
          description: Previous page token
        results:
          type: array
          description: Results
          items:
            $ref: '#/components/schemas/CustomFieldValueResponseDto'
      description: Response from a list API request with paging references.
    DeleteCustomFieldValuesRequestDto:
      required:
      - customFieldValueIds
      type: object
      properties:
        customFieldValueIds:
          minItems: 1
          type: array
          description: List of custom field value IDs or UUIDs
          items:
            type: string
      description: Delete custom field values request
      example:
        customFieldValueIds:
        - '{{se_custom_field_value_uuid01}}'
    UpdateCustomFieldRequestDto:
      type: object
      properties:
        minimumAmountForRequirement:
          type:
          - number
          - 'null'
          description: Minimum transaction amount where the custom field is required
        name:
          type:
          - string
          - 'null'
          description: Custom field name
        description:
          type:
          - string
          - 'null'
          description: Custom field description
        allowCustomValues:
          type:
          - boolean
          - 'null'
          description: Set as `true` if the custom field can have custom values
        required:
          type:
          - boolean
          - 'null'
          description: Set as `true` if the custom field is required for all budgets. The default value is `false`.
        global:
          type:
          - boolean
          - 'null'
          description: Set as `true` if the custom field applies to all budgets. The default value is `false`.
        selectedBudgetIds:
          type: array
          description: List of budgets where the custom field is available. Set the budget ID or UUID values.
          items:
            type: string
        requiredBudgetIds:
          type: array
          description: List of budgets where the custom field is required. Set the budget ID or UUID values.
          items:
            type: string
      description: Update a custom field (Description added)
      example:
        description: Engineering team offsite 2026
    PaginationResponseDto_CustomFieldResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
          description: Next page token
        prevPage:
          type: string
          description: Previous page token
        results:
          type: array
          description: Results
          items:
            $ref: '#/components/schemas/CustomFieldResponseDto'
      description: Response from a list API request with paging references.
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    CreateCustomFieldRequestDto:
      required:
      - allowCustomValues
      - global
      - name
      - required
      type: object
      properties:
        name:
          type: string
          description: Custom field name
        description:
          type: string
          description: Custom field description
        multiSelect:
          type: boolean
          description: Set as `true` if the custom field can have multiple selected values
        allowCustomValues:
          type: boolean
          description: Set as `true` if the custom field can have custom values
        minimumAmountForRequirement:
          type: number
          description: Minimum transaction amount where the custom field is required
        required:
          type: boolean
          description: Set as `true` if the custom field is required for all budgets. The default value is `false`.
        global:
          type: boolean
          description: Set as `true` if the custom field applies to all budgets. The default value is `false`.
        values:
          type: array
          description: List of custom field values
          items:
            type: string
        selectedBudgetIds:
          type: array
          description: List of budgets where the custom field is available. Set the budget ID or UUID values.
          items:
            type: string
        requiredBudgetIds:
          type: array
          description: List of budgets where the custom field is required. Set the budget ID or UUID values.
          items:
            type: string
      description: Create a custom field
      example:
        name: Team offsite
        allowCustomValues: false
        global: true
        values:
        - Travel
        - Food
    CustomFieldType:
      type: string
      description: Enum representing the custom field kind in the Spend API.
      enum:
      - CUSTOM_SELECTOR
      - NOTE
    BdcError:
      required:
      - category
      - code
      - severity
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        category:
          $ref: '#/components/schemas/Category'
        message:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        detail:
          type: string
        help:
          type: string
    CustomFieldResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the custom field
          deprecated: true
        uuid:
          type: string
          description: BILL-generated UUID of the custom field
        name:
          type: string
          description: Custom field name
        description:
          type: string
          description: Custom field description
        type:
          allOf:
          - $ref: '#/components/schemas/CustomFieldType'
          - description: 'Custom field type.

              n* `CUSTOM_SELECTOR`: Select one value from the list (or multiple values when `multiSelect` is true)

              * `NOTE`: Write a per-transaction custom note.


              **Note**: Currently, BILL does not support creating additional custom fields with `type` set as `NOTE`.'
        multiSelect:
          type: boolean
          description: Set as `true` if the custom field can have multiple selected values
        allowCustomValues:
          type: boolean
          description: Set as `true` if the custom field can have custom values
        minimumAmountForRequirement:
          type: number
          description: Minimum transaction amount where the custom field is required
        required:
          type: boolean
          description: Set as `true` if the custom field is required for all budgets. The default value is `false`.
        global:
          type: boolean
          description: Set as `true` if the custom field applies to all budgets. The default value is `false`.
        retired:
          type: boolean
          description: Set as `true` if the custom field is retired
        createdTime:
          type: string
          description: Created date and time
          format: date-time
        selectedBudgetIds:
          type: array
          description: List of BILL-generated ID values of budgets where the custom field is available
          deprecated: true
          items:
            type: string
        selectedBudgetUuids:
          type: array
          description: List of BILL-generated UUID values of budgets where the custom field is available
          items:
            type: string
        requiredBudgetIds:
          type: array
          description: List of BILL-generated ID values of budgets where the custom field is required
          deprecated: true
          items:
            type: string
        requiredBudgetUuids:
          type: array
          description: List of BILL-generated UUID values of budgets where the custom field is required
          items:
            type: string
      description: DTO representing a custom field response.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    CreateCustomFieldValueRequestDto:
      required:
      - values
      type: object
      properties:
        values:
          minItems: 1
          type: array
          description: List of custom field values
          items:
            type: string
      description: Create a custom field value (value added to existing list)
      example:
        values:
        - Travel
        - Food
        - Entertainment
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
      - DOWNSTREAM
    PaginatedCustomFieldValuesResponseDto:
      type: object
      description: List of custom fields with paging references.
      allOf:
      - $ref: '#/components/schemas/PaginationResponseDto_CustomFieldValueResponseDto_'
    CustomFieldValueResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the custom field value
          deprecated: true
        uuid:
          type: string
          description: BILL-generated UUID of the custom field value
        value:
          type: string
          description: Custom field value
        deleted:
          type: boolean
          description: Set as `true` if the custom field value is retired
      description: DTO representing a custom field value response.
    PaginatedCustomFieldResponseDto:
      type: object
      description: List of custom fields with paging references.
      allOf:
      - $ref: '#/components/schemas/PaginationResponseDto_CustomFieldResponseDto_'
