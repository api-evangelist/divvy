openapi: 3.2.0
info:
  title: BILL v3 Vendors API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Vendors
paths:
  /v3/vendors:
    get:
      tags:
      - Vendors
      summary: Get list of vendors
      description: 'Get a list of vendor objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listVendors
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.


            The `fz` operator performs a fuzzy match and is supported only on `name`, for example `filters=name:fz:acme corp`. It returns vendors whose names approximately match the search term, ordered by the other `sort` criteria.'
          example: id:eq:{{vendor_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of vendors response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVendorResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Vendors
      summary: Create a vendor
      description: 'Create a new vendor.


        ### Requirements for enabling vendor payments


        Vendor address details are required for paying a vendor by check or for inviting the vendor to join the BILL network.

        * `line1`

        * `city`

        * `zipOrPostalCode`

        * `country`

        * `payeeName`


        **Note**: A vendor can be enrolled to accept virtual card payments even without being connected in the BILL network. See Virtual card FAQ in the BILL Help Center for more information.


        ### Requirements for enabling electronic payments to vendors


        Vendor bank account details are required for paying a vendor with electronic payment methods.


        `paymentInformation` details about bank accounts are required for adding a vendor bank account.

        * `payeeName`

        * `bankCountry` (for international vendors)

        * `paymentCurrency` (for international vendors)

        * `nameOnAccount`

        * `accountNumber`

        * `routingNumber` (empty for an IBAN `accountNumber`)

        * `type` (for international vendors)


        `regulatoryFields` and `paymentPurpose` are additional required fields for enabling electronic payments to international vendors (not United States) in specific countries.


        **Note**: When you add a vendor bank account in the production environment, BILL requires 2 business days to complete a one-time verification of the bank account. To pay such a vendor, you must set a `processDate` that is 2 business days from the current date.


        See Vendors in the Guides section for more information, sample requests, and responses.'
      operationId: createVendor
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRequestDto'
        required: true
      responses:
        '201':
          description: Create a vendor response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendors/bulk:
    post:
      tags:
      - Vendors
      summary: Create multiple vendors
      description: 'Create multiple vendors with one API request. You can create up to 20 vendors with one `POST /v3/vendors/bulk` request.


        In your bulk vendor creation request, all your vendors must be successfully created for a successful response. If any vendor creation is not successful, the entire request fails and none of the vendors in the request are created.


        ### Requirements for enabling vendor payments


        Vendor address details are required for paying a vendor by check or for inviting the vendor to join the BILL network.

        * `line1`

        * `city`

        * `zipOrPostalCode`

        * `country`

        * `payeeName`


        **Note**: A vendor can be enrolled to accept virtual card payments even without being connected in the BILL network. See Virtual card FAQ in the BILL Help Center for more information.


        ### Requirements for enabling electronic payments to vendors


        Vendor bank account details are required for paying a vendor with electronic payment methods.


        `paymentInformation` details about bank accounts are required for adding a vendor bank account.

        * `payeeName`

        * `bankCountry` (for international vendors)

        * `paymentCurrency` (for international vendors)

        * `nameOnAccount`

        * `accountNumber`

        * `routingNumber` (empty for an IBAN `accountNumber`)

        * `type` (for international vendors)


        `regulatoryFields` and `paymentPurpose` are additional required fields for enabling electronic payments to international vendors (not United States) in specific countries.


        **Note**: When you add a vendor bank account in the production environment, BILL requires 2 business days to complete a one-time verification of the bank account. To pay such a vendor, you must set a `processDate` that is 2 business days from the current date.


        See Vendors in the Guides section for more information, sample requests, and responses.'
      operationId: createBulkVendor
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 20
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/VendorRequestDto'
        required: true
      responses:
        '201':
          description: Create multiple vendors response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkVendorResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendors/configuration/international-payments:
    get:
      tags:
      - Vendors
      summary: Get international payments configuration
      description: 'Get international payments (not USD) configuration that is required for compliance with international payment rules of a vendor country and vendor bank account.


        This information is based on vendor country, bill currency, and vendor account type. Use this endpoint for getting information before creating an international vendor. In the response, the required `paymentPurpose` and `regulatoryFields` information is retrieved for the vendor.


        **Note**: If you are adding `paymentPurpose` and `regulatoryFields` information after creating an international vendor, use `GET /v3/vendors/{vendorId}/configuration` to get the required configuration for your created vendor.


        See Create an international vendor for more information on how to set `paymentPurpose` and `regulatoryFields`.'
      operationId: getIntlConfig
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: country
        in: query
        required: true
        schema:
          allOf:
          - $ref: '#/components/schemas/CountryCode'
          - description: Vendor country name
            example: DK
      - name: billCurrency
        in: query
        required: true
        schema:
          allOf:
          - $ref: '#/components/schemas/CurrencyCode'
          - description: 'Bill currency. Three-letter abbreviation.


              See <a href="https://help.bill.com/hc/en-us/articles/360007172671">Country information for international payments</a> in the BILL Help Center for more information.'
            example: EUR
      - name: accountType
        in: query
        required: true
        schema:
          allOf:
          - $ref: '#/components/schemas/AccountTypeRequest'
          - description: Vendor account type (`BUSINESS` or `PERSON`)
            example: BUSINESS
      responses:
        '200':
          description: Get international payments configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntlPmtsConfigurationResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendors/{vendorId}:
    get:
      tags:
      - Vendors
      summary: Get vendor details
      description: Get details about an existing vendor.
      operationId: getVendor
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
          example: '{{vendor_id}}'
      responses:
        '200':
          description: Get vendor details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Vendors
      summary: Update a vendor
      description: 'Update details about an existing vendor.


        ### Requirements for enabling vendor payments


        Vendor address details are required for paying a vendor by check or for inviting the vendor to join the BILL network.

        * `line1`

        * `city`

        * `zipOrPostalCode`

        * `country`

        * `payeeName`


        **Note**: You cannot add or update vendor bank account information with this endpoint. You can add and manage vendor bank account information with a dedicated set of endpoints.

        * **Create a vendor bank account**: `POST /v3/vendors/{vendorId}/bank-account`

        * **Get vendor bank account details**: `GET /v3/vendors/{vendorId}/bank-account`

        * **Delete a vendor bank account**: `DELETE /v3/vendors/{vendorId}/bank-account`'
      operationId: updateVendor
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
          example: '{{vendor_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Update a vendor response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendors/{vendorId}/archive:
    post:
      tags:
      - Vendors
      summary: Archive a vendor
      description: 'Archive an existing vendor. In the response, the `archived` field is set as `true`.


        You can restore an archived vendor with `POST /v3/vendors/{vendorId}/restore`. There is no change when you archive an archived vendor.'
      operationId: archiveVendor
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
          example: '{{vendor_id}}'
      responses:
        '200':
          description: Archive a vendor response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendors/{vendorId}/bank-account:
    get:
      tags:
      - Vendors
      summary: Get vendor bank account details
      description: Get details about an existing vendor bank account.
      operationId: getVendorBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
          example: '{{vendor_id}}'
      responses:
        '200':
          description: Get vendor bank account details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Vendors
      summary: Create a vendor bank account
      description: 'Create a vendor bank account for an existing vendor.


        To update vendor bank account information, you must first delete the existing vendor bank account (with `DELETE /v3/vendors/{vendorId}/bank-account`), and then create a new vendor bank account (with `POST /v3/vendors/{vendorId}/bank-account`) with the updated information.


        **Note**: When you add a vendor bank account in the production environment, BILL requires 2 business days to complete a one-time verification of the bank account. To pay such a vendor, you must set a `processDate` that is 2 business days from the current date.'
      operationId: createVendorBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
          example: '{{vendor_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorBankAccountRequestDto'
        required: true
      responses:
        '200':
          description: Create a vendor bank account response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    delete:
      tags:
      - Vendors
      summary: Delete a vendor bank account
      description: 'Delete the existing vendor bank account for a vendor.


        To update vendor bank account information, you must first delete the existing vendor bank account (with `DELETE /v3/vendors/{vendorId}/bank-account`), and then create a new vendor bank account (with `POST /v3/vendors/{vendorId}/bank-account`) with the updated information.'
      operationId: deleteVendorBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
          example: '{{vendor_id}}'
      responses:
        '204':
          description: Delete a vendor bank account response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendors/{vendorId}/configuration:
    get:
      tags:
      - Vendors
      summary: Get vendor configuration
      description: 'Get international payments (not USD) configuration after vendor creation. This configuration is required for compliance with international payment rules of a vendor country and vendor bank account.


        In the response, the required `paymentPurpose` and `regulatoryFields` information is retrieved for the vendor.


        **Note**: If you are adding `paymentPurpose` and `regulatoryFields` information during international vendor creation, use `GET /v3/vendors/configuration/international-payments` to get the required configuration before vendor creation.


        See Create an international vendor for more information on how to set `paymentPurpose` and `regulatoryFields`.'
      operationId: getConfigurationByVendorId
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
          example: '{{vendor_id}}'
      responses:
        '200':
          description: Get vendor configuration response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorConfigurationResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendors/{vendorId}/restore:
    post:
      tags:
      - Vendors
      summary: Restore an archived vendor
      description: 'Restore an archived vendor. In the response, the `archived` field is set as `false`.


        You can perform any valid BILL operation on restored vendors. There is no change when you restore a restored vendor.'
      operationId: restoreVendor
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
          example: '{{vendor_id}}'
      responses:
        '200':
          description: Restore an archived vendor response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    TaxIdTypeRequest:
      type: string
      description: The enum Tax id type enum.
      enum:
      - EIN
      - SSN
    VirtualCard:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/VirtualCardStatus'
          - description: Virtual card enrollment status for the vendor
        remitEmail:
          type: string
          description: Virtual card remittance email address set for the vendor
        enrollDate:
          type: string
          description: Virtual card enrollment date
          format: date-time
        declineDate:
          type: string
          description: Virtual card declined date
          format: date-time
        alternatePayByType:
          allOf:
          - $ref: '#/components/schemas/DisbursementType'
          - description: Alternate payment method for virtual card payment
      description: Vendor Direct (VCARD) information.
    PaymentPurposeResponse:
      type: object
      properties:
        text:
          type: string
          description: Payment purpose text
        code:
          allOf:
          - $ref: '#/components/schemas/PaymentPurposeCodeResponse'
          - description: Payment purpose code
      description: Payment purpose response.
    VendorConfigurationResponseDto:
      type: object
      properties:
        internationalPayments:
          $ref: '#/components/schemas/IntlPmtsConfigurationResponseDto'
      description: Vendor configuration response.
    VendorUpdateRequestDto:
      type: object
      properties:
        name:
          maxLength: 100
          type: string
          description: Vendor name
        shortName:
          maxLength: 40
          type: string
          description: Vendor short name
        accountNumber:
          type: string
          description: 'User account number set by the vendor. Set this field as the billing statement account number for vendor services such as utility or credit card bills.


            When you pay the vendor, this value appears on the check memo or electronic payment record.'
        accountType:
          allOf:
          - $ref: '#/components/schemas/AccountTypeRequest'
          - description: Vendor account type
        email:
          type: string
          description: Vendor email address
