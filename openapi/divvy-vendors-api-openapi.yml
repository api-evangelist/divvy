    AdditionalInfoResponse:
      type: object
      properties:
        taxId:
          type: string
          description: Vendor tax ID. This value is required by the IRS for tax purposes.
        taxIdType:
          allOf:
          - $ref: '#/components/schemas/TaxIdTypeResponse'
          - description: Vendor tax ID type
        track1099:
          type: boolean
          description: Set as `true` if the vendor is eligible to receive an IRS form 1099 from the payer
        leadTimeInDays:
          type: integer
          description: Vendor payment lead time in days
          format: int32
        combinePayments:
          type: boolean
          description: Set as `true` to combine a bulk payment made to the vendor with `POST /v3/payments/bulk`. The default value is `true`.
        paymentTermId:
          type: string
          description: BILL-generated ID of the payment term. Use payment terms to set the number of days that customers have to pay a vendor bill.
        companyName:
          type: string
          description: Vendor business name. This value is required by the IRS for tax purposes.
      description: The type Additional info.
    PaymentInformationResponse:
      type: object
      description: The type PaymentInformationResponse.
      allOf:
      - $ref: '#/components/schemas/PaymentInformationCommon'
      - properties:
          lastPaymentDate:
            type: string
            description: Last payment date
          payByType:
            allOf:
            - $ref: '#/components/schemas/PayByType'
            - description: Payment method for BILL payments
          payBySubType:
            allOf:
            - $ref: '#/components/schemas/DisbursementSubType'
            - description: Payment delivery method for international payments.
          transferMethod:
            allOf:
            - $ref: '#/components/schemas/TransferMethod'
            - description: 'Default payment delivery method for international payments. This field is set when `payBySubType` is set as `MULTIPLE`.

                * `LOCAL`: Funds transferred with the vendor country''s domestic payment network

                * `WIRE`: Funds transferred with bank-operated networks (For example, SWIFT)'
          virtualCard:
            allOf:
            - $ref: '#/components/schemas/VirtualCard'
            - description: "Virtual card information.\n\n  **Note**: A vendor can be enrolled to accept virtual card payments   even without being connected in the BILL network. See   [Virtual card FAQ](https://help.bill.com/direct/s/article/360021237411) in the BILL Help   Center for more information."
          bankAccount:
            allOf:
            - $ref: '#/components/schemas/VendorBankAccountResponseDto'
            - description: Vendor bank account information. This information is overridden when you connect with a vendor in the BILL network.
          paymentPurpose:
            allOf:
            - $ref: '#/components/schemas/PaymentPurposeResponse'
            - description: Payment purpose information
    VendorRequestDto:
      required:
      - address
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: Vendor name
        shortName:
          maxLength: 40
          type: string
          description: Vendor short name
        accountNumber:
          type: string
          description: 'User account number set by the vendor. Set this field as the billing statement account number for vendor services such as utility or credit card bills.


            When you pay the vendor, this value appears on the check memo or electronic payment record.'
        accountType:
          allOf:
          - $ref: '#/components/schemas/AccountTypeRequest'
          - description: Vendor account type
        email:
          type: string
          description: Vendor email address
        phone:
          pattern: ^.{0,20}$
          type: string
          description: Vendor phone number
        address:
          allOf:
          - $ref: '#/components/schemas/Address'
          - description: Vendor address information
        paymentInformation:
          allOf:
          - $ref: '#/components/schemas/PaymentInformationRequest'
          - description: Vendor payment information
        additionalInfo:
          allOf:
          - $ref: '#/components/schemas/AdditionalInfoRequest'
          - description: Vendor additional information
        billCurrency:
          allOf:
          - $ref: '#/components/schemas/CurrencyCode'
          - description: 'Bill currency. Three-letter abbreviation in the ISO 4217 format.


              The `billCurrency` value is the currency in which vendor bills are presented. The value is also the currency used in the invoices you receive from the vendor.


              **Note**: When the vendor bill currency is not `USD` (For example, `EUR`), the payment `processDate` for this vendor must be the next US business day.


              See <a href="https://help.bill.com/hc/en-us/articles/360007172671">Country information for international payments</a> in the BILL Help Center for the list of countries that accept international payments with BILL.'
        autoPay:
          allOf:
          - $ref: '#/components/schemas/AutoPayDto'
          - description: 'Vendor auto-pay information.


              When you enable vendor auto-pay, BILL automatically pays the vendor when a bill is created for the vendor.


              **Note**: Enabling vendor `autoPay` requires an MFA-trusted API session. See [MFA setup](https://developer.bill.com/reference/setup) for information about the BILL MFA process.'
      description: Create a US vendor
      example:
        name: Happy Music Supplies
        accountType: BUSINESS
        email: info@happymusicsupplies.org
        phone: '9876543210'
        address:
          line1: 123 Main Street
          city: San Jose
          stateOrProvince: CA
          zipOrPostalCode: '95002'
          country: US
        paymentInformation:
          payeeName: Happy Music Supplies
          bankAccount:
            nameOnAccount: Bill Vendorson
            accountNumber: '111222333'
            routingNumber: '074000010'
        billCurrency: USD
