openapi: 3.2.0
info:
  title: BILL v3 Customers API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Customers
paths:
  /v3/customers:
    get:
      tags:
      - Customers
      summary: Get list of customers
      description: 'Get a list of customer objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listCustomers
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{customer_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of customers response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomerResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Customers
      summary: Create a customer
      description: 'Create a new customer.


        See Customers in the Guides section for more information, sample requests, and responses.'
      operationId: createCustomer
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequestDto'
        required: true
      responses:
        '201':
          description: Create a customer response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/customers/{customerId}:
    get:
      tags:
      - Customers
      summary: Get customer details
      description: Get details about an existing customer.
      operationId: getCustomer
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: customerId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
          example: '{{customer_id}}'
      responses:
        '200':
          description: Get customer details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Customers
      summary: Update a customer
      description: Update details about an existing customer.
      operationId: updateCustomer
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: customerId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
          example: '{{customer_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Update a customer response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/customers/{customerId}/archive:
    post:
      tags:
      - Customers
      summary: Archive a customer
      description: 'Archive an existing customer. In the response, the `archived` field is set as `true`.


        You can restore an archived customer with `POST /v3/customers/{customerId}/restore`. There is no change when you archive an archived customer.'
      operationId: archiveCustomer
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: customerId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
          example: '{{customer_id}}'
      responses:
        '200':
          description: Archive a customer response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
