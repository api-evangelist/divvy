          minLength: 1
          type: string
          description: BILL-generated ID of the customer bank account. The value begins with `cba`.
          example: '{{customer_bank_account_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerBankAccountRequestDto'
        required: true
      responses:
        '200':
          description: Update a customer bank account response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/customers/{customerId}/bank-accounts/{bankAccountId}/archive:
    post:
      tags:
      - Customers
      summary: Archive a customer bank account
      description: Archive an existing customer bank account. In the response, the `archived` field is set as `true`. An archived customer bank account cannot be restored.
      operationId: archiveCustomerBankAccount
      parameters:
      - name: sessionId
        in: header
