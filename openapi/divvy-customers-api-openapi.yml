          description: BILL-generated ID of the customer. The value begins with `0cu`.
          example: '{{customer_id}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: status:eq:VERIFIED
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of customer bank accounts response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomerBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Customers
      summary: Create a customer bank account
      description: 'Create a new customer bank account. When you add customer bank account information, you can charge the customer for invoices.


        Creating a customer bank account follows a set of rules.

        * **Customer billing address**: The customer `billingAddress` information is required before you can create a customer bank account.

        * **Customer bank account verification**: If the customer bank account requires verification, BILL requires up to 2 business days to complete a one-time verification of the bank account.


        **Note**: When you add a customer bank account in the production environment, BILL validates the customer routing number before you can charge the customer. You will get an error message if the customer routing number is invalid in production.'
      operationId: createCustomerBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: customerId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
          example: '{{customer_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerBankAccountRequestDto'
        required: true
      responses:
        '201':
          description: Create a customer bank account response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
