          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Customers
      summary: Update a customer bank account
      description: 'Update details about an existing customer bank account.


        You can update only the `nickname` and `ownerType` fields for a customer bank account. If you want to update any of the other fields, create a new customer bank account with `POST /v3/customers/{customerId}/bank-accounts`.'
      operationId: updateCustomerBankAccount
      parameters:
      - name: sessionId
        in: header
