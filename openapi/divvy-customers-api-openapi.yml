  /v3/customers/{customerId}/charge-authorization:
    post:
      tags:
      - Customers
      summary: Set charge customer authorization
      description: 'Authorize your organization to charge a customer for invoices.


        By default, your organization is not authorized to charge a customer. The customer `authorizedToCharge` field must be set as `true` for you to charge the customer for invoices.'
