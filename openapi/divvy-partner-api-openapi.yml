      enum:
      - BUSINESS
      - CONTRACTOR
      - EMPLOYEE_OR_INDIVIDUAL
      - OTHER
      - CONSUMER
      - UNDEFINED
    OrganizationAddress:
      required:
      - country
      type: object
      properties:
        line1:
          pattern: ^.{0,1000}$
          type: string
