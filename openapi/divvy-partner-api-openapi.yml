        firstName:
          type: string
          description: User first name
        lastName:
          type: string
          description: User last name
        email:
          type: string
          description: User email address
        roleId:
          type: string
          description: 'BILL-generated ID of the user role. The value begins with `0po`.


            If you do not set `roleId`, the default `ADMINISTRATOR` user role is assigned to the created user. You can get the list of available user roles with `GET /v3/partner/roles`.'
      description: Update a user (last name updated)
      example:
        lastName: Soupsmithson
    PartnerLoginResponseDto:
      type: object
      properties:
        sessionId:
          type: string
          description: API session ID. Use this value in all subsequent API calls to confirm that you are in a signed-in session.
      description: Login response.
    RoleResponseDto:
