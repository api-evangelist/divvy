openapi: 3.2.0
info:
  title: BILL v3 Partner API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Partner
paths:
  /v3/partner/login:
    post:
      tags:
      - Partner
      summary: API partner login
      description: 'Sign in to your BILL partner account. In the response, your partner API session is created and a BILL-generated `sessionId` is available. Use the `sessionId` in all subsequent API calls to confirm that you are in a signed-in session.


        You get additional permissions with a partner account `sessionId`.

        * Create a child BILL organization with `POST /v3/partner/organizations`.

        * Create a user for the child BILL organization with `POST /v3/partner/users`.

        * Sign in to the created organization as the created user of that organization with `/v3/partner/login-as-user`. After signing in, you can perform organization-level BILL API operations, such as creating a bill or paying a vendor. All organization-level BILL API operations require a `devKey` and `sessionId`.


        **Note**: When you create an organization and then create a user for that organization, it is important that you initiate risk verification with `POST /v3/risk-verifications`. See Initiate risk verification for an organization for more information.


        You can sign out with `POST /v3/logout`. If your API session is inactive for 35 minutes, the session expires and you are automatically signed out.'
      operationId: partnerLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerLoginRequestDto'
        required: true
      responses:
        '200':
          description: API partner login response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerLoginResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/login-as-user:
    post:
      tags:
      - Partner
      summary: API login as user
      description: 'Sign in to a created organization as a created user of that organization. In the response, your API session is created and a generated `sessionId` is available for organization-level BILL API operations.


        This endpoint is required for a specific BILL partner-level workflow.

        1. Sign in to your partner account with API partner login.

        2. Create a child BILL organization with `POST /v3/partner/organizations`. In the response, a BILL-generated organization `id` is available.

        3. Create a user for the child BILL organization with `POST /v3/partner/users`. In the response, a BILL-generated user `id` is available.

        4. Sign in to the created organization as the created user of that organization with `POST /v3/partner/login-as-user`. After signing in, you can perform organization-level BILL API operations, such as creating a bill or paying a vendor. All organization-level BILL API operations require a `devKey` and `sessionId`.


        **Note**: When you create an organization and then create a user for that organization, it is important that you initiate risk verification with `POST /v3/risk-verifications`. See Initiate risk verification for an organization for more information.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value


        You can sign out with `POST /v3/logout`. If your API session is inactive for 35 minutes, the session expires and you are automatically signed out.


        ### MFA-trusted API session

        Set both `rememberMeId` and `device` as additional fields in your `POST /v3/partner/login-as-user` request to create an MFA-trusted API session.'
      operationId: loginAsUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginAsUserRequestDto'
        required: true
      responses:
        '200':
          description: API login as user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginAsUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/organizations:
    get:
      tags:
      - Partner
      summary: Get list of organizations
      description: 'Get a list of organization objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value'
      operationId: listPartnerOrganizations
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{partner_organization_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of organizations response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Partner
      summary: Create an organization
      description: 'Create a new organization.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value


        See Organizations for BILL partners in the Guides section for more information, sample requests, and responses.'
      operationId: createOrganization
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequestDto'
        required: true
      responses:
        '201':
          description: Create an organization response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/organizations/{organizationId}/price-plan:
    patch:
      tags:
      - Partner
      summary: Update an organization price plan
      description: 'Update the price plan for an existing organization.


        When you onboard as a BILL partner, BILL works with you to set up price plans for the organizations you create. Your organizations can have up to 5 price plans. Each price plan is named in the `PricePlanN` format (`PricePlan1` up to `PricePlan5`).'
      operationId: updateOrgPartnerPricePlan
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
          example: '{{partner_organization_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgPricePlanRequest'
        required: true
      responses:
        '200':
          description: Update an organization price plan response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/risk-verifications/{userId}/phone:
    post:
      tags:
      - Partner
      summary: Add phone for risk verification
      description: 'Add a phone number for a created user. BILL requires organization users to have a linked phone number for initiating risk verification for the organization.


        You can check whether a phone number has been added for the user with `GET /v3/risk-verifications/phone`.


        After you add a phone number with this endpoint, you can initiate risk verification for the organization with `POST /v3/risk-verifications`.'
      operationId: createPhone
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{partner_user_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationRequestDto'
        required: true
      responses:
        '200':
          description: Add phone for risk verification response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/roles:
    get:
      tags:
      - Partner
      summary: Get list of user roles
      description: 'Get a list of user role objects available in a BILL organization. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value

        * The `organizationId` of the organization'
      operationId: listPartnerUserRoles
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{partner_user_role_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of user roles response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRoleResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/roles/{roleId}:
    get:
      tags:
      - Partner
      summary: Get user role details
      description: 'Get details about an existing user role in a BILL organization.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value

        * The `organizationId` of the organization'
      operationId: getPartnerUserRole
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      - name: roleId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user role. The value begins with `0po`.
          example: '{{partner_user_role_id}}'
      responses:
        '200':
          description: Get user role details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/users:
    get:
      tags:
      - Partner
      summary: Get list of users
      description: 'Get a list of user objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value

        * The `organizationId` of the organization'
      operationId: listPartnerUsers
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{partner_user_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of users response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Partner
      summary: Create a user
      description: 'Create a new user. The new user is created for the organization (`organizationId`) in the request header.


        In the request, set `username` as a unique alphanumeric value. The value must be 40 characters or fewer. This field is not case-sensitive. Do not set the value as an email address or any PII value. BILL uses this value to uniquely identify each user.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value

        * The `organizationId` of the organization


        See Users for BILL partners in the Guides section for more information, sample requests, and responses.'
      operationId: createPartnerUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUserCreateRequestDto'
        required: true
      responses:
        '201':
          description: Create a user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/users/{userId}:
    get:
      tags:
      - Partner
      summary: Get user details
      description: 'Get details about an existing user.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value

        * The `organizationId` of the organization'
      operationId: getPartnerUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{partner_user_id}}'
      responses:
        '200':
          description: Get user details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Partner
      summary: Update a user
      description: 'Update details about an existing user.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value

        * The `organizationId` of the organization'
      operationId: updatePartnerUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{partner_user_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUserUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Update a user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/users/{userId}/archive:
    post:
      tags:
      - Partner
      summary: Archive a user
      description: 'Archive an existing user. In the response, the `archived` field is set as `true`.


        You can restore an archived user with `POST /v3/users/{userId}/restore`. There is no change when you archive an archived user.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value

        * The `organizationId` of the organization'
      operationId: archivePartnerUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{partner_user_id}}'
      responses:
        '200':
          description: Archive a user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/partner/users/{userId}/restore:
    post:
      tags:
      - Partner
      summary: Restore an archived user
      description: 'Restore an archived user. In the response, the `archived` field is set as `false`.


        You can perform any valid BILL operation on restored users. There is no change when you restore a restored user.


        This operation requires partner-level permissions.

        * A `sessionId` header value generated with API partner login

        * An `appKey` header value

        * The `organizationId` of the organization'
      operationId: restorePartnerUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/partner/login`
          example: '{{partner_session_id}}'
      - name: appKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Application key sent to you by BILL when you create a partner account
          example: '{{app_key}}'
      - name: organizationId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: BILL-generated ID of the organization
          example: '{{partner_organization_id}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{partner_user_id}}'
      responses:
        '200':
          description: Restore an archived user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    TaxIdTypeRequest:
      type: string
      description: The enum Tax id type enum.
      enum:
      - EIN
      - SSN
    BusinessCategoryRequest:
      type: string
      description: Business Category.
      enum:
      - CORPORATION
      - LLC
      - NON_PROFIT
      - GOVERNMENT
      - SOLE_PROPRIETOR
      - INDIVIDUAL
      - TRUST
      - UNKNOWN
    ListUserResponseDto:
      type: object
      description: Get list of vendors response.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_OrganizationUserResponseDto_'
    ListOrganizationResponseDto:
      type: object
      description: Get list of organizations response.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_OrganizationResponseDto_'
    OrganizationCreateRequestDto:
      required:
      - address
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: Organization name
        displayName:
          maxLength: 100
          type: string
          description: Organization display name (DBA trade name)
        address:
          allOf:
          - $ref: '#/components/schemas/OrganizationAddress'
          - description: Organization physical address
        mailingAddress:
          allOf:
          - $ref: '#/components/schemas/OrganizationAddress'
          - description: Organization mailing address
        phone:
          pattern: ^(\+?[1-9]\d{0,2}[-\s]?)?(\(\d{3}\))?([0-9-\s]{7,20})$
          type: string
          description: Organization phone number
        companyOwner:
          allOf:
          - $ref: '#/components/schemas/CompanyOwner'
          - description: 'Company owner information.


              **Note**: It is important that you set the company owner `name` when you create an organization. This helps the organization user to get through the risk verification and add funding account steps without errors.'
        taxId:
          type: string
          description: Organization tax ID. This value is required by the IRS for tax purposes.
        taxIdType:
          allOf:
          - $ref: '#/components/schemas/TaxIdTypeRequest'
          - description: Organization tax ID type
        industry:
          maxLength: 500
          type: string
          description: Organization industry
        businessCategory:
          allOf:
          - $ref: '#/components/schemas/BusinessCategoryRequest'
          - description: Organization business category
        accountType:
          allOf:
          - $ref: '#/components/schemas/OrganizationAccountTypeRequest'
          - description: Organization account type
        processingOptions:
          allOf:
          - $ref: '#/components/schemas/OrganizationProcessingOptions'
          - description: Organization processing options
      description: Create an organization
      example:
        name: Rice Cakes Inc
        address:
          line1: 987 Home St
          city: San Jose
          stateOrProvince: CA
          zipOrPostalCode: '95002'
          country: US
        phone: '{{org_phone_no}}'
        taxId: '999888777'
        taxIdType: EIN
        companyOwner:
          name: Noodle Soupsmith
          dateOfBirth: '1985-01-01'
        industry: Restaurant Caterer or Bar
        businessCategory: LLC
        accountType: BUSINESS
        processingOptions:
          mailingAddressSameAsPhysical: 'true'
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    OrganizationUserResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
        archived:
          type: boolean
          description: Set as `true` if the user is archived
        firstName:
          type: string
          description: User first name
        lastName:
          type: string
          description: User last name
        email:
          type: string
          description: User email address
        role:
