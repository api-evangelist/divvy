          - description: User role type.
        description:
          type: string
          description: User role description
        createdTime:
          type: string
          description: Created date and time
          format: date-time
        updatedTime:
          type: string
          description: Updated date and time
          format: date-time
      description: User roles response.
    PartnerUserCreateRequestDto:
      required:
      - acceptTermsOfService
      - email
      - firstName
      - username
      type: object
      properties:
        firstName:
          maxLength: 100
          minLength: 1
          type: string
          description: User first name
        lastName:
          maxLength: 100
          type: string
          description: User last name
        email:
          minLength: 1
          type: string
          description: User email address
        roleId:
          type: string
          description: 'BILL-generated ID of the user role. The value begins with `0po`.


            If you do not set `roleId`, the default `ADMINISTRATOR` user role is assigned to the created user. You can get the list of available user roles with `GET /v3/partner/roles`.'
        username:
          maxLength: 1000
          minLength: 1
          type: string
          description: 'Username for signing in as the user.


            Set `username` as a unique alphanumeric value. The value must be 40 characters or fewer. This field is not case-sensitive. Do not set the value as an email address or any PII value. BILL uses this value to uniquely identify each user.'
        externalReferenceId:
          type: string
          description: 'Reference ID used as an external identifier.


            You can set this field as a unique alphanumeric value for your system to refer to the created user.'
        acceptTermsOfService:
          type: boolean
          description: Set as `true` if the user accepts the BILL terms of service
      description: Create a user
      example:
        firstName: Tomato
        lastName: Soupsmith
        email: tsoupsmith@ricecakes.org
        roleId: '{{partner_user_role_id}}'
        username: tsoupsm!th1
        acceptTermsOfService: true
