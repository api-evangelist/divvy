      required:
      - pricePlanType
      type: object
      properties:
        pricePlanType:
          allOf:
          - $ref: '#/components/schemas/PartnerPricePlanType'
          - description: Price plan type
      description: Update an organization price plan
      example:
        pricePlanType: PricePlan1
    LoginAsUserResponseDto:
      type: object
      properties:
        sessionId:
          type: string
          description: API session ID. Use this value in all subsequent API calls to confirm that you are in a signed-in session.
        trusted:
          type: boolean
          description: This field is set as `true` if the current API session is MFA-trusted
      description: API login as user response.
    PartnerLoginRequestDto:
      required:
      - appKey
      - password
      - username
      type: object
      properties:
        appKey:
          type: string
          description: Application key sent to you by BILL when you create a partner account
        username:
          type: string
          description: Email address used to sign in to your BILL account
        password:
          type: string
          description: Password used to sign in to your BILL account
      description: API partner login
      example:
        username: '{{partner_username}}'
        password: '{{partner_password}}'
        appKey: '{{app_key}}'
    PartnerPricePlanType:
      type: string
      description: The enum partner price plan.
      enum:
      - PricePlan1
      - PricePlan2
      - PricePlan3
      - PricePlan4
      - PricePlan5
    LoginAsUserRequestDto:
      required:
      - organizationId
      - userId
      type: object
      properties:
        userId:
          minLength: 1
          type: string
          description: BILL-generated ID of the user you want to sign in as
        organizationId:
          minLength: 1
          type: string
          description: BILL-generated ID of the organization you want to sign in to
        rememberMeId:
          type: string
          description: 'MFA ID. Set this field for creating an MFA-trusted API session.


            This MFA ID is generated when you set `rememberMe` as `true` in your `POST /v3/mfa/challenge/validate` request. This value expires in 30 days.


            See [Validate MFA challenge](https://developer.bill.com/reference/validatechallenge) for more information.'
        device:
          type: string
          description: Mobile device name. This is a nickname for your mobile device. This field is required when you set `rememberMeId`.
      description: API login as user
      example:
        userId: '{{partner_user_id}}'
        organizationId: '{{partner_organization_id}}'
    BusinessCategoryResponse:
      type: string
      description: Business Category.
      enum:
      - UNDEFINED
      - CORPORATION
      - LLC
      - NON_PROFIT
      - GOVERNMENT
      - SOLE_PROPRIETOR
      - INDIVIDUAL
