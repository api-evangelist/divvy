openapi: 3.2.0
info:
  title: BILL v3 Credit Memos API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: credit-memos
paths:
  /v3/credit-memos:
    get:
      tags:
      - credit-memos
      summary: Get list of credit memos
      description: 'Get a list of credit memo objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listCreditMemos
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{credit_memo_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of credit memos response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCreditMemoResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - credit-memos
      summary: Create a credit memo
      description: 'Create a new credit memo.


        With a credit memo, you can adjust the invoice amount owed by a customer.


        See Credit memos in the Guides section for more information, sample requests, and responses.'
      operationId: createCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditMemoRequestDto'
        required: true
      responses:
        '201':
          description: Create a credit memo response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/credit-memos/bulk:
    put:
      tags:
      - credit-memos
      summary: Replace multiple credit memos
      description: 'Update the number of line items in multiple credit memos with one API request. You can also update other details for each credit memo.


        You can use the PUT operation to add, remove, or replace the number of line items in a credit memo. A set of rules apply with the PUT operation.

        * When you add a new line item, a new line item `id` is generated in the credit memo.

        * When you omit an existing line item `id`, the line item is removed from the credit memo.'
      operationId: bulkReplaceCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 50
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/ReplaceCreditMemoWithIdRequestDto'
        required: true
      responses:
        '200':
          description: Replace multiple credit memos response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - credit-memos
      summary: Create multiple credit memos
      description: Create multiple credit memos with one API request. You can create up to 50 credit memos with one `POST /v3/credit-memos/bulk` request.
      operationId: bulkCreateCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 50
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/CreateCreditMemoRequestDto'
        required: true
      responses:
        '201':
          description: Create multiple credit memos response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - credit-memos
      summary: Update multiple credit memos
      description: 'Update details about line items in multiple credit memos with one API request. You can also update other credit memo details.


        You can use the PATCH operation to modify line item details, such as `amount`, `quantity`, and `description`. The credit memo line item `id` does not change with a PATCH operation.'
      operationId: bulkUpdateCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 50
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/UpdateCreditMemoWithIdRequestDto'
        required: true
      responses:
        '200':
          description: Update multiple credit memos response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/credit-memos/bulk/archive:
    post:
      tags:
      - credit-memos
      summary: Archive multiple credit memos
      description: Archive multiple credit memos with one API request. In the response, the `archived` field for each object is set as `true`.
      operationId: bulkArchiveCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: ids
        in: query
        required: true
        schema:
          type: string
          description: BILL-generated IDs of the credit memos. Each value begin with `ccr`. Set the IDs as comma-separated values.
          example: '{{credit_memo_id}}'
      responses:
        '200':
          description: Archive multiple credit memos response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/credit-memos/bulk/restore:
    post:
      tags:
      - credit-memos
      summary: Restore multiple credit memos
      description: Restore multiple credit memos with one API request. In the response, the `archived` field for each object is set as `false`.
      operationId: bulkRestoreCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: ids
        in: query
        required: true
        schema:
          type: string
          description: BILL-generated IDs of the credit memos. Each value begin with `ccr`. Set the IDs as comma-separated values.
          example: '{{credit_memo_id}}'
      responses:
        '200':
          description: Restore multiple credit memos response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/credit-memos/{creditMemoId}:
    get:
      tags:
      - credit-memos
      summary: Get credit memo details
      description: Get details about an existing credit memo.
      operationId: getCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: creditMemoId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the credit memo. The value begins with `ccr`.
          example: '{{credit_memo_id}}'
      responses:
        '200':
          description: Get credit memo details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoWithUsageResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    put:
      tags:
      - credit-memos
      summary: Replace a credit memo
      description: 'Update the number of line items in a credit memo. You can also update other credit memo details.


        You can use the PUT operation to add, remove, or replace the number of line items in a credit memo. A set of rules apply with the PUT operation.

        * When you add a new line item, a new line item `id` is generated in the credit memo.

        * When you omit an existing line item `id`, the line item is removed from the credit memo.'
      operationId: replaceCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: creditMemoId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the credit memo. The value begins with `ccr`.
          example: '{{credit_memo_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCreditMemoRequestDto'
        required: true
      responses:
        '200':
          description: Replace a credit memo response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - credit-memos
      summary: Update a credit memo
      description: 'Update details about a credit memo line item. You can also update other credit memo line item details.


        You can use the PATCH operation to modify line item details, such as `amount`, `quantity`, and `description`. The credit memo line item `id` does not change with a PATCH operation.'
      operationId: updateCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: creditMemoId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the credit memo. The value begins with `ccr`.
          example: '{{credit_memo_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreditMemoRequestDto'
        required: true
      responses:
        '200':
          description: Update a credit memo response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/credit-memos/{creditMemoId}/archive:
    post:
      tags:
      - credit-memos
      summary: Archive a credit memo
      description: 'Archive an existing credit memo. In the response, the `archived` field is set as `true`.


        You can restore an archived credit memo with

        `POST /v3/credit-memos/{creditMemoId}/restore`. There is no change when you archive an archived credit memo.'
      operationId: archiveCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: creditMemoId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the credit memo. The value begins with `ccr`.
          example: '{{credit_memo_id}}'
      responses:
        '200':
          description: Archive a credit memo response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/credit-memos/{creditMemoId}/restore:
    post:
      tags:
      - credit-memos
      summary: Restore a credit memo
      description: 'Restore an archived credit memo. In the response, the `archived` field is set as `false`.


        You can perform any valid BILL operation on restored credit memos. There is no change when you restore a restored credit memo.'
      operationId: restoreCreditMemo
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: creditMemoId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the credit memo. The value begins with `ccr`.
          example: '{{credit_memo_id}}'
      responses:
        '200':
          description: Restore a credit memo response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    CreditMemoResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the credit memo. The value begins with `ccr`.
        customerId:
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        referenceNumber:
          type: string
          description: User-generated credit memo number. This value can be in your chosen number scheme.
        creditDate:
          type: string
          description: Credit memo issued date. This value is in the `yyyy-MM-dd` format.
          format: date
        description:
          type: string
          description: Credit memo description
        archived:
          type: boolean
          description: Set as `true` if the credit memo is archived
        salesTaxItemId:
          type: string
          description: BILL-generated ID of the `SALES_TAX` item. The value begins with `0ii`. The tax rate is applied to all the credit memo line items set as taxable.
        payToChartOfAccountId:
          type: string
          description: BILL-generated ID of the chart of accounts used when the credit memo is applied to an invoice payment. The value begins with `0ca`.
        payToBankAccountId:
          type: string
          description: BILL-generated ID of the bank account used when the credit memo is applied to an invoice payment. The value begins with `bac`.
        amount:
          type: number
          description: Credit memo amount
        appliedAmount:
          type: number
          description: Credit memo amount applied to invoices
        salesTaxTotal:
          type: number
          description: Credit memo sales tax amount. The value is set based on `salesTaxItemId`.
        salesTaxPercentage:
          type: number
          description: Credit memo sales tax percentage. The value is set based on `salesTaxItemId`.
        status:
          allOf:
          - $ref: '#/components/schemas/CreditStatusDto'
          - description: Credit memo status.
        createdTime:
          type: string
          description: Credit memo created time
          format: date-time
        updatedTime:
          type: string
          description: Credit memo updated time
          format: date-time
        creditMemoLineItems:
          type: array
          description: Credit memo line item information
          items:
            $ref: '#/components/schemas/CreditMemoLineItemResponseDto'
        classifications:
          allOf:
          - $ref: '#/components/schemas/InvoiceClassificationsDto'
          - description: General ledger classifications information for the credit memo
      description: CreditMemo response Dto.
    InvoiceClassificationsDto:
      type: object
      properties:
        accountingClassId:
          type: string
          description: BILL-generated ID of the accounting class. The value begins with `cls`.
        departmentId:
          type: string
          description: BILL-generated ID of the department. The value begins with `0de`.
        jobId:
          type: string
          description: BILL-generated ID of the job. The value begins with `job`.
        locationId:
          type: string
          description: BILL-generated ID of the location. The value begins with `loc`.
      description: DTO for Invoice classifications.
    CreditMemoUsageDto:
      type: object
      properties:
        invoiceId:
          type: string
          description: BILL-generated ID of the invoice to which the credit memo is applied
        amount:
          type: number
          description: Credit memo amount applied to the invoice
      description: CreditMemo usage Dto.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    ListCreditMemoResponseDto:
      type: object
      description: Response from a list API request with paging references.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_CreditMemoWithUsageResponseDto_'
    CreateCreditMemoLineItemDto:
      type: object
      properties:
        description:
          type: string
          description: Credit memo line item description
        price:
          type: number
          description: Credit memo line item unit price. For a credit memo in an international currency (not USD), this value is in the local currency.
        quantity:
          type: number
          description: Credit memo line item unit quantity
        ratePercent:
          minimum: -100
          type: number
          description: 'Credit memo line item rate percent. Use `ratePercent` to apply a discount or markup in your credit memo.


            BILL applies the `ratePercent` to the sum of the `amount` values of all the line items above the `ratePercent` line item.


            **Note**: Use a separate line item to set a `ratePercent` for the credit memo. Set the `ratePercent` line item as the final line item. Do not set `price` and `quantity` in the line item when you set `ratePercent`.


            For example, let''s say you have two line items in a credit memo with an `amount` sum of `$150`. If you create a third line item with `ratePercent` set as `-10`, a 10% discount (`$15`) is applied to the `amount` sum of `$150`.'
        taxable:
          type: boolean
          description: Set as `true` if the credit memo line item is taxable
        classifications:
          allOf:
          - $ref: '#/components/schemas/InvoiceLineItemClassificationsDto'
          - description: General ledger classifications information for the credit memo line item
      description: Credit Memo Create Request Line Item.
    CreditMemoWithUsageResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the credit memo. The value begins with `ccr`.
        customerId:
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        referenceNumber:
          type: string
          description: User-generated credit memo number. This value can be in your chosen number scheme.
        creditDate:
          type: string
          description: Credit memo issued date. This value is in the `yyyy-MM-dd` format.
          format: date
        description:
          type: string
          description: Credit memo description
        archived:
          type: boolean
          description: Set as `true` if the credit memo is archived
