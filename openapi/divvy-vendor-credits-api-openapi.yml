openapi: 3.2.0
info:
  title: BILL v3 Vendor Credits API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Vendor Credits
paths:
  /v3/vendor-credits:
    get:
      tags:
      - Vendor Credits
      summary: Get list of vendor credits
      description: 'Get a list of vendor credit objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listVendorCredits
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{vendor_credit_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of vendor credits response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVendorCreditResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Vendor Credits
      summary: Create a vendor credit
      description: 'Create a vendor credit.


        With a vendor credit, you can adjust the amount that you owe a vendor.


        See Vendor credits in the Guides section for more information, sample requests, and responses.'
      operationId: createVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVendorCreditRequestDto'
        required: true
      responses:
        '201':
          description: Create a vendor credit response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendor-credits/bulk:
    put:
      tags:
      - Vendor Credits
      summary: Replace multiple vendor credits
      description: 'Update the number of line items in multiple vendor credits with one API request. You can also update other details for each vendor credit.


        You can use the PUT operation to add, remove, or replace the number of line items in a vendor credit. A set of rules apply with the PUT operation.

        * When you add a new line item, a new line item `id` is generated in the vendor credit.

        * When you omit an existing line item `id`, the line item is removed from the vendor credit.'
      operationId: bulkReplaceVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 50
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/ReplaceVendorCreditWithIdRequestDto'
        required: true
      responses:
        '200':
          description: Replace multiple vendor credits response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Vendor Credits
      summary: Create multiple vendor credits
      description: Create multiple vendor credits with one API request. You can create up to 50 vendor credits with one `POST /v3/vendor-credits/bulk` request.
      operationId: bulkCreateVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 50
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/CreateVendorCreditRequestDto'
        required: true
      responses:
        '201':
          description: Create multiple vendor credits response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Vendor Credits
      summary: Update multiple vendor credits
      description: 'Update details about line items in multiple vendor credits with one API request. You can also update other vendor credit details.


        You can use the PATCH operation to modify line item details, such as `amount`, `quantity`, and `description`. The vendor credit line item `id` does not change with a PATCH operation.'
      operationId: bulkUpdateVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 50
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/UpdateVendorCreditWithIdRequestDto'
        required: true
      responses:
        '200':
          description: Update multiple vendor credits response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendor-credits/bulk/archive:
    post:
      tags:
      - Vendor Credits
      summary: Archive multiple vendor credits
      description: Archive multiple vendor credits with one API request. In the response, the `archived` field for each object is set as `true`. An archived vendor credit cannot be restored.
      operationId: bulkArchiveVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: ids
        in: query
        required: true
        schema:
          type: string
          description: BILL-generated IDs of the vendor credits. Each value begin with `vcr`. Set the IDs as comma-separated values.
          example: '{{vendor_credit_id}}'
      responses:
        '200':
          description: Archive multiple vendor credits response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditBulkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendor-credits/{vendorCreditId}:
    get:
      tags:
      - Vendor Credits
      summary: Get vendor credit details
      description: Get details about an existing vendor credit.
      operationId: getVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorCreditId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor credit. The value begins with `vcr`.
          example: '{{vendor_credit_id}}'
      responses:
        '200':
          description: Get vendor credit details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditWithUsageResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    put:
      tags:
      - Vendor Credits
      summary: Replace a vendor credit
      description: 'Update the number of line items in a vendor credit. You can also update other vendor credit details.


        You can use the PUT operation to add, remove, or replace the number of line items in a vendor credit. A set of rules apply with the PUT operation.

        * When you add a new line item, a new line item `id` is generated in the vendor credit.

        * When you omit an existing line item `id`, the line item is removed from the vendor credit.'
      operationId: replaceVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorCreditId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor credit. The value begins with `vcr`.
          example: '{{vendor_credit_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceVendorCreditRequestDto'
        required: true
      responses:
        '200':
          description: Replace a vendor credit response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Vendor Credits
      summary: Update a vendor credit
      description: 'Update details about a vendor credit line item. You can also update other vendor credit line item details.


        You can use the PATCH operation to modify line item details, such as `amount`, `quantity`, and `description`. The vendor credit line item `id` does not change with a PATCH operation.'
      operationId: updateVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorCreditId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor credit. The value begins with `vcr`.
          example: '{{vendor_credit_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVendorCreditRequestDto'
        required: true
      responses:
        '200':
          description: Update a vendor credit response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/vendor-credits/{vendorCreditId}/archive:
    post:
      tags:
      - Vendor Credits
      summary: Archive a vendor credit
      description: Archive an existing vendor credit. In the response, the `archived` field is set as `true`. An archived vendor credit cannot be restored.
      operationId: archiveVendorCredit
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorCreditId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor credit. The value begins with `vcr`.
          example: '{{vendor_credit_id}}'
      responses:
        '200':
          description: Archive a vendor credit response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorCreditResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    VendorCreditUsageDto:
      type: object
      properties:
        billId:
          type: string
          description: BILL-generated ID of the bill to which the vendor credit is applied
        paymentId:
          type: string
          description: BILL-generated ID of the payment to which the vendor credit is applied
        amount:
          type: number
          description: Vendor credit amount applied
      description: VendorCredit usage Dto.
    ReplaceVendorCreditWithIdRequestDto:
      required:
      - creditDate
      - id
      - referenceNumber
      - vendorCreditLineItems
      - vendorId
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor credit. The value begins with `vcr`.
        vendorId:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
        referenceNumber:
          maxLength: 100
          minLength: 1
          type: string
          description: User-generated vendor credit number. This value can be in your chosen number scheme.
        creditDate:
          type: string
          description: Vendor credit issued date. This value is in the `yyyy-MM-dd` format.
          format: date
        description:
          type: string
          description: Vendor credit description
        applyToChartOfAccountId:
          type: string
          description: BILL-generated ID of the chart of accounts used when the vendor credit is applied to a bill payment. The value begins with `0ca`.
        applyToBankAccountId:
          type: string
          description: 'BILL-generated ID of the bank account used when the vendor credit is applied to a bill payment. The value begins with `bac`.


            **Note**: You can set only one of `applyToChartOfAccountId` or `applyToBankAccountId`.'
        vendorCreditLineItems:
          minItems: 1
          type: array
          description: Vendor credit line item information
          items:
            $ref: '#/components/schemas/ReplaceVendorCreditLineItemDto'
      description: Replace VendorCredit request Dto.
    VendorCreditResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the vendor credit. The value begins with `vcr`.
        vendorId:
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
        referenceNumber:
          type: string
          description: User-generated vendor credit number. This value can be in your chosen number scheme.
        creditDate:
          type: string
          description: Vendor credit issued date. This value is in the `yyyy-MM-dd` format.
          format: date
        description:
          type: string
          description: Vendor credit description
        archived:
          type: boolean
          description: Set as `true` if the vendor credit is archived
        applyToChartOfAccountId:
          type: string
          description: BILL-generated ID of the chart of accounts used when the vendor credit is applied to a bill payment. The value begins with `0ca`.
        applyToBankAccountId:
          type: string
          description: 'BILL-generated ID of the bank account used when the vendor credit is applied to a bill payment. The value begins with `bac`.


            **Note**: You can set only one of `applyToChartOfAccountId` or `applyToBankAccountId`.'
        amount:
          type: number
          description: Vendor credit amount
        appliedAmount:
          type: number
          description: Vendor credit amount applied to invoices
        status:
          allOf:
          - $ref: '#/components/schemas/CreditStatusDto'
          - description: Vendor credit status.
        createdTime:
          type: string
          description: Vendor credit created time
          format: date-time
        updatedTime:
          type: string
          description: Vendor credit updated time
          format: date-time
        vendorCreditLineItems:
          type: array
          description: Vendor credit line item information
          items:
            $ref: '#/components/schemas/VendorCreditLineItemResponseDto'
      description: VendorCredit response Dto.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    CreateVendorCreditLineItemDto:
      required:
      - amount
      type: object
      properties:
        description:
          type: string
          description: Vendor credit line item description
        amount:
          type: number
          description: Vendor credit line item amount. For a vendor credit in an international currency (not USD), this value is in the local currency.
        classifications:
          allOf:
          - $ref: '#/components/schemas/VendorCreditLineItemClassificationsDto'
          - description: General ledger classifications information for the vendor credit line item
      description: Vendor Credit Create Request Line Item.
    VendorCreditWithUsageResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the vendor credit. The value begins with `vcr`.
        vendorId:
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
        referenceNumber:
          type: string
          description: User-generated vendor credit number. This value can be in your chosen number scheme.
        creditDate:
          type: string
          description: Vendor credit issued date. This value is in the `yyyy-MM-dd` format.
          format: date
        description:
          type: string
          description: Vendor credit description
        archived:
          type: boolean
          description: Set as `true` if the vendor credit is archived
        applyToChartOfAccountId:
          type: string
          description: BILL-generated ID of the chart of accounts used when the vendor credit is applied to a bill payment. The value begins with `0ca`.
        applyToBankAccountId:
          type: string
          description: 'BILL-generated ID of the bank account used when the vendor credit is applied to a bill payment. The value begins with `bac`.


            **Note**: You can set only one of `applyToChartOfAccountId` or `applyToBankAccountId`.'
        amount:
          type: number
          description: Vendor credit amount
        appliedAmount:
          type: number
          description: Vendor credit amount applied to invoices
        status:
          allOf:
          - $ref: '#/components/schemas/CreditStatusDto'
          - description: Vendor credit status.
        createdTime:
          type: string
          description: Vendor credit created time
          format: date-time
        updatedTime:
          type: string
          description: Vendor credit updated time
          format: date-time
        vendorCreditLineItems:
          type: array
          description: Vendor credit line item information
          items:
            $ref: '#/components/schemas/UpdateVendorCreditLineItemDto'
        usage:
          type: array
          description: Vendor credit usage information
          items:
            $ref: '#/components/schemas/VendorCreditUsageDto'
      description: VendorCredit response Dto with usage.
    UpdateVendorCreditLineItemDto:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor credit line item. The value begins with `vci`.
        description:
          type: string
          description: Vendor credit line item description
        amount:
          type: number
          description: Vendor credit line item amount. For a vendor credit in an international currency (not USD), this value is in the local currency.
        classifications:
          allOf:
          - $ref: '#/components/schemas/VendorCreditLineItemClassificationsDto'
          - description: General ledger classifications information for the vendor credit line item
      description: Vendor Credit Create Request Line Item.
    ListVendorCreditResponseDto:
      type: object
      description: Response from a list API request with paging references.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_VendorCreditWithUsageResponseDto_'
    UpdateVendorCreditWithIdRequestDto:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor credit. The value begins with `vcr`.
        vendorId:
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
        referenceNumber:
          maxLength: 100
          type: string
          description: User-generated vendor credit number. This value can be in your chosen number scheme.
        creditDate:
          type: string
          description: Vendor credit issued date. This value is in the `yyyy-MM-dd` format.
          format: date
        description:
          type: string
          description: Vendor credit description
        applyToChartOfAccountId:
          type: string
          description: BILL-generated ID of the chart of accounts used when the vendor credit is applied to a bill payment. The value begins with `0ca`.
        applyToBankAccountId:
          type: string
          description: 'BILL-generated ID of the bank account used when the vendor credit is applied to a bill payment. The value begins with `bac`.


            **Note**: You can set only one of `applyToChartOfAccountId` or `applyToBankAccountId`.'
        vendorCreditLineItems:
          type: array
          description: Vendor credit line item information
          items:
            $ref: '#/components/schemas/UpdateVendorCreditLineItemDto'
      description: Update VendorCredit with id request Dto.
    ReplaceVendorCreditRequestDto:
      required:
      - creditDate
      - referenceNumber
      - vendorCreditLineItems
      - vendorId
      type: object
      properties:
        vendorId:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
        referenceNumber:
          maxLength: 100
          minLength: 1
          type: string
