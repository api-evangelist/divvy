        schema:
          type: string
          description: List of BILL-generated IDs of accounting classes. Each value begins with `cls`. Set the IDs as comma-separated values.
          example: '{{accounting_class_id}}'
      responses:
        '200':
          description: Archive multiple accounting classes response
          content:
