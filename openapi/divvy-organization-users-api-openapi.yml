openapi: 3.2.0
info:
  title: BILL v3 Organization Users API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: organization-users
paths:
  /v3/users:
    get:
      tags:
      - organization-users
      summary: Get list of users
      description: 'Get a list of user objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listOrganizationUsers
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{org_user_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of users response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - organization-users
      summary: Create a user
      description: 'Create a new user. The currently signed-in user must have the `ADMINISTRATOR` user role in the BILL organization to perform this operation.


        When you create a user, BILL sends an email to the user for them to complete their sign-up. After user sign-up is complete, the user can access features in your BILL organization depending on the user role.


        See Organizations and Users in the Guides section for more information, sample requests, and responses.'
      operationId: createOrganizationUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUserCreateRequestDto'
        required: true
      responses:
        '201':
          description: Create a user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/users/{userId}:
    get:
      tags:
      - organization-users
      summary: Get user details
      description: Get details about an existing user.
      operationId: getOrganizationUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{org_user_id}}'
      responses:
        '200':
          description: Get user details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - organization-users
      summary: Update a user
      description: Update details about an existing user.
      operationId: updateOrganizationUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{org_user_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUserUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Update a user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/users/{userId}/archive:
    post:
      tags:
      - organization-users
      summary: Archive a user
      description: 'Archive an existing user. In the response, the `archived` field is set as `true`."


        You can restore an archived user with `POST /v3/users/{userId}/restore`. There is no change when you archive an archived user.'
      operationId: archiveOrganizationUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{org_user_id}}'
      responses:
        '200':
          description: Archive a user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/users/{userId}/restore:
    post:
      tags:
      - organization-users
      summary: Restore an archived user
      description: 'Restore an archived user. In the response, the `archived` field is set as `false`.


        You can perform any valid BILL operation on restored users. There is no change when you restore a restored user.'
      operationId: restoreOrganizationUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
          example: '{{org_user_id}}'
      responses:
        '200':
          description: Restore an archived user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    OrganizationUserCreateRequestDto:
      required:
      - acceptTermsOfService
      - email
      - firstName
      - lastName
      - roleId
      type: object
      properties:
        firstName:
          maxLength: 100
          minLength: 1
          type: string
          description: User first name
        lastName:
          maxLength: 100
          minLength: 1
          type: string
          description: User last name
        email:
          minLength: 1
          type: string
          description: User email address
        roleId:
          minLength: 1
          type: string
          description: 'BILL-generated ID of the user role. The value begins with `0po`.


            If you do not set `roleId`, the default `ADMINISTRATOR` user role is assigned to the created user. You can get the list of available user roles with `GET /v3/roles`.'
        acceptTermsOfService:
          type: boolean
          description: Set as `true` if the user accepts the BILL terms of service
      description: Create a user
      example:
        firstName: Clark
        lastName: Billenterson
        email: info@happymusicsupplies.org
        roleId: '{{org_user_role_id}}'
        acceptTermsOfService: true
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    ListUserResponseDto:
      type: object
      description: Get list of vendors response.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_OrganizationUserResponseDto_'
    BdcError:
      required:
      - category
      - code
      - severity
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        category:
          $ref: '#/components/schemas/Category'
        message:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        detail:
          type: string
        help:
          type: string
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    OrganizationUserResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the user. The value begins with `006`.
        archived:
          type: boolean
          description: Set as `true` if the user is archived
        firstName:
          type: string
          description: User first name
        lastName:
          type: string
          description: User last name
        email:
          type: string
          description: User email address
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleResponseDto'
          - description: User role information
        createdTime:
          type: string
          description: Created date and time
          format: date-time
        updatedTime:
          type: string
          description: Updated date and time
          format: date-time
      description: Users response.
    ListResponseDto_OrganizationUserResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
        prevPage:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationUserResponseDto'
      description: Response from a list API request with paging references.
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
      - DOWNSTREAM
    OrganizationUserRoleType:
      type: string
      description: Enumeration of organization user roles.
      enum:
      - ADMINISTRATOR
      - CLERK
      - APPROVER
      - ACCOUNTANT
      - CUSTOM
      - PAYER
      - PARTNER
      - AUDITOR
      - NO_ACCESS
      - MEMBER
      - MEMBER_PLUS
      - INTERNAL
      - PURCHASE_REQUESTER
      - CONSOLE_CUSTOM
      - RECEIVER
      - PROCUREMENT_USER
      - UNDEFINED
    UserRoleResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the user role. The value begins with `0po`.
        type:
          allOf:
          - $ref: '#/components/schemas/OrganizationUserRoleType'
          - description: User role type.
        description:
          type: string
          description: User role description
      description: User roles response.
    OrganizationUserUpdateRequestDto:
      type: object
      properties:
        firstName:
          maxLength: 100
          type: string
          description: User first name
        lastName:
          maxLength: 100
          type: string
          description: User last name
        roleId:
          type: string
          description: 'BILL-generated ID of the user role. The value begins with `0po`.


            If you do not set `roleId`, the default `ADMINISTRATOR` user role is assigned to the created user. You can get the list of available user roles with `GET /v3/roles`.'
      description: Update a user (last name updated)
      example:
        lastName: Billson
