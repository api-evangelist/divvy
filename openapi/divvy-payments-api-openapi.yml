      - RTP_DELIVERY
    PaymentVendorCreditResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the vendor credit applied to the bill payment. The value begins with `vcr`.
        amount:
          type: number
          description: Credit amount
      description: Payment vendor credit response DTO.
    DisbursementStatus:
      type: string
      description: The enum type for disbursement status.
      enum:
      - SCHEDULE
      - DONE
      - FAILED
      - VOID
      - HOLD
      - FXHOLD
      - ESCHEATED
      - UNDEFINED
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
      - DOWNSTREAM
    BulkPaymentRequestDto:
      required:
      - fundingAccount
      type: object
      properties:
        vendorId:
          type: string
          description: 'BILL-generated ID of the vendor to be paid. The value begins with `009`.

            * If `vendorId` is set, it must match each bill’s vendor ID.

            * Do not set `vendorId` when you are paying multiple vendors with one request.'
        description:
          maxLength: 70
          type: string
          description: Bill payment description. This value is included in the check memo or in the bank descriptor for electronic payments.
        processDate:
          type: string
          description: 'Payment process date in the `yyyy-MM-dd` format. On this date, BILL starts processing the payment and starts withdrawing funds from the sender''s funding account.


            When the vendor bill currency is not `USD` (For example, `EUR`), the payment `processDate` for this vendor must be the next US business day.


            If the funding account `type` is set as `WALLET` or `AP_CARD`, `processDate` is required. For other funding account types, if `processDate` is not set, the date is automatically set as the next US business day.


            **Note**: When you add a vendor bank account in the production environment, BILL requires 2 business days to complete a one-time verification of the bank account. To pay such a vendor, you must set a `processDate` that is 2 business days from the current date.'
          format: date
        exchangeRateBatchId:
          type: integer
          description: 'Exchange rate batch ID. This field is required for paying international vendors when the vendor bill currency is not `USD`.


            Get the current BILL exchange rate and exchange rate batch ID with `GET /v3/payments/exchange-rate` or `POST /v3/payments/exchange-rate` (for multiple international vendors).

            '
          format: int32
        fundingAccount:
          allOf:
          - $ref: '#/components/schemas/FundingAccountRequest'
          - description: Payment funding information
        payments:
          type: array
          items:
            $ref: '#/components/schemas/BillPay'
        processingOptions:
          allOf:
          - $ref: '#/components/schemas/BulkProcessingOptions'
          - description: Payment processing options
        transactionNumber:
          maxLength: 50
          type: string
          description: 'Payment transaction reference used as an external identifier.


            You can set this field as a unique alphanumeric value for your system to track the payment transaction. The value must be 50 characters or fewer. If you do not set `transactionNumber`, BILL sets this field as a unique alphanumeric payment identification value.'
        cardFundingPurpose:
          type: string
          description: 'Card funding purpose. This field is required for the `CARD_ACCOUNT` funding account `type` if BILL cannot identify the vendor industry.


            See [Get card funding purpose](https://developer.bill.com/reference/listcardfundingpurposes) for more information.'
      description: Create a bulk payment
      example:
        processDate: '2026-12-16'
        fundingAccount:
          type: BANK_ACCOUNT
          id: '{{org_bank_account_id}}'
        payments:
        - billId: '{{bill_id01}}'
          amount: 228.99
        - billId: '{{bill_id02}}'
          amount: 142
    ExchangeRateListResponseDto:
      type: object
      properties:
        billCurrency:
          allOf:
          - $ref: '#/components/schemas/CurrencyCode'
          - description: Bill currency. This is the currency in which vendor bills are presented.
        paymentCurrency:
          allOf:
          - $ref: '#/components/schemas/CurrencyCode'
          - description: Payment currency. This is the currency in which the vendor accepts payments.
        baseCurrency:
          allOf:
          - $ref: '#/components/schemas/CurrencyCode'
          - description: Organization base currency.
        exchangeRate:
          type: number
          description: 'Exchange rate. This rate compares the organization''s base currency and the vendor `paymentCurrency` value.


            For example, if the organization''s base currency is USD and the vendor `paymentCurrency` is CAD, an `exchangeRate` of `1.372` tells us that `1 USD = 1.372 CAD`.

            '
        vendorId:
          type: string
          description: 'BILL-generated ID of the international vendor

            '
        amountRange:
          allOf:
          - $ref: '#/components/schemas/ValidExchangeRateRangeDto'
          - description: 'Payment amount range information for the exchange rate. The `exchangeRate` is valid for the amount range specified with the `from` and `to` values.


              When you set `baseCurrency` as `false` in your request, this range is in the vendor `paymentCurrency` value.

              '
        expirationTime:
          type: string
          description: Exchange rate batch expiration date and time
          format: date-time
      description: Exchange Rate Response DTO.
    VoidType:
      type: string
      description: Void type enum.
      enum:
      - VOID_AND_CREDIT
      - VOID_AND_REISSUE
      - VOID_ONLY
      - VOID_AND_REISSUE_VCARD
    PaymentPurposeRequest:
      type: object
      properties:
        text:
          maxLength: 250
          type: string
          description: Payment purpose text. This can be any user-defined text. If you set `text`, do not set `code`.
        code:
          allOf:
          - $ref: '#/components/schemas/PaymentPurposeCodeRequest'
          - description: Payment purpose code. If you set the `code` object, do not set `text`.
      description: Payment purpose request.
    VoidStatus:
      type: string
      description: Void status enum.
      enum:
      - TO_BE_PROCESSED
      - ACCEPTED
      - REJECTED
      - NO_OP
      - ARCHIVED
    BankFundingOption:
      type: object
      description: Bank Funding option.
      allOf:
      - $ref: '#/components/schemas/FundingOption'
      - properties:
          id:
            type: string
            description: BILL-generated ID of the bank account. The value begins with `bac`.
          name:
            type: string
            description: Bank name
          fee:
            type: number
            description: Estimated bank fees
    BdcError:
      required:
      - category
      - code
      - severity
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        category:
          $ref: '#/components/schemas/Category'
        message:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        detail:
          type: string
        help:
          type: string
    ScheduledPaymentDto:
      type: object
      properties:
        billId:
          type: string
          description: BILL-generated ID of the bill. The value begins with `00n`.
      description: Scheduled payment DTO.
    PaymentPurposeCodeRequest:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Name
      description: Payment purpose code request.
    VoidInfo:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the void payment request. The value begins with `vrq`.
        requestedBy:
          type: string
          description: BILL-generated ID of the user that requested a void payment. The value begins with `006`.
        type:
          allOf:
          - $ref: '#/components/schemas/VoidType'
          - description: Void payment request type.
        status:
          allOf:
          - $ref: '#/components/schemas/VoidStatus'
          - description: Void payment request status.
        reason:
          type: string
          description: Void payment request reason
        createdTime:
          type: string
          description: Void payment request created date and time
          format: date-time
        updatedTime:
          type: string
          description: Void payment request updated date and time
          format: date-time
      description: Void information for the Payments DTO.
    BillPayment:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the bill payment. The value begins with `blp`.
        billId:
          type: string
          description: BILL-generated ID of the bill to be paid. The value begins with `00n`.
        amount:
          type: number
          description: Payment amount. For a payment in an international currency (not USD), this value is in the local currency.
        vendorCredits:
