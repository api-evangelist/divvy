openapi: 3.2.0
info:
  title: BILL v3 Payments API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Payments
paths:
  /v3/payments:
    get:
      tags:
      - Payments
      summary: Get list of payments
      description: 'Get a list of payment objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listPayments
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{payment_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of payments response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Payments
      summary: Create a payment
      description: 'Create a payment.


        See Get list of vendor payment options to get details about vendor payment options and payment process dates.


        **Note**: Creating a payment requires an MFA-trusted API session. See MFA setup for information about the BILL MFA process.


        See Payments in the Guides section for more information, sample requests, and responses.'
      operationId: createPayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestDto'
        required: true
      responses:
        '201':
          description: Create a payment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/bulk:
    post:
      tags:
      - Payments
      summary: Create a bulk payment
      description: 'Create a request for paying multiple bills. You can pay up to 50 bills with one `POST /v3/payments/bulk` request.


        Bulk payments at BILL follow a set of rules.

        * **Successful response**: In your bulk payment request, all your bill payments must be successful for a successful response. If any bill payment is not successful, the entire request fails and none of the bills in the request are paid.

        * **You can pay multiple vendors**: You can pay multiple vendors with one `POST /v3/payments/bulk` request. In this case, make sure that you do not set `vendorId` in your request.

        * **You can only pay existing bills**: When you create a single payment with `POST /v3/payments`, you can set `createBill` as `true` in your request for creating a new bill for a vendor payment. In your bulk payment request, an existing `billId` is required for each bill to be paid.

        * **Vendors with `"combinePayments": true`**: When you create a bulk payment for a vendor that has `"combinePayments": true`, BILL combines payments for up to 35 bills in one `payments` response object, and then combines payments for the remaining bills in a second `payments` response object.


        See Get list of vendor payment options to get details about vendor payment options and payment process dates.


        **Note**: Creating a bulk payment requires an MFA-trusted API session. See MFA setup for information about the BILL MFA process.


        See Payments in the Guides section for more information, sample requests, and responses.'
      operationId: createBulkPayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPaymentRequestDto'
        required: true
      responses:
        '201':
          description: Create a bulk payment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/exchange-rate:
    get:
      tags:
      - Payments
      summary: Get BILL exchange rate
      description: 'Get the current BILL exchange rate and exchange rate batch ID for paying an international vendor. When the vendor bill currency is not `USD`, the exchange rate batch ID is required for creating a payment with `POST /v3/payments` or `POST /v3/payments/bulk`.


        BILL maintains all `exchangeRate` values in a batch. When a batch expires, a new batch ID is generated and all `exchangeRate` values are updated in the new batch. Use this endpoint to get the current exchange rate and batch ID based on the payment amount and vendor bill currency.


        In production, a BILL batch is valid for a maximum of 20 minutes. response provides the timestamp when the current batch will expire. For example, if a batch has been active for 17 minutes when you get the `exchangeRateBatchId`, `expirationTime` indicates that you have 3 minutes remaining (with `POST /v3/payments` or `POST /v3/payments/bulk`).


        **Note**:

        * International vendor payment information is required for you to get the BILL exchange rate with this endpoint.

        * When the vendor bill currency is not `USD`, the payment `processDate` **must be** the next US business day.'
      operationId: getExchangeRate
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: query
        required: true
        schema:
          type: string
          description: BILL-generated ID of the international vendor to be paid. The value begins with `009`.
          example: '{{vendor_id}}'
      - name: amount
        in: query
        required: true
        schema:
          type: number
          description: Payment amount. The amount is in the vendor bill currency.
          example: 1000
      responses:
        '200':
          description: Get BILL exchange rate response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRateResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Payments
      summary: Get BILL exchange rates for multiple vendors
      description: 'Get the current BILL exchange rate and exchange rate batch ID for multiple international vendors with one API request. When the vendor bill currency is not `USD`, the exchange rate batch ID is required for creating a payment with `POST /v3/payments` or `POST /v3/payments/bulk`.


        BILL maintains all `exchangeRate` values in a batch. When a batch expires, a new batch ID is generated and all `exchangeRate` values are updated in the new batch. Use this endpoint to get the current exchange rate and batch ID based on the payment amount and vendor bill currency.


        In production, a BILL batch is valid for a maximum of 20 minutes. response provides the timestamp when the current batch will expire. For example, if a batch has been active for 17 minutes when you get the `exchangeRateBatchId`, `expirationTime` indicates that you have 3 minutes remaining (with `POST /v3/payments` or `POST /v3/payments/bulk`).


        **Note**:

        * International vendor payment information is required for you to get BILL exchange rates with this endpoint.

        * When the vendor bill currency is not `USD`, the payment `processDate` **must be** the next US business day.'
      operationId: getExchangeRates
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              minItems: 1
              type: array
              items:
                $ref: '#/components/schemas/ExchangeRateRequestDto'
        required: true
      responses:
        '200':
          description: Get BILL exchange rates for multiple vendors response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeRatesResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/mass:
    post:
      tags:
      - Payments
      summary: Create a mass payment
      description: 'Create a mass payment request for up to 2000 bills. BILL processes each payment in the mass payment request asynchronously.


        In the response, a BILL-generated payment batch ID is available. You can track the current status of each payment in a mass payment batch with `GET /v3/payments/mass/{paymentBatchId}`.


        **Note**: Creating a mass payment requires an MFA-trusted API session. See MFA setup for information about the BILL MFA process.'
      operationId: createMassPayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MassPaymentRequestDto'
        required: true
      responses:
        '201':
          description: Create a mass payment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassPaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/mass/{paymentBatchId}:
    get:
      tags:
      - Payments
      summary: Get mass payment status
      description: 'Get details about an existing mass payment batch.


        In the response, you get the status of each payment in the mass payment batch. Each payment is either `scheduled`, `completed`, or `failed`. In addition, you get the `count` for the total number of payments in the mass payments batch.


        **Note**: From the list of `completed` payments in the response, BILL begins processing payments based on the payment `processDate`.'
      operationId: getMassPayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: paymentBatchId
        in: path
        required: true
        schema:
          type: string
          description: BILL-generated ID of the mass payment batch. The value begins with `bbq`.
          example: '{{mass_payment_batch_id}}'
      responses:
        '200':
          description: Get mass payment status response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MassPaymentDetailsResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/options:
    get:
      tags:
      - Payments
      summary: Get list of vendor payment options
      description: 'Get a list of vendor payment options available based on the funding account options available in the signed-in user''s BILL organization and on the payment methods accepted by a vendor.


        See Vendor payment options in the Guides section for more information, sample requests, and responses.'
      operationId: listPaymentOptions
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: query
        required: true
        schema:
          type: string
          description: BILL-generated ID of the vendor to be paid. The value begins with `009`.
          example: '{{vendor_id}}'
      - name: amount
        in: query
        required: true
        schema:
          type: number
          description: Vendor payment amount
          example: 100
      responses:
        '200':
          description: Get list of vendor payment options response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOptionsResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/{paymentId}:
    get:
      tags:
      - Payments
      summary: Get payment details
      description: Get details about an existing payment.
      operationId: getPayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: paymentId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the payment. The value begins with `stp`.
          example: '{{payment_id}}'
      responses:
        '200':
          description: Get payment details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/{paymentId}/cancel:
    post:
      tags:
      - Payments
      summary: Cancel a payment
      description: 'Cancel an existing payment.


        You can cancel a payment only when the payment `singleStatus` is `SCHEDULED`. When BILL starts processing the payment, the payment `singleStatus` changes. At that point, you cannot cancel the payment. You can attempt to void the payment with `POST /v3/payments/{paymentId}/void`.'
      operationId: cancelPayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: paymentId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the payment. The value begins with `stp`.
          example: '{{payment_id}}'
      responses:
        '200':
          description: Cancel a payment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/{paymentId}/check-image:
    get:
      tags:
      - Payments
      summary: Get check image data
      description: 'Get an image of an existing check sent to a vendor.


        The check image is available when the vendor bank processes the check payment. BILL checks in with the bank every 30 minutes to get the check image. The image file format is determined by the vendor bank.


        From the response, use `downloadLink` in a GET request to download the front and back images of the check.


        ```

        curl ''{downloadLink}'' --header ''sessionId: {session_id}'' --output {check_name}

        ```'
      operationId: getCheckImageData
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: paymentId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the payment. The value begins with `stp`.
          example: '{{payment_id}}'
      responses:
        '200':
          description: Get check image data response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckImageDataResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/payments/{paymentId}/void:
    post:
      tags:
      - Payments
      summary: Void a payment
      description: 'Void an existing payment.


        Void a bill payment that has started processing and cannot be canceled (with `POST /v3/payments/{paymentId}/cancel`). You can attempt to void payments made both with BILL (online) and outside BILL (offline).


        ### Void a payment made with BILL (online)


        In your /`POST /v3/payments/{paymentId}/void` request:

        * Set `paymentId` as the BILL-generated ID of the payment. The value begins with `stp`.

        * Set `type` as the void payment request type

        * Set `reason` as the reason for voiding the payment


        See Can I cancel or void a Payables payment? in the BILL Help Center to learn about the BILL void payment process and timing in the production environment.'
      operationId: voidPayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: paymentId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the payment. The value begins with `stp`.
          example: '{{payment_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidRequestDto'
        required: true
      responses:
        '200':
          description: Void a payment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    PaymentRequestDto:
      required:
      - amount
      - fundingAccount
      - processingOptions
      type: object
      properties:
        vendorId:
          type: string
          description: 'BILL-generated ID of the vendor to be paid. The value begins with `009`.

            * If `vendorId` is set, it must match your bill’s vendor ID.

            * If `vendorId` is not set, the bill’s `vendorId` is automatically set.'
        billId:
          type: string
          description: BILL-generated ID of the bill to be paid. The value begins with `00n`. If `createBill` is `true`, do not set `billId` in your payment request.
        description:
          maxLength: 70
          type: string
          description: Bill payment description. This value is included in the check memo or in the bank descriptor for electronic payments.
        processDate:
          type: string
          description: 'Payment process date in the `yyyy-MM-dd` format. On this date, BILL starts processing the payment and starts withdrawing funds from the sender''s funding account.


            If the funding account `type` is set as `WALLET` or `AP_CARD`, `processDate` is required. For other funding account types, if `processDate` is not set, the date is automatically set as the next US business day.


            **Note**: When you add a vendor bank account in the production environment, BILL requires 2 business days to complete a one-time verification of the bank account. To pay such a vendor, you must set a `processDate` that is 2 business days from the current date.'
          format: date
        exchangeRateBatchId:
          type: integer
          description: 'Exchange rate batch ID. This field is required for paying international vendors when the vendor bill currency is not `USD`.


            Get the current BILL exchange rate and exchange rate batch ID with `GET /v3/payments/exchange-rate`.

            '
          format: int32
        fundingAccount:
          allOf:
          - $ref: '#/components/schemas/FundingAccountRequest'
          - description: Payment funding information (Bank account, card account, or wallet)
        amount:
          type: number
          description: 'Payment amount. For a payment in an international currency (not USD), this value is in the local currency.


            **Note**: You cannot overpay a bill.'
        processingOptions:
          allOf:
          - $ref: '#/components/schemas/ProcessingOptionsRequest'
          - description: Payment processing options
        paymentPurpose:
          allOf:
          - $ref: '#/components/schemas/PaymentPurposeRequest'
          - description: 'Payment purpose information for compliance with international payment rules of the vendor country. This one-time configuration is required for enabling electronic payments to international vendors.


              You can set `paymentPurpose` at the time of creating a vendor, updating vendor details, or creating a payment. To set `paymentPurpose` at the time of creating a payment, use the information from `GET /v3/vendors/{vendorId}/configuration`.


              **Note**: Set `paymentPurpose` only when it is required. Vendor countries, like Japan, do not require any payment purpose information. For such countries, setting `paymentPurpose` in your request results in an error response.


              See [Create an international vendor](https://developer.bill.com/docs/creating-an-international-vendor) for more information on how to set `paymentPurpose`.'
        transactionNumber:
          maxLength: 50
          type: string
          description: 'Payment transaction reference used as an external identifier.


            You can set this field as a unique alphanumeric value for your system to track the payment transaction. The value must be 50 characters or fewer. If you do not set `transactionNumber`, BILL sets this field as a unique alphanumeric payment identification value.'
        cardFundingPurpose:
          type: string
          description: 'Card funding purpose. This field is required for the `CARD_ACCOUNT` funding account `type` if BILL cannot identify the vendor industry.


            See [Get card funding purpose](https://developer.bill.com/reference/listcardfundingpurposes) for more information.'
        vendorCredits:
          type: array
          description: Vendor credits applied to the bill payment. To edit the vendor credit amount applied to the bill, set the same vendor credit `id` in your payment request. To apply an additional vendor credit to the bill, set the new vendor credit `id` in your payment request.
          items:
            $ref: '#/components/schemas/PaymentVendorCreditRequestDto'
      description: Create a payment
      example:
        vendorId: '{{vendor_id}}'
        billId: '{{bill_id}}'
        processDate: '2026-12-31'
        fundingAccount:
          type: BANK_ACCOUNT
          id: '{{org_bank_account_id}}'
        amount: 228.99
