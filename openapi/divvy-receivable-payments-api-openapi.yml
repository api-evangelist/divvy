openapi: 3.2.0
info:
  title: BILL v3 Receivable Payments API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: receivable-payments
paths:
  /v3/receivable-payments:
    get:
      tags:
      - receivable-payments
      summary: Get list of received payments
      description: 'Get a list of received payment objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listReceivablePayments
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{received_payment_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of received payments response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReceivablePaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - receivable-payments
      summary: Charge a customer
      description: 'Charge a customer for one or more invoices.


        Charging a customer follows a set of rules.

        * **Customer authorization**: The customer `authorizedToCharge` field must be set as `true` for you to charge the customer for invoices. Set charge customer authorization with `POST /v3/customers/{customerId}/charge-authorization`.

        * **Customer bank account**: A customer bank account is required for you to charge a customer. Create a customer bank account with `POST /v3/customers/{customerId}/bank-accounts`.'
      operationId: chargeCustomer
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeCustomerRequestDto'
        required: true
      responses:
        '201':
          description: Charge a customer response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivablePaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/receivable-payments/{receivedPaymentId}:
    get:
      tags:
      - receivable-payments
      summary: Get received payment details
      description: Get details about an existing received payment.
      operationId: getReceivablePayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: receivedPaymentId
        in: path
        required: true
        schema:
          type: string
          description: BILL-generated ID of the received payment. The value begins with `0rp`.
          example: '{{received_payment_id}}'
      responses:
        '200':
          description: Get received payment details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivablePaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    FundingAccountRequestDto:
      required:
      - id
      - type
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the customer funding account. For a customer bank account, the value begins with `cba`.
        type:
          allOf:
          - $ref: '#/components/schemas/ReceivableFundingAccountTypeRequestDto'
          - description: Customer funding account type.
      description: Funding Account object.
    ReceivableFundingAccountTypeRequestDto:
      type: string
      description: Receivable funding account type for receivable payment API.
      enum:
      - BANK_ACCOUNT
    ReceivablesAccount:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the received payment funding account
        type:
          allOf:
          - $ref: '#/components/schemas/ReceivableFundingAccountTypeResponse'
          - description: Received payment funding account type
      description: Disbursement Account object.
    ListResponseDto_ReceivablePaymentResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
        prevPage:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/ReceivablePaymentResponseDto'
      description: Response from a list API request with paging references.
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    FundingAccount:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the customer funding account
        type:
          allOf:
          - $ref: '#/components/schemas/ReceivableFundingAccountTypeResponse'
          - description: Customer funding account type
      description: Funding Account object.
    ReceivableFundingAccountTypeResponse:
      type: string
      description: Receivable funding account type for receivable payment API.
      enum:
      - BANK_ACCOUNT
      - CARD_ACCOUNT
    BdcError:
      required:
      - category
      - code
      - severity
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        category:
          $ref: '#/components/schemas/Category'
        message:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        detail:
          type: string
        help:
          type: string
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    ReceivablePaymentResponseDto:
      required:
      - amount
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the received payment. The value begins with `0rp`.
        customerId:
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        invoicePayments:
          type: array
          description: List of invoice payments
          items:
            $ref: '#/components/schemas/InvoicePay'
        description:
          type: string
          description: Invoice payment description. This value is included in the check memo or in the bank descriptor for electronic payments.
        paymentDate:
          type: string
          description: Received payment date. Funds are withdrawn from the customer bank account on this date.
          format: date
        fundingAccount:
          allOf:
          - $ref: '#/components/schemas/FundingAccount'
          - description: Customer funding account information
        receivablesAccount:
          allOf:
          - $ref: '#/components/schemas/ReceivablesAccount'
          - description: Received payment funding account information
        amount:
          type: number
          description: Received payment amount. For a payment in an international currency (not USD), this value is in the local currency.
        unappliedAmount:
          type: number
          description: Unapplied received payment amount. This value is available for an overpayment, double payment, or customer payment not currently linked to an invoice.
        convenienceFeeAmount:
          type: number
          description: Convenience fee charged to the customer
        receivablesType:
          allOf:
          - $ref: '#/components/schemas/InvoicePaymentTypeResponse'
          - description: Received payment disbursement type.
        status:
          allOf:
          - $ref: '#/components/schemas/RecordInvoicePaymentStatus'
          - description: Received payment status.
        referenceNumber:
          type: string
          description: Received payment reference number
        onlinePayment:
          type: boolean
          description: 'Information about how the received payment is recorded.

            * `true`: The payment is received with BILL

            * `false`: The payment is received outside BILL, and then recorded in BILL'
        createdTime:
          type: string
          description: Received payment created date and time
          format: date-time
        updatedTime:
          type: string
          description: Received payment updated date and time
          format: date-time
      description: Receivable Payment response.
    InvoicePay:
      type: object
      properties:
        invoiceId:
          type: string
          description: BILL-generated ID of the invoice to be paid. The value begins with `00e`.
        amount:
          type: number
          description: Payment amount. For a payment in an international currency (not USD), this value is in the local currency.
        paymentDate:
          type: string
          description: Invoice payment date. The value is in the `yyyy-MM-dd` format.
          format: date
      description: Invoice Payment response.
    RecordInvoicePaymentStatus:
      type: string
      description: Record Invoice payment status enum.
      enum:
      - PAID
      - VOID
      - SCHEDULED
      - CANCELED
      - ESCHEATED
      - UNDEFINED
    ListReceivablePaymentResponseDto:
      type: object
      description: List Receivable Payment response.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_ReceivablePaymentResponseDto_'
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
      - DOWNSTREAM
    InvoicePayRequestDto:
      required:
      - amount
      - invoiceId
      type: object
      properties:
        invoiceId:
          type: string
          description: BILL-generated ID of the invoice. The value begins with `00e`.
        amount:
          type: number
          description: Payment amount. For a payment in an international currency (not USD), this value is in the local currency.
      description: Invoice Payment request.
    ChargeCustomerRequestDto:
      required:
      - customerId
      - fundingAccount
      - invoicePayments
      type: object
      properties:
        customerId:
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        fundingAccount:
          allOf:
          - $ref: '#/components/schemas/FundingAccountRequestDto'
          - description: Customer funding account information
        description:
          type: string
          description: Invoice payment description. This value is included in the check memo or in the bank descriptor for electronic payments.
        paymentDate:
          type: string
          description: Received payment date. Funds are withdrawn from the customer bank account on this date.This value is in the `yyyy-MM-dd` format.
          format: date
        invoicePayments:
          type: array
          description: List of invoices to be paid
          items:
            $ref: '#/components/schemas/InvoicePayRequestDto'
      description: Charge a customer
      example:
        customerId: '{{customer_id}}'
        fundingAccount:
          id: '{{customer_bank_account_id}}'
          type: BANK_ACCOUNT
        description: Invoice 202602 customer payment
        paymentDate: '2026-12-15'
        invoicePayments:
        - invoiceId: '{{invoice_id}}'
          amount: 100
    InvoicePaymentTypeResponse:
      type: string
      description: Record AR payment type.
      enum:
      - CASH
      - CHECK
      - CREDIT_CARD
      - ACH
      - PAYPAL
      - OTHER
      - WALLET
      - VIRTUAL_CARD
      - UNDEFINED
