openapi: 3.2.0
info:
  title: BILL v3 Budgets API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Budgets
paths:
  /v3/spend/budgets:
    get:
      tags:
      - Budgets
      summary: Get list of budgets
      description: Get a list of budget objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.
      operationId: listBudgets
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: nextPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set this field as the `nextPage` value for navigation.'
      - name: prevPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Previous page of results. Set this field as the `prevPage` value for navigation.
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int64
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. You can set only one sort field.


            The format is `sort={field}:{sort_order}`.


            The sortable fields are:

            - `name`

            - `assigned`

            - `limit`

            - `spent`'
          example: spent:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. You can set multiple filters.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.


            Example: `filters=isBudgetGroup:eq:false,budgetIds:in:"abc,def"`


            The filterable fields are:

            - `isBudgetGroup` - `true` or `false`. Operators: `eq`.

            - `budgetIds` - List of string IDs or UUIDs. Operators: `eq`, `in`.

            - `parentBudgetId` - String ID or UUID. Operators: `eq`.

            - `name` - String. Operators: `eq`, `sw`.

            - `retired` - `true` or `false`. Operators: `eq`.'
          example: budgetIds:eq:{{se_budget_uuid}}
      responses:
        '200':
          description: Get list of budgets response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetsResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Budgets
      summary: Create a budget
      description: 'Create a new budget for a company.


        See Budgets and Users in the Guides section for more information, sample requests, and responses.'
      operationId: createBudget
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreateDto'
        required: true
      responses:
        '200':
          description: Create a budget response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/budgets/{budgetId}:
    get:
      tags:
      - Budgets
      summary: Get budget details
      description: Get details about an existing budget.
      operationId: getBudget
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: budgetId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the budget
          example: '{{se_budget_uuid}}'
      responses:
        '200':
          description: Get budget details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    delete:
      tags:
      - Budgets
      summary: Delete a budget
      description: 'Delete an existing budget. A deleted budget cannot be restored. The deleted budget is not available in the list of budgets.


        **Note**:

        * While you cannot restore a deleted budget with the API, you can unretire budgets in the BILL web app and mobile app. An unretired budget is active and is available for use.

        * A one-time budget can be unretired at any time. A `recurringInterval` budget can be unretired within one interval. For example, if a `MONTHLY` budget is retired in January, you can unretire it in February. You cannot unretire this budget in March or any later month.'
      operationId: deleteBudget
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: budgetId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the budget
          example: '{{se_budget_uuid}}'
      responses:
        '200':
          description: Delete a budget response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Budgets
      summary: Update a budget
      description: Update details about an existing budget.
      operationId: updateBudget
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: budgetId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the budget
          example: '{{se_budget_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetUpdateDto'
        required: true
      responses:
        '200':
          description: Update a budget response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/budgets/{budgetId}/members:
    get:
      tags:
      - Budgets
      summary: Get list of budget members
      description: Get a list of user members assigned to an existing budget. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.
      operationId: listBudgetMembers
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: budgetId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the budget
          example: '{{se_budget_uuid}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int64
          example: 10
      - name: nextPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set this field as the `nextPage` value for navigation.'
      - name: prevPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Previous page of results. Set this field as the `prevPage` value for navigation.
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. You can set only one sort field.


            The format is `sort={field}:{sort_order}`.


            The sortable fields are:

            - `name`

            - `spent`'
          example: spent:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. You can set multiple filters.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.


            Example: `filters=retired:eq:true`


            The filterable fields are:

            - `retired` - `true` or `false`. Operators: `eq`.'
          example: retired:eq:false
      responses:
        '200':
          description: Get list of budget members response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBudgetMemberResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/budgets/{budgetId}/members/bulk:
    put:
      tags:
      - Budgets
      summary: Update multiple budget members
      description: Update details about multiple user members assigned to an existing budget.
      operationId: upsertBulkBudgetUsers
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: budgetId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the budget
          example: '{{se_budget_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetMemberBulkUpsertRequestDto'
        required: true
      responses:
        '200':
          description: Update multiple budget members response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendStatusDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/budgets/{budgetId}/members/{userId}:
    get:
      tags:
      - Budgets
      summary: Get budget member details
      description: Get details about a user member assigned to an existing budget.
      operationId: getBudgetMember
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: budgetId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the budget
          example: '{{se_budget_uuid}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the user
          example: '{{se_user_uuid}}'
      responses:
        '200':
          description: Get budget member details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetMemberResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    put:
      tags:
      - Budgets
      summary: Add or update a budget member
      description: Add a new user member to an existing budget. You can also update details about an existing user member assigned to the budget.
      operationId: upsertBudgetMember
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: budgetId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the budget
          example: '{{se_budget_uuid}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the user
          example: '{{se_user_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetMemberUpsertRequestDto'
        required: true
      responses:
        '200':
          description: Add or update a budget member response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetMemberResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    delete:
      tags:
      - Budgets
      summary: Delete a budget member
      description: Delete a user member from an existing budget.
      operationId: deleteBudgetMember
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: budgetId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the budget
          example: '{{se_budget_uuid}}'
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the user
          example: '{{se_user_uuid}}'
      responses:
        '200':
          description: Delete a budget member response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    BudgetPeriodSpentAmountsDto:
      type: object
      properties:
        cleared:
          type: number
          description: Sum of cleared transactions
        pending:
          type: number
          description: Sum of pending transactions
        total:
          type: number
          description: Sum of all transactions (`cleared + pending`)
      description: Class representing spent amounts for a budget period.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    BudgetPeriodDto:
      type: object
      properties:
        startDate:
          type: string
          description: Budget period start date
          format: date
        endDate:
          type: string
          description: Budget period end date
          format: date
        limit:
          type: number
          description: Budget period spend limit
        overspendBuffer:
          type: number
          description: Spend amount allowed above the budget limit before transactions are declined
        assigned:
          type: number
          description: Total amount assigned to users and vendor cards
        spent:
          allOf:
          - $ref: '#/components/schemas/BudgetPeriodSpentAmountsDto'
          - description: Budget period amount spent information
      description: Class representing a budget's current budget period.
    PeriodIntervalType:
      type: string
      description: PeriodIntervalType.
      enum:
      - NONE
      - DAILY
      - WEEKLY
      - MONTHLY
      - QUARTERLY
      - YEARLY
    PaginationResponseDto_BudgetResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
          description: Next page token
        prevPage:
          type: string
          description: Previous page token
        results:
          type: array
          description: Results
          items:
            $ref: '#/components/schemas/BudgetResponseDto'
      description: Response from a list API request with paging references.
    BudgetShareFundsType:
      type: string
      description: BudgetShareFundsType.
      enum:
      - DO_NOT_SHARE
      - SHARE_MANUALLY
      - SHARE_WITH_ALL_OWNERS
      - SHARE_WITH_ALL_MEMBERS
      - SHARE_ALL_OWNERS_BUT_MEMBERS_MANUALLY
    BudgetMemberResponseDto:
      type: object
      properties:
        userId:
          type: string
          description: BILL-generated ID of the user
          deprecated: true
        userUuid:
          type: string
          description: BILL-generated UUID of the user
        spent:
          type: number
          description: Total amount spent by the user in the current budget period
        limit:
          type: number
          description: Funds assigned to the user in the current budget period
        recurringLimit:
          type: number
          description: Funds assigned to the user in all future budget periods
        recurring:
          type: boolean
          description: Set as `true` if the user receives the `recurringLimit` funds in all future budget periods.
        budgetRole:
          allOf:
          - $ref: '#/components/schemas/BudgetRoleType'
          - description: Budget user role
        name:
          type: string
          description: User display name
        retired:
          type: boolean
          description: Set as `true` if the budget member is retired
        shareBudgetFunds:
          type: boolean
          description: Set as `true` if all the budget funds are shared with the user
      description: Budget members response.
    PaginatedBudgetsResponseDto:
      type: object
      description: List of budgets with paging references.
      allOf:
      - $ref: '#/components/schemas/PaginationResponseDto_BudgetResponseDto_'
    BudgetUpdateDto:
      type: object
      properties:
        name:
          type: string
          description: Budget name
        description:
          type: string
          description: Budget description
        expirationDate:
          type:
          - string
          - 'null'
          description: Budget expiration date. This value is in the `yyyy-MM-dd` format.
          format: date
        recurringInterval:
          allOf:
          - $ref: '#/components/schemas/PeriodIntervalType'
          - description: 'Interval after which the budget is reset. By default, BILL uses the timezone of the company''s billing address to reset a budget at 12 AM.

              * `NONE`: Never

              * `DAILY`: Each day at 12 AM

              * `WEEKLY`: Each Monday at 12 AM

              * `MONTHLY`: On the 1st of every month at 12 AM

              * `QUARTERLY`: Once every 3 months, on the 1st of the month at 12 AM. Set the first month with `recurMonth`.

              * `YEARLY`: Once every year, on the 1st of the month at 12 AM. Set the month with `recurMonth`.'
        recurMonth:
          maximum: 12
          minimum: 1
          type: integer
          description: The month in which the budget will recur. Set this field only when `recurringInterval` is set as `QUARTERLY` or `YEARLY`. The default value is the current month.
          format: int64
        timezone:
          type: string
          description: 'Timezone in which the budget funds are reset. The default value is the timezone of the company''s billing address.


            Set this field in the `US/{time_zone}` format. For example, `US/Pacific` or `US/Mountain`.'
        autoAddUsers:
          type: boolean
          description: Set as `true` to automatically add all new users to this budget
        receiptRequired:
          type: boolean
          description: Set as `true` if a receipt is required for transactions in the budget
        maxTxSize:
          type: number
          description: Maximum transaction size in the budget. Any single transaction for an amount greater than `maxTxSize` will be declined.
        carryOver:
          type: boolean
          description: Set as `true` for any budget funds assigned to users and vendor cards to carry over from one budget period to the next. The budget period is set with `recurringInterval`.
        limitlessOverspend:
          type: boolean
          description: 'Set as `true` for enabling spend amounts over the budget limit.


            **Note**: You cannot set this field as `true` for budgets with `recurringInterval` set as

            `DAILY` or `WEEKLY`.'
        limit:
          type: number
          description: 'Spend limit for the initial budget period.


            **Note**: This field is required unless `limitlessOverspend` is set as `true`.'
        limitlessGoal:
          type: number
          description: 'Spend goal for a limitless budget.


            **Note**: You can set this field when `limitlessOverspend` is set as `true`.'
        recurringLimit:
          type: number
          description: 'Spend limit for all future budget periods.


            **Note**: This field is required when `recurringInterval` is set as any value other than `NONE`.'
        overspendBuffer:
          type: number
          description: 'Spend amount allowed above the budget limit before transactions are declined.


            **Note**: You cannot set this field when `limitlessOverspend` is set as `true` or for budgets with `recurringInterval` as `DAILY` or `WEEKLY`.'
        shareFunds:
          allOf:
          - $ref: '#/components/schemas/EditBudgetShareFundsType'
          - description: Rule for how the budget funds are shared with budget members. The default value is `SHARE_MANUALLY`.
      description: Update a budget (limit updated)
      example:
        limit: 300
    BudgetMemberBulkUpsertRequestDto:
      required:
      - members
      type: object
      properties:
        members:
          minItems: 1
          type: array
          description: List of budget member updates
          items:
            $ref: '#/components/schemas/BudgetMemberBulkUpsertDto'
      description: Update multiple budget members
      example:
        members:
        - userId: '{{se_user_uuid}}'
          limit: 200
          recurringLimit: 200
          role: OWNER
          shareBudgetFunds: true
    BudgetMemberUpsertRequestDto:
      type: object
      properties:
        limit:
          type: number
          description: 'Funds assigned to the user in the current budget period.


            **Note**: This field is required with `shareBudgetFunds` is set as `false`.'
        recurringLimit:
          type: number
          description: 'Funds assigned to the user in all future budget periods.


            **Note**: This field is required when `shareBudgetFunds` is set as `false`.'
        role:
          allOf:
          - $ref: '#/components/schemas/BudgetRoleType'
          - description: Budget user role
        shareBudgetFunds:
          type: boolean
          description: 'Set as `true` to share all the budget funds with the user.


            **Note**: You cannot set this field as `true` when either `limit` or `recurringLimit` is set.'
      description: Add a budget member
      example:
        limit: '50'
        recurringLimit: '100'
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    PaginationResponseDto_BudgetMemberResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
          description: Next page token
        prevPage:
          type: string
          description: Previous page token
        results:
          type: array
          description: Results
          items:
            $ref: '#/components/schemas/BudgetMemberResponseDto'
      description: Response from a list API request with paging references.
    BudgetMemberBulkUpsertDto:
      required:
      - userId
      type: object
      properties:
        userId:
          type: string
          description: BILL-generated ID or UUID of the user
        limit:
          type: number
          description: 'Funds assigned to the user in the current budget period.


            **Note**: This field is required when `shareBudgetFunds` is set as `false`.'
        recurringLimit:
          type: number
          description: 'Funds assigned to the user in all future budget periods.


            **Note**: This field is required when `shareBudgetFunds` is set as `false`.'
        role:
          allOf:
          - $ref: '#/components/schemas/BudgetRoleType'
          - description: Budget user role
        shareBudgetFunds:
          type: boolean
          description: 'Set as `true` to share all the budget funds with the user.


            **Note**: You cannot set this field as `true` when either `limit` or `recurringLimit` is set.'
      description: Budget member bulk upsert member request dto.
    EditBudgetShareFundsType:
      type: string
      description: The subset of BudgetShareFundsType options that users are allowed to use for updates/creates. (Other options are read-only.)
      enum:
      - DO_NOT_SHARE
      - SHARE_MANUALLY
    BudgetCreateDto:
      required:
      - name
      - owners
      - recurringInterval
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Budget name
        description:
          type: string
          description: Budget description
        owners:
          minItems: 1
          type: array
          description: List of BILL-generated user IDs or UUIDs of budget owners. You must specify at least one budget owner.
          items:
            type: string
        members:
          type: array
          description: List of BILL-generated user IDs or UUIDs of budget members
          items:
            type: string
        observers:
          type: array
          description: List of BILL-generated user IDs or UUIDs of budget observers
          items:
            type: string
        expirationDate:
          type:
          - string
          - 'null'
          description: Budget expiration date. This value is in the `yyyy-MM-dd` format.
          format: date
        recurringInterval:
          allOf:
          - $ref: '#/components/schemas/PeriodIntervalType'
          - description: 'Interval after which the budget is reset. By default, BILL uses the timezone of the company''s billing address to reset a budget at 12 AM.

              * `NONE`: Never

              * `DAILY`: Each day at 12 AM

              * `WEEKLY`: Each Monday at 12 AM

              * `MONTHLY`: On the 1st of every month at 12 AM

              * `QUARTERLY`: Once every 3 months, on the 1st of the month at 12 AM. Set the first month with `recurMonth`.

              * `YEARLY`: Once every year, on the 1st of the month at 12 AM. Set the month with `recurMonth`.'
        recurMonth:
          maximum: 12
          minimum: 1
          type: integer
          description: The month in which the budget will recur. Set this field only when `recurringInterval` is set as `QUARTERLY` or `YEARLY`. The default value is the current month.
          format: int64
        timezone:
          type: string
          description: 'Timezone in which the budget funds are reset. The default value is the timezone of the company''s billing address.


            Set this field in the `US/{time_zone}` format. For example, `US/Pacific` or `US/Mountain`.'
        autoAddUsers:
          type: boolean
          description: Set as `true` to automatically add all new users to this budget
        receiptRequired:
          type: boolean
          description: Set as `true` if a receipt is required for transactions in the budget
        maxTxSize:
          type: number
          description: Maximum transaction size in the budget. Any single transaction for an amount greater than `maxTxSize` will be declined.
        carryOver:
          type: boolean
          description: Set as `true` for any budget funds assigned to users and vendor cards to carry over from one budget period to the next. The budget period is set with `recurringInterval`.
        parentBudgetId:
          type: string
          description: BILL-generated ID or UUID of the parent budget. Set this field if this budget is a child budget.
        budgetGroup:
          type: boolean
          description: Set as `true` if this budget is a budget group. A budget group can be set as a parent of other budgets.
        limitlessOverspend:
          type: boolean
          description: 'Set as `true` for enabling spend amounts over the budget limit.


            **Note**: You cannot set this field as `true` for budgets with `recurringInterval` set as

            `DAILY` or `WEEKLY`.'
        limit:
          type: number
          description: 'Spend limit for the initial budget period.


            **Note**: This field is required unless `limitlessOverspend` is set as `true`.'
        limitlessGoal:
          type: number
          description: 'Spend goal for a limitless budget.


            **Note**: You can set this field when `limitlessOverspend` is set as `true`.'
        recurringLimit:
          type: number
          description: 'Spend limit for all future budget periods.


            **Note**: This field is required when `recurringInterval` is set as any value other than `NONE`.'
        overspendBuffer:
          type: number
          description: 'Spend amount allowed above the budget limit before transactions are declined.


            **Note**: You cannot set this field when `limitlessOverspend` is set as `true` or for budgets with `recurringInterval` as `DAILY` or `WEEKLY`.'
        shareFunds:
          allOf:
          - $ref: '#/components/schemas/EditBudgetShareFundsType'
          - description: Rule for how the budget funds are shared with budget members. The default value is `SHARE_MANUALLY`.
      description: Create a budget
      example:
        name: Happy Music Supplies monthly spending budget
        owners:
        - '{{se_user_uuid}}'
        recurringInterval: MONTHLY
        limit: 200
        recurringLimit: 200
