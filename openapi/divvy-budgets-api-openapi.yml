              * `MONTHLY`: On the 1st of every month at 12 AM

              * `QUARTERLY`: Once every 3 months, on the 1st of the month at 12 AM. Set the first month with `recurMonth`.

              * `YEARLY`: Once every year, on the 1st of the month at 12 AM. Set the month with `recurMonth`.'
        timezone:
          type: string
          description: Timezone in which the budget funds are reset
        autoAddUsers:
          type: boolean
          description: Set as `true` to automatically add all new users to this budget
        receiptRequired:
          type: boolean
          description: Set as `true` if a receipt is required for transactions in the budget
        maxTxSize:
          type: number
          description: Maximum transaction size in the budget. Any single transaction for an amount greater than `maxTxSize` will be declined.
        carryOver:
