openapi: 3.2.0
info:
  title: BILL v3 Transactions API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Transactions
paths:
  /v3/spend/transactions:
    get:
      tags:
      - Transactions
      summary: Get list of transactions
      description: 'Get a list of transaction objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 50 results on one page.


        In the response, you get information about transactions, reversals, and refunds.

        * **Transaction**: For a standard transaction, the `transactionType` is set as `AUTHORIZATION` or `DECLINE`. The status is updated to `CLEAR` once BILL moves the money from the funding account. The `CLEAR` transactions receive a new ID and reference to the original `AUTHORIZATION` transaction via the `originalAuthTransactionUuid` field.

        * **Reversal**: For a reversal (a cancellation before funds are settled), the `transactionType` remains `AUTHORIZATION`, but the `amount` is typically a negative value.

        * **Refund**: For a refund (a cancellation after funds are settled), the `transactionType` is set to `CLEAR` and the `amount` is a negative value.


        **Note**: Only parent transactions are available in the response.'
      operationId: listTransactions
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: max
        in: query
        schema:
          maximum: 50
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int64
          example: 10
      - name: nextPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set this field as the `nextPage` value for navigation.'
      - name: prevPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Previous page of results. Set this field as the `prevPage` value for navigation.
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. You can set only one sort field.


            The format is `sort={field}:{sort_order}`.


            The sortable fields are:

            - `amount`

            - `merchantName`

            - `occurredTime`'
          example: occurredTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: "Field name, operator, and value. You can set multiple filters.\n\nThe format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.\n\nExample: `filters=cardId:eq:MyCardID,userId:in:\"123,456\"`\n\nThe filterable fields are:\n - `cardId` - List of string IDs or UUIDs. Operators: `eq`, `in`.\n - `merchantName` - String. Operators: `eq`.\n - `userId` - List of string IDs or UUIDs. Operators: `eq`, `in`.\n - `budgetId` - List of string IDs or UUIDs. Operators: `eq`, `in`.\n - `fees` - Number with 2 decimal places. Operators: `lte`, `gte`.\n - `transactionIds` - List of string IDs or UUIDs. Operators: `eq`, `in`.\n - `customFieldIds` - List of string IDs or UUIDs. Operators: `eq`, `in`.\n - `customFieldValueIds` - List of string IDs or UUIDs. Operators: `eq`, `in`. **Note**: Use `customFieldIds` and `customFieldValueIds` to filter transactions based on custom fields. Use the `showCustomFieldIds` query parameter to control which custom fields are shown for each transaction.\n - `receiptStatus` - `VALIDATED`, `NOT_VALIDATED`, `ATTACHED`, `MISSING`, `NOT_REQUIRED`, `NOT_ATTACHED`. Operators: `eq`, `ne`, `in`, `nin`.\n - `type` - `CLEAR`, `DECLINE`, `AUTHORIZATION`, `OTHER`. Operators: `eq`, `ne`, `in`, `nin`. **Deprecated**: use `transactionType`.\n - `transactionType` - `CLEAR`, `DECLINE`, `AUTHORIZATION`, `OTHER`. Operators: `eq`, `ne`, `in`, `nin`.\n - `occurredTime` - DateTime. Operators: `lte`, `gte`.\n - `authorizedTime` - DateTime. Operators: `lte`, `gte`.\n - `updatedTime` - DateTime. Operators: `lte`, `gte`.\n - `isLocked` - `true` or `false`. Operators: `eq`.\n - `complete` - `true` or `false`. Operators: `eq`.\n - `amount` - Number with 2 decimal places. Operators: `lte`, `gte`.\n - `isReviewed` - `true` or `false`. Operators: `eq`.\n - `syncStatus` - `PENDING`, `SYNCED`, `ERROR`, `MANUAL_SYNCED`, `NOT_SYNCED`. Operators: `eq`, `ne`, `in`, `nin`."
          example: amount:gte:100.00
      - name: showCustomFieldIds
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'List of BILL-generated IDs of custom fields to be displayed for each transaction. Set the IDs as comma-separated values. By default, all the custom fields are displayed for all transactions.


            **NOTE**: Use `customFieldIds` and `customFieldValueIds` to filter transactions based on custom fields.'
      - name: includeReceipts
        in: query
        schema:
          type:
          - boolean
          - 'null'
          description: Set as `true` to include transaction receipts in the response. By default, receipts are not included in the response.
          example: true
      responses:
        '200':
          description: Get list of transactions response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactionsResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/transactions/receipt-upload-url:
    post:
      tags:
      - Transactions
      summary: Create a transaction upload URL
      description: 'Create a transaction image upload URL.


        From the response, use the upload `url` to upload a receipt image for the transaction. For example, to upload a JPEG image, use the following `curl` command. To upload a PNG image, set the content type as `image/png`.


        ```

        curl ''{upload_url}''

        -H ''Content-Type: image/jpeg''

        --upload-file {file_name_with_extension}

        ```


        **Note**: BILL supports JPG and PNG file formats for transaction images.


        See Transactions in the Guides section for more information, sample requests, and responses.'
      operationId: createReceiptUploadUrl
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      responses:
        '200':
          description: Create a transaction upload URL response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementImageUploadUrlResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/transactions/{acsTransactionId}/3ds-challenge:
    post:
      tags:
      - Transactions
      summary: Accept or reject a transaction
      description: 'Accept or reject a transaction 3D Secure (3DS) challenge.


        When a transaction is created, a 3DS challenge may trigger to verify the identity of the cardholder. Use this endpoint to approve or deny the transaction. The Spend & Expense user must have the `ADMIN` user role to perform this operation.


        Subscribe to the `spend.three-ds-challenge.created` event to get a webhook notification when a 3DS challenge is triggered for a transaction. See Spend & Expense 3DS challenge notification payload for more information.


        See 3-D Secure - BILL Spend & Expense in the BILL Help Center to learn more about 3D Secure at BILL.'
      operationId: threeDsChallenge
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: acsTransactionId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the transaction. You receive this transaction ID in the `spend.three-ds-challenge.created` webhook notification.
          example: '{{se_transaction_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDsRequestDto'
        required: true
      responses:
        '200':
          description: Accept or reject a transaction response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreeDsResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/transactions/{transactionId}:
    get:
      tags:
      - Transactions
      summary: Get transaction details
      description: 'Get details about an existing transaction.


        In the response, you get information about transactions, reversals, and refunds.

        * **Transaction**: For a standard transaction, the `transactionType` is set as `AUTHORIZATION` or `DECLINE`. The status is updated to `CLEAR` once BILL moves the money from the funding account. The `CLEAR` transactions receive a new ID and reference to the original `AUTHORIZATION` transaction via the `originalAuthTransactionUuid` field.

        * **Reversal**: For a reversal (a cancellation before funds are settled), the `transactionType` remains `AUTHORIZATION`, but the `amount` is typically a negative value.

        * **Refund**: For a refund (a cancellation after funds are settled), the `transactionType` is set to `CLEAR` and the `amount` is a negative value.'
      operationId: getTransaction
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: transactionId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the transaction
          example: '{{se_transaction_uuid}}'
      - name: showCustomFieldIds
        in: query
        schema:
          type:
          - string
          - 'null'
          description: List of BILL-generated IDs or UUIDs of custom fields. Set the IDs or UUIDs as comma-separated values.
          example: '{{se_custom_field_uuid}}'
      responses:
        '200':
          description: Get transaction details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    put:
      tags:
      - Transactions
      summary: Update a transaction
      description: Update the budget for an existing transaction.
      operationId: updateTransaction
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: transactionId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the transaction
          example: '{{se_transaction_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTxRequestDto'
        required: true
      responses:
        '200':
          description: Update a transaction response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/transactions/{transactionId}/custom-fields:
    get:
      tags:
      - Transactions
      summary: Get list of transaction custom fields
      description: Get a list of custom field objects applied to an existing transaction.
      operationId: listTransactionCustomFields
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: transactionId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the transaction
          example: '{{se_transaction_uuid}}'
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: "Field name, operator, and value. You can set multiple filters.\n\nThe format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.\n\nExample: `filters=customFieldIds:in:\"abc,def\"`\n\nThe filterable fields are:\n - `customFieldIds` - List of string IDs or UUIDs. Operators: `eq`, `in`."
          example: customFieldIds:eq:{{se_custom_field_uuid}}
      responses:
        '200':
          description: Get list of transaction custom fields response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionCustomFieldResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    put:
      tags:
      - Transactions
      summary: Update transaction custom fields
      description: 'Update details about custom fields and their values applied to an existing transaction.


        You cannot update custom fields in a locked transaction. When a transaction is locked, `isLocked` is set as `true`. You can get information about your transactions with `GET /v3/spend/transactions` or `GET /v3/spend/transactions/{transactionId}.


        See Lock or unlock custom fields for a transaction in the BILL Help Center for more information.'
      operationId: updateTransactionCustomFields
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: transactionId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the transaction
          example: '{{se_transaction_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateTxCustomFieldRequestDto'
        required: true
      responses:
        '200':
          description: Update transaction custom fields response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendStatusDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/transactions/{transactionId}/custom-fields/{customFieldId}/values:
    get:
      tags:
      - Transactions
      summary: Get list of transaction custom field values
      description: Get a list of custom field value objects applied to an existing transaction. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.
      operationId: listTransactionCustomFieldValues
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: transactionId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the transaction
          example: '{{se_transaction_uuid}}'
      - name: customFieldId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the custom field
          example: '{{se_custom_field_uuid}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int64
          example: 10
      - name: nextPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set this field as the `nextPage` value for navigation.'
      - name: prevPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Previous page of results. Set this field as the `prevPage` value for navigation.
      responses:
        '200':
          description: Get list of transaction custom field value response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTxCFValueResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/transactions/{transactionId}/receipts:
    post:
      tags:
      - Transactions
      summary: Add a transaction receipt
      description: 'Add a receipt to an existing transaction.


        In the request, use the same upload `url` that you used to upload the receipt image. See Create a transaction upload URL to learn about creating a transaction image upload URL.'
      operationId: addTransactionReceipt
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: transactionId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the transaction
          example: '{{se_transaction_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionReceiptRequestDto'
        required: true
      responses:
        '200':
          description: Add a transaction receipt response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceiptImage'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/transactions/{transactionId}/receipts/{receiptId}:
    delete:
      tags:
      - Transactions
      summary: Delete a transaction receipt
      description: Delete a receipt from an existing transaction. A deleted receipt cannot be restored. The deleted receipt is not available in the transaction details.
      operationId: deleteTransactionReceipt
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: transactionId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the transaction
          example: '{{se_transaction_uuid}}'
      - name: receiptId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated UUID of the transaction receipt
          example: '{{se_transaction_receipt_uuid}}'
      responses:
        '200':
          description: Delete a transaction receipt response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    UpdateCustomFieldDto:
      required:
      - customFieldId
      type: object
      properties:
        customFieldId:
          type: string
          description: BILL-generated ID or UUID of the custom field
        selectedValues:
          type: array
          description: 'List of selected custom field values. Set the custom field value ID or UUID values.


            **Note**: Clear the `selectedValues` array to clear all the custom field selected values.'
          items:
            type: string
        note:
          type: string
          description: 'Updated custom field note.


            **Note**: This field is available only for custom fields with `type` set as `NOTE`.'
      description: Set custom fields in transactions \& reimbursements.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    UpdateTxRequestDto:
      required:
      - budgetId
      type: object
      properties:
        budgetId:
          type: string
          description: BILL-generated ID or UUID of the budget linked with the transaction
      description: Update a transaction
      example:
        budgetId: '{{se_budget_uuid}}'
    CurrencyData:
      type: object
      properties:
        exchangeRate:
          type: number
          description: Exchange rate for currency conversion
        exponent:
          type: integer
          description: Number of decimal places in the currency format
          format: int64
        originalCurrencyAmount:
          type: string
          description: Transaction amount in the original currency before conversion
        originalCurrencyCode:
          type: string
          description: Three-letter ISO currency code of the original currency
        symbol:
          type: string
          description: Currency symbol for display purposes (e.g. $, €, £)
      description: CurrencyData class for Spend \& Expense Transactions.
    DisputeStatusType:
      type: string
      description: Dispute status enum for Spend \& Expense Transactions.
      enum:
      - SUBMITTED
      - IN_PROGRESS
      - CLOSED_WON
      - CLOSED_LOST
    PaginationResponseDto_TransactionResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
          description: Next page token
        prevPage:
          type: string
          description: Previous page token
        results:
          type: array
          description: Results
          items:
            $ref: '#/components/schemas/TransactionResponseDto'
      description: Response from a list API request with paging references.
    ThreeDsResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the 3D Secure response
        status:
          allOf:
          - $ref: '#/components/schemas/ThreeDsChallengeStatus'
          - description: 3D Secure challenge status
      description: Response dto for three ds response.
    ThreeDsChallengeStatus:
      type: string
      description: Enum representing the status of a 3D Secure (3DS) challenge.
      enum:
      - SKIPPED
      - PENDING
      - SENT
      - ACCEPTED
      - REJECTED
      - CANCELLED
      - TIMED_OUT
      - FAILED
      - UNDEFINED
    TransactionType:
      type: string
      description: TransactionType.
      enum:
      - CLEAR
      - DECLINE
      - AUTHORIZATION
      - OTHER
    CustomFieldValueDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the custom field value
          deprecated: true
        uuid:
          type: string
          description: BILL-generated UUID of the custom field value
        value:
          type: string
          description: Custom field value
      description: Custom field value DTO object representing the custom field value return on Custom fields for transactions and reimbursements.
    PaginatedTransactionsResponseDto:
      type: object
      description: List of transactions with paging references.
      allOf:
      - $ref: '#/components/schemas/PaginationResponseDto_TransactionResponseDto_'
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    ReimbursementImageUploadUrlResponseDto:
      type: object
      properties:
        url:
          type: string
          description: Pre-signed URL for uploading a receipt
      description: API response for creating a reimbursement image upload URL.
    PaginatedTxCFValueResponseDto:
      type: object
      description: List of transaction custom field values with paging references.
      allOf:
      - $ref: '#/components/schemas/PaginationResponseDto_CustomFieldValueDto_'
    TxMerchantLocationDto:
      type: object
      properties:
        city:
          type: string
          description: Merchant city
        state:
          type: string
          description: Merchant state or region
        postalCode:
          type: string
          description: Merchant zip or postal code
        country:
          type: string
          description: Merchant country
      description: Transaction merchant address info.
    ReceiptImage:
