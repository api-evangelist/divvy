          allOf:
          - $ref: '#/components/schemas/TxMerchantLocationDto'
          - description: Merchant location information for the transaction. This information is available when `cardPresent` is set as `true`.
        disputeStatus:
          allOf:
          - $ref: '#/components/schemas/DisputeStatusType'
          - description: Dispute status for the transaction. This information is available when the transaction has been disputed.
      description: Transactions response.
