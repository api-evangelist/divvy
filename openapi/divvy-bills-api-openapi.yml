openapi: 3.2.0
info:
  title: BILL v3 Bills API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Bills
paths:
  /v3/bills:
    get:
      tags:
      - Bills
      summary: Get list of bills
      description: 'Get a list of bill objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listBills
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{bill_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of bills response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBillResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Bills
      summary: Create a bill
      description: 'Create a new bill.


        See Bills in the Guides section for more information, sample requests, and responses.'
      operationId: createBill
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillCreateRequestDto'
        required: true
      responses:
        '201':
          description: Create a bill response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/bills/bulk:
    post:
      tags:
      - Bills
      summary: Create multiple bills
      description: 'Create multiple bills with one API request. You can create up to 100 bills with one `POST /v3/bills/bulk` request.


        Bulk bill creation at BILL follow a set of rules.

        * **Successful response**: In your bulk bill creation request, all your bills must be successfully created for a successful response. If any bill creation is not successful, the entire request fails and none of the bills in the request are created.

        * **You can create bills for multiple vendors**: You can create bills for one vendor or for multiple vendors with one `POST /v3/bills/bulk` request.


        See Bills in the Guides section for more information, sample requests, and responses.'
      operationId: createBulkBills
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BillCreateRequestDto'
        required: true
      responses:
        '201':
          description: Create multiple bills response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BillWithoutApproversResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/bills/record-payment:
    post:
      tags:
      - Bills
      summary: Record AP payment
      description: 'Record an offline AP payment made to a vendor.


        An offline payment is a payment made outside the BILL system. BILL simply applies the recorded payment amount to one or more bills for the vendor. BILL does not process the payment or transfer funds to the vendor when you record an AP payment with this endpoint.


        Use `POST /v3/payments` to create a payment with the BILL system. When you pay with `POST /v3/payments`, BILL processes the payment and transfers funds from your BILL organization funding account to the vendor.'
      operationId: recordPayment
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordPaymentRequestDto'
        required: true
      responses:
        '200':
          description: Record AP payment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPaymentResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/bills/{billId}:
    get:
      tags:
      - Bills
      summary: Get bill details
      description: Get details about an existing bill.
      operationId: getBill
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: billId
        in: path
        required: true
        schema:
          minLength: 1
          pattern: ^00n[a-zA-Z0-9]{17}$
          type: string
          description: BILL-generated ID of the bill. The value begins with `00n`.
          example: '{{bill_id}}'
      responses:
        '200':
          description: Get bill details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillReadResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    put:
      tags:
      - Bills
      summary: Replace a bill
      description: 'Update the number of line items in a bill. You can also update other bill details.


        You can use the PUT operation to add, remove, or replace the number of line items in a bill. A set of rules apply with the PUT operation.

        * When you add a new line item, a new line item `id` is generated in the bill.

        * When you omit an existing line item `id`, the line item is removed from the bill.'
      operationId: replaceBill
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: billId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the bill. The value begins with `00n`.
          example: '{{bill_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillReplaceRequestDto'
        required: true
      responses:
        '200':
          description: Replace a bill response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Bills
      summary: Update a bill
      description: 'Update details about a bill line item. You can also update other bill details.


        You can use the PATCH operation to modify line item details, such as `amount` and `description`. The bill line item `id` does not change with a PATCH operation.'
      operationId: updateBill
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: billId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the bill. The value begins with `00n`.
          example: '{{bill_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Update a bill response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/bills/{billId}/archive:
    post:
      tags:
      - Bills
      summary: Archive a bill
      description: 'Archive an existing bill. In the response, the `archived` field is set as `true`.


        You can restore an archived bill with `POST /v3/bills/{billId}/restore`. There is no change when you archive an archived bill.'
      operationId: archiveBill
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: billId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the bill. The value begins with `00n`.
          example: '{{bill_id}}'
      responses:
        '200':
          description: Archive a bill response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillWithoutApproversResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/bills/{billId}/restore:
    post:
      tags:
      - Bills
      summary: Restore an archived bill
      description: 'Restore an archived bill. In the response, the `archived` field is set as `false`.


        You can perform any valid BILL operation on restored bills. There is no change when you restore a restored bill.'
      operationId: restoreBill
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: billId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the bill. The value begins with `00n`.
          example: '{{bill_id}}'
      responses:
        '200':
          description: Restore an archived bill response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillWithoutApproversResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    BillPaymentStatusDto:
      type: string
      description: Payment Status of a bill.
      enum:
      - PAID
      - UNPAID
      - PARTIALLY_PAID
      - SCHEDULED
      - IN_PROCESS
      - UNDEFINED
    BillUpdateInvoiceRequestDto:
      type: object
      properties:
        invoiceNumber:
          maxLength: 100
          type: string
          description: User-generated invoice number. This value can be your chosen number scheme or bill due date.
        invoiceDate:
          type: string
          description: Date when the invoice is sent. This value is in the `yyyy-MM-dd` format.
          format: date
      description: Invoice linked to a bill.
    RecordPaymentResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the payment. The value begins with `stp`.
        vendorId:
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
        billId:
          type: string
          description: BILL-generated ID of the bill. The value begins with `00n`.
        billPayments:
          type: array
          description: List of bill payments
          items:
            $ref: '#/components/schemas/RecordBillPayResponseDto'
        description:
          type: string
          description: Payment description
        processDate:
          type: string
          description: Payment process date. The value is in the `yyyy-MM-dd` format.
          format: date
        amount:
          type: number
          description: Payment amount. For a payment in an international currency (not USD), this value is in the local currency.
        transactionNumber:
          type: string
          description: BILL-generated alphanumeric payment identification value
        confirmationNumber:
          type: string
          description: BILL-generated bill payment confirmation value
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatus'
          - description: Payment status.
        exchangeRate:
          type: number
          description: Exchange rate for the payment in an international currency (not USD)
        fundingAmount:
          type: number
          description: Payment amount in USD
        onlinePayment:
          type: boolean
          description: 'Payment source.

            * `true`: Payment is made with BILL (online)

            * `false`: Payment is made outside BILL and then recorded in BILL (offline)


            This field is set as `false` for the Record AP payment operation.'
        disbursementType:
          allOf:
          - $ref: '#/components/schemas/DisbursementType'
          - description: Disbursement type. This field is set as `OFFLINE` for the Record AP payment operation.
        remittanceEmail:
          type: string
          description: Remittance email address set for the vendor
        createdTime:
          type: string
          description: Payment created date and time
          format: date-time
        updatedTime:
          type: string
          description: Payment updated date and time
          format: date-time
        createdBy:
          type: string
          description: BILL-generated ID of the user that created the payment. The value begins with `006`.
        disbursementStatus:
          allOf:
          - $ref: '#/components/schemas/DisbursementStatus'
          - description: 'Payment disbursement status. This field is set as `DONE` for the Record AP payment operation.

              '
        singleStatus:
          allOf:
          - $ref: '#/components/schemas/PaymentSingleStatus'
          - description: 'Unified payment status. This field provides BILL payment lifecycle updates based on the `status` and `disbursementStatus` values in the response.


              This field is set as `PAID_OFFLINE` for the Record AP payment operation.'
        toPrintCheck:
          type: boolean
          description: 'Set as `true` to set the payment check as printable in your accounting system. Use this field only for check payments.

            '
        classifications:
          allOf:
          - $ref: '#/components/schemas/PaymentClassificationsDto'
          - description: General ledger classifications information for the payment
        syncReference:
          type: string
          description: 'Payment reference ID in your accounting system. Set this field with payment information, such as check number.

            '
        allowExport:
          type: boolean
          description: 'Set as `true` to sync the bill payment with your accounting system

            '
      description: Record offline payment response dto.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    BillWithoutApproversResponseDto:
      required:
      - archived
      - id
      - vendorId
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the bill. The value begins with `00n`.
        archived:
          type: boolean
          description: Set as `true` if the bill is archived
        vendorId:
          type: string
          description: BILL-generated ID of the vendor. The value begins with `009`.
        fundingAmount:
          type: number
          description: Bill total amount. This value is in USD.
        amount:
          type: number
          description: Bill total amount. For a bill in an international currency (not USD), this value is in the local currency.
        paidAmount:
          type: number
          description: Bill paid amount. This value is the sum of all cleared payments and any credit amount applied to the bill.
        dueAmount:
          type: number
          description: Bill due amount. The value is calculated by subtracting any applied credits (`creditAmount`), scheduled payment (`scheduledAmount`), and cleared payment from the bill `amount`.
        scheduledAmount:
          type: number
          description: Bill scheduled amount. The value is set as the vendor payment amount that is pending clearance.
        creditAmount:
          type: number
          description: Credit amount applied to the bill
        exchangeRate:
          type: number
          description: 'Exchange rate for the bill amount in an international currency (not USD).


            The BILL exchange rate changes periodically and a different rate may apply at the time of payment.'
        description:
          type: string
          description: Bill description
        dueDate:
          type: string
          description: Bill due date. The value is in the `yyyy-MM-dd` format.
          format: date
        paymentTermId:
          type: string
        invoice:
          allOf:
          - $ref: '#/components/schemas/Invoice'
          - description: Invoice information
        billLineItems:
          type: array
          description: Bill line item information
          items:
            $ref: '#/components/schemas/BillResponseLineItem'
        payFromChartOfAccountId:
          type: string
          description: BILL-generated ID of the chart of accounts for the bill payment. The value begins with `0ca`.
        paymentStatus:
          allOf:
          - $ref: '#/components/schemas/BillPaymentStatusDto'
          - description: Bill payment status.
        approvalStatus:
          allOf:
          - $ref: '#/components/schemas/BillApprovalStatusResponse'
          - description: Bill approval status.
        createdBy:
          type: string
          description: BILL-generated ID of the user that created the bill. The value begins with `006`.
        createdTime:
          type: string
          description: Created date and time
          format: date-time
        updatedTime:
          type: string
          description: Updated date and time
          format: date-time
        classifications:
          allOf:
          - $ref: '#/components/schemas/BillClassificationsDto'
          - description: General ledger classifications information for the bill
        purchaseOrderNumber:
          type: string
          description: Purchase order number linked with the bill
      description: Bills response without approvers.
    PaymentVendorCreditRequestDto:
      required:
      - amount
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: BILL-generated ID of the vendor credit applied to the bill payment. The value begins with `vcr`.
        amount:
          minimum: 0
          type: number
          description: Credit amount
      description: Payment vendor credit request DTO.
    BillUpdateLineItemDto:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: BILL-generated ID of the bill line item. The value begins with `bli`.
        amount:
          type: number
          description: 'Bill line item amount. For a bill in an international currency (not USD), this value is in the local currency.


            If you set `amount`, `quantity`, and `price`, BILL uses the `amount` value as the bill line item total amount.'
        quantity:
          type: number
          description: Bill line item unit quantity
        price:
          type: number
          description: Bill line item unit price. For a bill in an international currency (not USD), this value is in the local currency.
        description:
          maxLength: 4000
          type: string
          description: Bill line item description
        classifications:
          allOf:
          - $ref: '#/components/schemas/BillLineItemClassificationsDto'
          - description: General ledger classifications information for the bill line item
      description: Line items that define a bill's overall amount.
    ListBillResponseDto:
      type: object
      description: Response from a list API request with paging references.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_BillReadWithoutApproversResponseDto_'
      - properties:
          count:
            type: integer
            description: Total number of bills matching the list request, across all pages of results.
            format: int32
          totalDueAmount:
            type: number
            description: Sum of the balances of all bills matching the list request, across all pages of results. This value is in the organization's base currency.
    BillResponseLineItem:
      required:
      - amount
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the bill line item. The value begins with `bli`.
        amount:
          type: number
          description: 'Bill line item amount. For a bill in an international currency (not USD), this value is in the local currency.


            If you set `amount`, `quantity`, and `price`, BILL uses the `amount` value as the bill line item total amount.'
        quantity:
          type: number
          description: Bill line item unit quantity
        price:
          type: number
          description: Bill line item unit price. For a bill in an international currency (not USD), this value is in the local currency.
        description:
          type: string
          description: Bill line item description
        classifications:
          allOf:
          - $ref: '#/components/schemas/BillLineItemClassificationsDto'
          - description: General ledger classifications information for the bill line item
      description: Line items that define a bill's overall amount.
    PaymentStatus:
      type: string
      description: The enum Payment status dto.
      enum:
      - APPROVING
      - SCHEDULED
      - PAID
      - CANCELLED
      - VOID
      - ESCHEATED
      - UNDEFINED
    BillPaymentDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the payment. The value begins with `stp`.
        amount:
          type: number
          description: Payment amount applied to the bill
        processDate:
          type: string
          description: Date the payment was processed. The value is in the `yyyy-MM-dd` format.
          format: date
      description: A single payment applied to a bill.
    BillRecordStatus:
      type: string
