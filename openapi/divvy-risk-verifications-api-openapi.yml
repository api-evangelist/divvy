openapi: 3.2.0
info:
  title: BILL v3 Risk Verifications API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: risk-verifications
paths:
  /v3/risk-verifications:
    get:
      tags:
      - risk-verifications
      summary: Get risk verification details
      description: Get risk verification details for an existing organization.
      operationId: getRiskVerifications
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      responses:
        '200':
          description: Get risk verification details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - risk-verifications
      summary: Initiate risk verification for an organization
      description: 'Initiate risk verification for an organization. The currently signed-in user must have the `ADMINISTRATOR` user role in the BILL organization to perform this operation.


        **Note**: You must add a phone number for the signed-in user (with `POST /v3/risk-verifications/phone`) before you can initiate risk verification. BILL partners must add a phone number for a created user with `POST /v3/partner/risk-verifications/{userId}/phone`.


        As a BILL partner, when you create an organization and then create a user for that organization, it is important that you initiate risk verification with `POST /v3/risk-verifications`.


        BILL performs a KYC/KYB (Know You Customer/Know Your Business) check based on the provided organization information. BILL sends an email notification for risk verification. When the check is complete, BILL approves the organization for BILL AP and AR operations.'
      operationId: initiateRiskVerifications
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      responses:
        '200':
          description: Initiate risk verification for an organization response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/risk-verifications/phone:
    get:
      tags:
      - risk-verifications
      summary: Get phone status for risk verification
      description: 'Check whether a phone number has been added for the currently signed-in user. BILL requires the signed-in user to have a linked phone number for initiating risk verification for the organization.


        In the response, if `hasPhone` is `false`, you can add a phone number for the user with `POST /v3/risk-verifications/phone`.


        After you add a phone number, you can initiate risk verification for the organization with `POST /v3/risk-verifications`.'
      operationId: getRiskVerificationPhone
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      responses:
        '200':
          description: Get phone status for risk verification response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPhoneStatusResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - risk-verifications
      summary: Add phone for risk verification
      description: 'Add a phone number for the currently signed-in user. BILL requires the signed-in user to have a linked phone number for initiating risk verification for the organization.


        You can check whether a phone number has been added for the user with `GET /v3/risk-verifications/phone`.


        After you add a phone number with this endpoint, you can initiate risk verification for the organization with `POST /v3/risk-verifications`.'
      operationId: createRiskVerificationPhone
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationRequestDto'
        required: true
      responses:
        '200':
          description: Add phone for risk verification response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    GetPhoneStatusResponseDto:
      type: object
      properties:
        hasPhone:
          type: boolean
          description: Set as `true` if the user has an existing phone number for risk verification
      description: Get phone status response.
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    PhoneType:
      type: string
      description: Enum for phone type.
      enum:
      - MOBILE
      - HOME
    PhoneVerificationRequestDto:
      required:
      - phoneNumber
      - phoneType
      type: object
      properties:
        phoneNumber:
          pattern: (\d{10}$)
          type: string
          description: Phone number
        phoneType:
          allOf:
          - $ref: '#/components/schemas/PhoneType'
          - description: Phone type
      description: Add a phone number for risk verification
      example:
        phoneNumber: '{{user_phone_no}}'
        phoneType: MOBILE
    BdcError:
      required:
      - category
      - code
      - severity
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        category:
          $ref: '#/components/schemas/Category'
        message:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        detail:
          type: string
        help:
          type: string
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    VerificationProcessingStatus:
      type: string
      description: Enum for risk verification processing status.
      enum:
      - IN_PROGRESS
      - COMPLETED
    VerificationResponseDto:
      type: object
      properties:
        processingStatus:
          allOf:
          - $ref: '#/components/schemas/VerificationProcessingStatus'
          - description: Risk verification processing status.
        decision:
          allOf:
          - $ref: '#/components/schemas/VerificationDecisionType'
          - description: Risk verification decision. See [Users for BILL partners](https://developer.bill.com/docs/partner-users) to learn more about the `decision` values.
        referenceId:
          type: string
          description: BILL-generated ID to uniquely identify the risk verification request for the organization
      description: Risk verification response.
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
      - DOWNSTREAM
    VerificationDecisionType:
      type: string
      description: Enum for Risk verification decision.
      enum:
      - APPROVE
      - REVIEW
      - HOLD
      - DECLINE
      - PENDING
      - IN_PROGRESS
