openapi: 3.2.0
info:
  title: BILL v3 Invoices API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Invoices
paths:
  /v3/invoices:
    get:
      tags:
      - Invoices
      summary: Get list of invoices
      description: 'Get a list of invoice objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listInvoices
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{invoice_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of invoices response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Invoices
      summary: Create an invoice
      description: 'Create a new invoice.


        See Invoices in the Guides section for more information, sample requests, and responses.'
      operationId: createInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequestDto'
        required: true
      responses:
        '201':
          description: Create an invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/invoices/record-payment:
    post:
      tags:
      - Invoices
      summary: Record AR payment
      description: 'Record an offline AR payment received from a customer.


        An offline payment is a payment that you receive outside the BILL system. BILL simply applies the recorded payment amount to one or more invoices for the customer. Any recorded unapplied amount is an overpayment and is available as a customer credit in the BILL system.


        See Recording an AR payment in the Guides section for more information, sample requests, and responses.'
      operationId: recordInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordInvoiceRequestDto'
        required: true
      responses:
        '200':
          description: Record AR payment response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/invoices/{invoiceId}:
    get:
      tags:
      - Invoices
      summary: Get invoice details
      description: Get details about an existing invoice.
      operationId: getInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: invoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the invoice. The value begins with `00e`.
          example: '{{invoice_id}}'
      responses:
        '200':
          description: Get invoice details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    put:
      tags:
      - Invoices
      summary: Replace an invoice
      description: 'Update the number of line items in an invoice. You can also update other invoice details.


        You can use the PUT operation to add, remove, or replace the number of line items in an invoice. A set of rules apply with the PUT operation.

        * When you add a new line item, a new line item `id` is generated in the invoice.

        * When you omit an existing line item `id`, the line item is removed from the invoice.'
      operationId: replaceInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: invoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the invoice. The value begins with `00e`.
          example: '{{invoice_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceReplaceRequestDto'
        required: true
      responses:
        '200':
          description: Replace an invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Invoices
      summary: Update an invoice
      description: 'Update details about an invoice line item. You can also update other invoice details.


        You can use the PATCH operation to modify line item details, such as `amount`, `quantity`, and `description`. The invoice line item `id` does not change with a PATCH operation.'
      operationId: updateInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: invoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the invoice. The value begins with `00e`.
          example: '{{invoice_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Update an invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/invoices/{invoiceId}/archive:
    post:
      tags:
      - Invoices
      summary: Archive an invoice
      description: 'Archive an existing invoice. In the response, the `archived` field is set as `true`.


        You can restore an archived invoice with `POST /v3/invoices/{invoiceId}/restore`. There is no change when you archive an archived invoice.'
      operationId: archiveInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: invoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the invoice. The value begins with `00e`.
          example: '{{invoice_id}}'
      responses:
        '200':
          description: Archive an invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/invoices/{invoiceId}/email:
    post:
      tags:
      - Invoices
      summary: Send an invoice
      description: 'Send an invoice to a customer email address. You can send the invoice to multiple email addresses.


        See Invoices in the Guides section for more information, sample requests, and responses.'
      operationId: sendInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: invoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the invoice. The value begins with `00e`.
          example: '{{invoice_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendInvoiceRequestDto'
        required: true
      responses:
        '200':
          description: Send an invoice response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/invoices/{invoiceId}/payment-link:
    post:
      tags:
      - Invoices
      summary: Get invoice payment link
      description: 'Get an invoice payment link. In the response, BILL sends you a payment link based on the provided invoice and customer information.


        You can send the invoice payment link to your customer for getting paid by the customer. With this link, the customer can complete the invoice payment without the need to set up a BILL account.


        When a customer payment is made with the invoice payment link, BILL sends a payment receipt to the provided email address.


        **Note**: You get valid invoice payment links only for customers that are NOT connected with your organization in the BILL network.


        See Invoices in the Guides section for more information, sample requests, and responses.'
      operationId: getPaymentLink
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: invoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the invoice. The value begins with `00e`.
          example: '{{invoice_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePaymentLinkRequestDto'
        required: true
      responses:
        '200':
          description: Get an invoice payment link response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePaymentLinkResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/invoices/{invoiceId}/restore:
    post:
      tags:
      - Invoices
      summary: Restore an archived invoice
      description: 'Restore an archived invoice. In the response, the `archived` field is set as `false`.


        You can perform any valid BILL operation on restored invoices. There is no change when you restore a restored invoice.'
      operationId: restoreInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: invoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the invoice. The value begins with `00e`.
          example: '{{invoice_id}}'
      responses:
        '200':
          description: Restore an archived invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    ConvenienceFeeRequestDto:
      type: object
      properties:
        percentage:
          maximum: 3
          minimum: 0
          type: number
          description: Convenience fee percentage
      description: DTO for convenience fee in invoice requests.
    InvoiceClassificationsDto:
      type: object
      properties:
        accountingClassId:
          type: string
          description: BILL-generated ID of the accounting class. The value begins with `cls`.
        departmentId:
          type: string
          description: BILL-generated ID of the department. The value begins with `0de`.
        jobId:
          type: string
          description: BILL-generated ID of the job. The value begins with `job`.
        locationId:
          type: string
          description: BILL-generated ID of the location. The value begins with `loc`.
      description: DTO for Invoice classifications.
    InvoiceReplyTo:
      required:
      - userId
      type: object
      properties:
        userId:
          type: string
          description: 'BILL-generated ID of the user sending the invoice. The value begins with `006`.


            You can retrieve your user ID when you sign in with `/v3/login`.'
      description: Invoice replyTo object.
    RecordInvoiceRequestDto:
      required:
      - amount
      - invoices
      - paymentDate
      - paymentType
      type: object
      properties:
        customerId:
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        paymentDate:
          type: string
          description: Invoice payment date. The value is in the `yyyy-MM-dd` format.
          format: date
        paymentType:
          allOf:
          - $ref: '#/components/schemas/InvoicePaymentTypeRequest'
          - description: Payment type
        amount:
          type: number
          description: Payment amount
        description:
          maxLength: 4000
          type: string
          description: Payment description
        invoices:
          type: array
          description: List of invoice payments
          items:
            $ref: '#/components/schemas/RecordInvoiceItemRequestDto'
      description: Record AR payment
      example:
        amount: '100'
        customerId: '{{customer_id}}'
        invoices:
        - amount: '50'
          id: '{{invoice_id}}'
        paymentDate: '2026-12-20'
        paymentType: CREDIT_CARD
        description: Accepted credit card payment in store
    InvoiceProcessingOptions:
      type: object
      properties:
        sendEmail:
          type: boolean
          description: Set as `true` to send an email to the customer
      description: User provided options for sending an email.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    InvoiceCreateRequestDto:
      required:
      - customer
      - invoiceLineItems
      type: object
      properties:
        invoiceNumber:
          maxLength: 100
          type: string
          description: 'User-generated invoice number. This value can be your chosen number scheme.


            If you do not set this field, `invoiceNumber` is auto-generated.'
        invoiceDate:
          type: string
          description: 'Invoice creation date. This value is in the `yyyy-MM-dd` format.


            If you do not set this field, `invoiceDate` is set as the date when the invoice is created.'
          format: date
        dueDate:
          type: string
          description: 'Invoice due date. The value is in the `yyyy-MM-dd` format.


            If you do not set this field, `dueDate` is set as the date when the invoice is created.'
          format: date
        paymentTermId:
          type: string
        customer:
          allOf:
          - $ref: '#/components/schemas/InvoiceCustomer'
          - description: 'Customer contact information.

              * Set the customer `id` for associating an existing customer to the invoice

              * Set `name` and `email` for creating a new customer with the invoice.


              In the response, a new BILL-generated customer `id` is available.'
        invoiceLineItems:
          type: array
          description: Invoice line item information
          items:
            $ref: '#/components/schemas/InvoiceCreateLineItem'
        processingOptions:
          allOf:
          - $ref: '#/components/schemas/InvoiceProcessingOptions'
          - description: Invoice processing options
        payToChartOfAccountId:
          type: string
          description: BILL-generated ID of the chart of accounts for the invoice payment. The value begins with `0ca`.
        classifications:
          allOf:
          - $ref: '#/components/schemas/InvoiceClassificationsDto'
          - description: General ledger classifications information for the invoice
        creditAmount:
          minimum: 0
          type: number
          description: 'Credit amount applied to the invoice.


            BILL applies the credit amount from the total of all the credit memos available for the customer.'
        salesTaxItemId:
          type: string
          description: 'BILL-generated ID of the `SALES_TAX` item. The value begins with `0ii`. The tax rate is applied to all the invoice line items set as taxable.


            You can set up a `SALES_TAX` percentage item with `POST /v3/classifications/items`.'
        enableCardPayment:
          type: boolean
          description: Set as `true` if the card payment option is enabled for the invoice
        convenienceFee:
          allOf:
          - $ref: '#/components/schemas/ConvenienceFeeRequestDto'
          - description: Convenience fee information. The customer is charged the convenience fee when they pay the invoice using a card. To set the convenience fee, `enableCardPayment` must be set as `true`.
      description: Create an invoice
      example:
        customer:
          id: '{{customer_id}}'
        invoiceLineItems:
        - quantity: 2
          description: Classic extreme drum sticks
          price: 14.99
        - quantity: 1
          description: Metal guitar picks (5-pack)
          price: 50
        invoiceNumber: '202602'
        dueDate: '2026-12-31'
        processingOptions:
          sendEmail: false
    InvoicePayment:
      type: object
      properties:
        id:
          type: string
          description: 'BILL-generated ID of the invoice payment. The value begins with `0ip`.


            This ID is generated when a payment is applied to the listed invoice.'
        amount:
          type: number
          description: Invoice amount paid
        status:
          allOf:
          - $ref: '#/components/schemas/InvoicePaymentStatus'
          - description: Invoice payment status.
        date:
          type: string
          description: Invoice payment date. The value is in the `yyyy-MM-dd` format.
          format: date
      description: Invoice payments information.
    InvoiceReplaceLineItem:
      required:
      - quantity
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the invoice line item. The value begins with `00f`.
        description:
          maxLength: 4000
          type: string
          description: Invoice line item description
        price:
          type: number
          description: Invoice line item unit price. For an invoice in an international currency (not USD), this value is in the local currency.
        quantity:
          type: number
          description: Invoice line item unit quantity
        classifications:
          allOf:
          - $ref: '#/components/schemas/InvoiceLineItemClassificationsDto'
          - description: General ledger classifications information for the invoice line item
        taxable:
          type: boolean
          description: Set as true if the invoice line item is taxable
      description: Invoice Replace Request Line Item.
    ListResponseDto_InvoiceResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
        prevPage:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceResponseDto'
      description: Response from a list API request with paging references.
    InvoicePaymentTypeRequest:
      type: string
      description: Record AR payment type.
      enum:
      - CASH
      - CHECK
      - CREDIT_CARD
      - ACH
      - PAYPAL
      - OTHER
      - WALLET
      - VIRTUAL_CARD
    InvoiceStatus:
      type: string
      description: Invoice status enum.
      enum:
      - PAID_IN_FULL
      - OPEN
      - PARTIAL_PAYMENT
      - SCHEDULED
      - UNDEFINED
    SendInvoiceRequestDto:
      required:
      - recipient
      - replyTo
      type: object
      properties:
        replyTo:
          allOf:
          - $ref: '#/components/schemas/InvoiceReplyTo'
          - description: Invoice sender information
        recipient:
          allOf:
          - $ref: '#/components/schemas/InvoiceRecipient'
          - description: Invoice recipient information
      description: Send an invoice to a customer
      example:
        recipient:
          to:
          - '{{customer_email}}'
        replyTo:
          userId: '{{login_user_id}}'
    InvoiceResponseLineItem:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the invoice line item. The value begins with `00f`.
        description:
          type: string
          description: Invoice line item description
        price:
          type: number
          description: Invoice line item unit price. For an invoice in an international currency (not USD), this value is in the local currency.
