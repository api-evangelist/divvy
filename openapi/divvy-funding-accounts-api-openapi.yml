      description: Update a bank account
      example:
        ownerType: PERSONAL
    ListPayableCardAccountsRateActivePromotion:
      type: object
      properties:
        startDate:
          type: string
          description: Promotion start date
          format: date-time
        endDate:
          type: string
          description: Promotion end date
          format: date-time
        creditCardRate:
          type: number
          description: Credit card rate
        debitCardRate:
          type: number
          description: Debit card rate
      description: List Payable Card Accounts Rate Active Promotion.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
