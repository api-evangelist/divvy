openapi: 3.2.0
info:
  title: BILL v3 Funding Accounts API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: funding-accounts
paths:
  /v3/funding-accounts/ap-cards:
    get:
      tags:
      - funding-accounts
      summary: Get list of AP Cards
      description: 'Get a list of AP Card objects.


        With the AP Card, you can earn rewards simply by paying your bills. The AP Card is a payment method that enables you to send fast payments with no transaction fees or annual fees. You can use the AP Card with any vendor who accepts virtual card payments.


        See AP Card Frequently Asked Questions (FAQs) in the BILL Help to learn more about AP Card.'
      operationId: listPayableAPCards
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      responses:
        '200':
          description: Get list of AP Cards response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APCardResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/banks:
    get:
      tags:
      - funding-accounts
      summary: Get list of bank accounts
      description: 'Get a list of bank account objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listBankAccounts
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: createdTime:desc
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: bankAccountId:eq:{{org_bank_account_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of bank accounts response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - funding-accounts
      summary: Create a bank account
      description: 'Create a new bank account. The currently signed-in user must have the `ADMINISTRATOR` user role in the BILL organization to perform this operation. BILL sends an email notification for informing you about changes to your funding accounts.


        When you create a bank account, BILL sends a test ACH payment to confirm whether the account details are accurate.


        In the response, three fields are set to their default values.

        * The bank account `status` is set as `PENDING`. You can verify the bank account with `POST /v3/funding-accounts/banks/{bankAccountId}/verify`.

        * The `payables` and `receivables` values are set as `false`. To update these values, update the bank account with `PATCH /v3/funding-accounts/banks/{bankAccountId}`.


        **Note**: Creating a bank account requires an MFA-trusted API session. See MFA setup for information about the BILL MFA process.


        See Bank account setup (v3 API) in the Guides section for more information, sample requests, and responses.'
      operationId: createBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationBankAccountCreateRequestDto'
        required: true
      responses:
        '201':
          description: Create a bank account response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/banks/users:
    get:
      tags:
      - funding-accounts
      summary: Get list of bank account users
      description: 'Get a list of bank account user objects. In the response, if the bank account user `verificationStatus` is set as `NOMINATED`, user verification must be completed before the user can pay with the specified bank account.


        By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.'
      operationId: listBankAccountUsers
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: archived
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{org_bank_account_user_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      - name: currentUser
        in: query
        schema:
          type:
          - boolean
          - 'null'
          description: Set as `true` to get results for the currently signed-in user. The default value is `false`.
      responses:
        '200':
          description: Get list of bank account users response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrganizationBankAccountUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/banks/users/nominate:
    post:
      tags:
      - funding-accounts
      summary: Nominate a bank account user
      description: 'Nominate a bank account user.


        When you nominate a user, BILL performs a set of operations.

        * The bank account user `verificationStatus` is set as `NOMINATED`.

        * BILL sends the user an email asking them to sign in to the BILL web app and complete identity verification. See Verify your identity in the Guides section for test verification information you can enter in the sandbox environment.


        After user identity verification is successful, the bank account user `verificationStatus` is set as `VERIFIED` and the user can pay with the specified bank account.


        **Note**: The bank account `status` must be set as `VERIFIED` before you can nominate bank account users.'
      operationId: nominateBankAccountUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NominateBankAccountUserRequestDto'
        required: true
      responses:
        '200':
          description: Nominate a bank account user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/banks/users/{bankAccountUserId}/archive:
    post:
      tags:
      - funding-accounts
      summary: Archive a bank account user
      description: Archive an existing bank account user. In the response, the `archived` field is set as `true` and the bank account user `verificationStatus` is set as `UNVERIFIED`.
      operationId: archiveBankAccountUser
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: bankAccountUserId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the bank account user. The value begins with `bau`.
          example: '{{org_bank_account_user_id}}'
      responses:
        '200':
          description: Archive a bank account user response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBankAccountUserResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/banks/{bankAccountId}:
    get:
      tags:
      - funding-accounts
      summary: Get bank account details
      description: Get details about an existing bank account.
      operationId: getBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: bankAccountId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the bank account. The value begins with `bac`.
          example: '{{org_bank_account_id}}'
      responses:
        '200':
          description: Get bank account details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - funding-accounts
      summary: Update a bank account
      description: 'Update details about an existing bank account.


        This operation follows a set of rules.

        * **Bank account `status` requirement**: The bank account `status` must be set as `VERIFIED` before you can update any details about the bank account. You can verify the bank account with `POST /v3/funding-accounts/banks/{bankAccountId}/verify`.

        * **Update field restrictions**: You cannot update the `routingNumber`, `accountNumber`, and account `type` values for a bank account. If you want to update any of these values, create a new bank account with `POST /v3/funding-accounts/banks`.'
      operationId: updateBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: bankAccountId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the bank account. The value begins with `bac`.
          example: '{{org_bank_account_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationBankAccountUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Update a bank account response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/banks/{bankAccountId}/archive:
    post:
      tags:
      - funding-accounts
      summary: Archive a bank account
      description: 'Archive an existing bank account. In the response, the `archived` field is set as `true`.


        Archiving a bank account at BILL has a set of requirements.

        * **Bank account status**: The bank account `status` must be set as `VERIFIED`. You can verify the bank account with `POST /v3/funding-accounts/banks/{bankAccountId}/verify`.

        * **Bank account user status**: The bank account user `verificationStatus` must be set as `VERIFIED`. To begin the verification process, nominate a bank account user with `POST /v3/funding-accounts/banks/users`.'
      operationId: archiveBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: bankAccountId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the bank account. The value begins with `bac`.
          example: '{{org_bank_account_id}}'
      responses:
        '200':
          description: Archive a bank account response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBankAccountResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/banks/{bankAccountId}/verify:
    post:
      tags:
      - funding-accounts
      summary: Verify a bank account
      description: 'Verify an existing bank account.


        When you create a bank account, BILL sends a test ACH payment to the bank account to confirm whether the account details are accurate. Enter the test amount as the `depositAmount` value in your `POST /v3/funding-accounts/banks/{bankAccountId}/verify` request.


        **Note**: Bank account verification is required in the production environment before the account can be used for other BILL operations. In the sandbox environment, set `depositAmount` as `0.50` to complete bank account verification.


        The bank account `status` is set as `VERIFIED` when BILL is able to verify the `depositAmount` value. BILL sends an email notification for confirming a test transaction. When BILL cannot verify the bank account after three attempts, you cannot use the bank account. At this point, use another bank account or create a bank account with `POST /v3/funding-accounts/banks`.


        After your bank account verification is complete, ensure that the current bank account user `verificationStatus` is set as `VERIFIED` before you can use the bank account. To begin the verification process, nominate a bank account user with `POST /v3/funding-accounts/banks/users/nominate`.


        See Bank account setup (v3 API) in the Guides section for more information, sample requests, and responses.'
      operationId: verifyBankAccount
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: bankAccountId
        in: path
        required: true
        schema:
          type: string
          description: BILL-generated ID of the bank account. The value begins with `bac`.
          example: '{{org_bank_account_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankAccountVerifyRequestDto'
        required: true
      responses:
        '200':
          description: Verify a bank account response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountVerifyResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/cards:
    get:
      tags:
      - funding-accounts
      summary: Get list of card accounts
      description: Get a list of card account objects.
      operationId: listPayableCardAccounts
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: cardUserStatus
        in: query
        required: true
        schema:
          allOf:
          - $ref: '#/components/schemas/CardUserStatus'
          - description: Card user status
      responses:
        '200':
          description: Get list of card accounts response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPayableCardAccountsResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/cards/funding-purposes:
    get:
      tags:
      - funding-accounts
      summary: Get card funding purpose
      description: 'Get a list of card funding purpose values based on the vendor and card brand.


        When you create a payment (`POST /v3/payments` or `POST /v3/payments/bulk`) with a `CARD_ACCOUNT` funding account `type`, BILL requires a vendor industry value for compliance. When BILL cannot identify the vendor industry, the `cardFundingPurpose` field must be set in your payment request.


        Use this endpoint to get the list of card funding purpose values you can set. If you get an empty 200 response, BILL has information about the vendor industry and setting the `cardFundingPurpose` field is not required in your payment request.'
      operationId: listCardFundingPurposes
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: vendorId
        in: query
        required: true
        schema:
          type: string
          description: BILL-generated ID of the vendor to be paid. The value begins with `009`.
          example: '{{vendor_id}}'
      - name: brand
        in: query
        required: true
        schema:
          type: string
          description: Card brand
          example: visa
      responses:
        '200':
          description: Get card funding purpose response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCardFundingPurposesResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/funding-accounts/cards/users:
    get:
      tags:
      - funding-accounts
      summary: Get list of card account users
      description: 'Get a list of card account user objects. In the response, if the card account user `verificationStatus` is set as `NOMINATED`, user verification must be completed before the user can pay with the specified card account.


        By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.'
      operationId: listCardAccountUsers
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: archived
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{org_card_account_user_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


