        ownerType:
          allOf:
          - $ref: '#/components/schemas/BankAccountOwnerType'
          - description: Bank account owner type
        bankName:
          maxLength: 100
          type: string
          description: Bank name. Set this field as a nickname for your bank account.
        accessToAdmins:
          type: boolean
          description: Set as `true` to enable access to all users with the `ADMINISTRATOR` user role
        default:
          allOf:
          - $ref: '#/components/schemas/OrganizationBankAccountDefault'
          - description: Bank account default values for BILL AP and AR operations
