openapi: 3.2.0
info:
  title: BILL v3 Recurring Invoices API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: recurring-invoices
paths:
  /v3/recurring-invoices:
    get:
      tags:
      - recurring-invoices
      summary: Get list of recurring invoices
      description: 'Get a list of recurring invoice objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listRecurringInvoices
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int32
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name and sort order. Both simple and compound sorting is available.


            The format is `sort={field_01}:{sort_order},{field_02}:{sort_order}`.


            **NOTE**: Sorting occurs in the specified order.'
          example: archived
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Field name, operator, and value. Both simple and compound filtering is available.


            The format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.'
          example: id:eq:{{recurring_invoice_id}}
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of recurring invoices response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecurringInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - recurring-invoices
      summary: Create a recurring invoice
      description: 'Create a recurring invoice.


        See Recurring invoices in the Guides section for more information, sample requests, and responses.'
      operationId: createRecurringInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringInvoiceRequestDto'
        required: true
      responses:
        '201':
          description: Create a recurring invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/recurring-invoices/{recurringInvoiceId}:
    get:
      tags:
      - recurring-invoices
      summary: Get recurring invoice details
      description: Get details about an existing recurring invoice.
      operationId: getRecurringInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: recurringInvoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the recurring invoice. The value begins with `rit`.
          example: '{{recurring_invoice_id}}'
      responses:
        '200':
          description: Get recurring invoice details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    put:
      tags:
      - recurring-invoices
      summary: Replace a recurring invoice
      description: 'Update the number of line items in a recurring invoice. You can also update other recurring invoice details.


        You can use the PUT operation to add, remove, or replace the number of line items in a recurring invoice. A set of rules apply with the PUT operation.

        * When you add a new line item, a new line item `id` is generated in the invoice.

        * When you omit an existing line item `id`, the line item is removed from the invoice.


        When a recurring invoice is modified, all future invoices are automatically changed.'
      operationId: replaceRecurringInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: recurringInvoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the recurring invoice. The value begins with `rit`.
          example: '{{recurring_invoice_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringInvoiceReplaceRequestDto'
        required: true
      responses:
        '200':
          description: Replace a recurring invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - recurring-invoices
      summary: Update a recurring invoice
      description: 'Update details about a recurring invoice line item. You can also update other recurring invoice details.


        You can use the PATCH operation to modify line item details, such as amount and description. The recurring invoice line item `id` does not change with a PATCH operation.


        When a recurring invoice is modified, all future invoices are automatically changed.'
      operationId: updateRecurringInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: recurringInvoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the recurring invoice. The value begins with `rit`.
          example: '{{recurring_invoice_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecurringInvoiceRequestDto'
        required: true
      responses:
        '200':
          description: Update a recurring invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/recurring-invoices/{recurringInvoiceId}/archive:
    post:
      tags:
      - recurring-invoices
      summary: Archive a recurring invoice
      description: 'Archive a recurring invoice. In the response, the `archived` field is set as `true`.


        You can restore an archived recurring invoice with `POST /v3/recurring-invoices/{recurringinvoiceId}/restore`. There is no change when you archive an archived recurring invoice.


        When a recurring invoice is modified, all future invoices are automatically changed.'
      operationId: archiveRecurringInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: recurringInvoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the recurring invoice. The value begins with `rit`.
          example: '{{recurring_invoice_id}}'
      responses:
        '200':
          description: Archive a recurring invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/recurring-invoices/{recurringInvoiceId}/restore:
    post:
      tags:
      - recurring-invoices
      summary: Restore a recurring invoice
      description: 'Restore an archived recurring invoice. In the response, the `archived` field is set as `false`.


        You can perform any valid BILL operation on restored recurring invoices. There is no change when you restore a restored recurring invoice.


        When a recurring invoice is modified, all future invoices are automatically changed.'
      operationId: restoreRecurringInvoice
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: recurringInvoiceId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the recurring invoice. The value begins with `rit`.
          example: '{{recurring_invoice_id}}'
      responses:
        '200':
          description: Restore a recurring invoice response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringInvoiceResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    InvoiceClassificationsDto:
      type: object
      properties:
        accountingClassId:
          type: string
          description: BILL-generated ID of the accounting class. The value begins with `cls`.
        departmentId:
          type: string
          description: BILL-generated ID of the department. The value begins with `0de`.
        jobId:
          type: string
          description: BILL-generated ID of the job. The value begins with `job`.
        locationId:
          type: string
          description: BILL-generated ID of the location. The value begins with `loc`.
      description: DTO for Invoice classifications.
    RecurringInvoiceUpdateLineItemDto:
      required:
      - id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: 'BILL-generated ID of the recurring invoice line item. The value begins with `ril`.

            '
        amount:
          type: number
          description: Recurring invoice line item amount. For a recurring invoice in an international currency (not USD), this value is in the local currency.
        description:
          maxLength: 4000
          type: string
          description: Recurring invoice line item description
        price:
          type: number
          description: Recurring invoice line item unit price. For a recurring invoice in an international currency (not USD), this value is in the local currency.
        quantity:
          type: number
          description: Recurring invoice line item unit quantity
        classifications:
          allOf:
          - $ref: '#/components/schemas/RecurringInvoiceLineItemClassificationsDto'
          - description: General ledger classifications information for the recurring invoice line item
      description: Line items that define a recurring invoice overall amount.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    InvoiceScheduleRequest:
      type: object
      properties:
        period:
          allOf:
          - $ref: '#/components/schemas/PeriodRequest'
          - description: Time period for setting up recurring invoices
        frequency:
          type: integer
          description: 'Invoice frequency per time `period`.


            For example, if the time `period` is `MONTHLY` and `frequency` is `3`, an invoice is generated once every 3 months.'
          format: int32
        nextDueDate:
          type: string
          description: Due date for the next invoice. This value is in the `yyyy-MM-dd` format.
          format: date
        endDate:
          type: string
          description: End date for the recurring invoices schedule. Recurring invoices stop on the `endDate`. This value is in the `yyyy-MM-dd` format.
          format: date
        daysInAdvance:
          type: integer
          description: Number of days before `nextDueDate` when the next invoice is generated. If the date has occurred in the past for one or more invoices, all those invoices are generated.
          format: int32
      description: Schedule properties for a recurring Invoices.
    PeriodResponse:
      type: string
      description: Period for scheduling a recurring bill.
      enum:
      - DAILY
      - WEEKLY
      - MONTHLY
      - YEARLY
      - NONE
      - UNDEFINED
    RecurringInvoiceLineItemClassificationsDto:
      type: object
      properties:
        chartOfAccountId:
          type: string
          description: BILL-generated ID of the chart of accounts. The value begins with `0ca`.
        accountingClassId:
          type: string
          description: BILL-generated ID of the accounting class. The value begins with `cls`.
        departmentId:
          type: string
          description: BILL-generated ID of the department. The value begins with `0de`.
        jobId:
          type: string
          description: BILL-generated ID of the job. The value begins with `job`.
        locationId:
          type: string
          description: BILL-generated ID of the location. The value begins with `loc`.
        itemId:
          type: string
          description: BILL-generated ID of the item. The value begins with `0ii`.
      description: DTO for Recurring Invoice Line Item classifications.
    UpdateRecurringInvoiceRequestDto:
      type: object
      properties:
        customerId:
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        paymentTermId:
          type: string
        description:
          maxLength: 4000
          type: string
          description: User-generated invoice number. This value can be your chosen number scheme or invoice due date.
        schedule:
          allOf:
          - $ref: '#/components/schemas/InvoiceScheduleRequest'
          - description: Recurring invoice scheduling information
        recurringInvoiceLineItems:
          type: array
          description: Recurring invoice line item information
          items:
            $ref: '#/components/schemas/RecurringInvoiceUpdateLineItemDto'
        sendEmail:
          type: boolean
          description: Set as `true` to send an email to the customer when an invoice is created.
      description: Update a recurring invoice
      example:
        recurringInvoiceLineItems:
        - id: '{{recurring_invoice_line_item_id01}}'
          amount: 22.99
          description: Monthly subscription (amount updated)
          quantity: 1
    RecurringInvoiceResponseDto:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the recurring invoice. The value begins with `rit`.
        customerId:
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        paymentTermId:
          type: string
        description:
          type: string
          description: Recurring invoice line item description
        archived:
          type: boolean
          description: Set as `true` if the recurring invoice is archived
        schedule:
          allOf:
          - $ref: '#/components/schemas/InvoiceScheduleResponse'
          - description: Recurring invoice scheduling information
        recurringInvoiceLineItems:
          type: array
          description: Recurring invoice line item information
          items:
            $ref: '#/components/schemas/RecurringInvoiceLineItemResponseDto'
        classifications:
          allOf:
          - $ref: '#/components/schemas/InvoiceClassificationsDto'
          - description: General ledger classifications information for the recurring invoice line item
        sendEmail:
          type: boolean
          description: Set as `true` to send an email to the customer when an invoice is created.
        createdTime:
          type: string
          description: Created date and time
          format: date-time
        updatedTime:
          type: string
          description: Updated date and time
          format: date-time
      description: RecurringInvoice response Dto.
    ListRecurringInvoiceResponseDto:
      type: object
      description: Get list of recurring invoices response.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_RecurringInvoiceResponseDto_'
    RecurringInvoiceReplaceLineItem:
      type: object
      properties:
        id:
          type: string
          description: 'BILL-generated ID of the recurring invoice line item. The value begins with `ril`.

            '
        amount:
          type: number
          description: Recurring invoice line item amount. For a recurring invoice in an international currency (not USD), this value is in the local currency.
        description:
          maxLength: 4000
          type: string
          description: Recurring invoice line item description
        price:
          type: number
          description: Recurring invoice line item unit price. For a recurring invoice in an international currency (not USD), this value is in the local currency.
        quantity:
          type: number
          description: Recurring invoice line item unit quantity
        classifications:
          allOf:
          - $ref: '#/components/schemas/RecurringInvoiceLineItemClassificationsDto'
          - description: General ledger classifications information for the recurring invoice line item
      description: Replace RecurringInvoice line item request Dto.
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    RecurringInvoiceReplaceRequestDto:
      required:
      - customerId
      - recurringInvoiceLineItems
      - schedule
      type: object
      properties:
        customerId:
          minLength: 1
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        paymentTermId:
          type: string
        description:
          maxLength: 4000
          type: string
          description: User-generated invoice number. This value can be your chosen number scheme or invoice due date.
        schedule:
          allOf:
          - $ref: '#/components/schemas/InvoiceScheduleRequest'
          - description: Recurring invoice scheduling information
        recurringInvoiceLineItems:
          type: array
          description: Recurring invoice line item information
          items:
            $ref: '#/components/schemas/RecurringInvoiceReplaceLineItem'
        sendEmail:
          type: boolean
          description: Set as `true` to send an email to the customer when an invoice is created.
      description: Replace a recurring invoice (line item added)
      example:
        customerId: '{{customer_id}}'
        schedule:
          period: MONTHLY
          frequency: 1
          nextDueDate: '2026-12-31'
          endDate: '2027-11-01'
          daysInAdvance: 5
        recurringInvoiceLineItems:
        - id: '{{recurring_invoice_line_item_id01}}'
          amount: 19.99
          description: Monthly subscription
          quantity: 1
        - amount: 4.99
          description: Decaf black tea (10 bags)
          quantity: 1
    InvoiceScheduleResponse:
      type: object
      properties:
        period:
          allOf:
          - $ref: '#/components/schemas/PeriodResponse'
          - description: Time period for setting up recurring invoices.
        frequency:
          type: integer
          description: 'Invoice frequency per time `period`.


            For example, if the time `period` is `MONTHLY` and `frequency` is `3`, an invoice is generated once every 3 months.'
          format: int32
        nextDueDate:
          type: string
          description: Due date for the next invoice. This value is in the `yyyy-MM-dd` format.
          format: date
        endDate:
          type: string
          description: End date for the recurring invoices schedule. Recurring invoices stop on the `endDate`. This value is in the `yyyy-MM-dd` format.
          format: date
        daysInAdvance:
          type: integer
          description: Number of days before `nextDueDate` when the next invoice is generated. If the date has occurred in the past for one or more invoices, all those invoices are generated.
          format: int32
      description: Schedule properties for a recurring Invoices.
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
      - DOWNSTREAM
    PeriodRequest:
      type: string
      description: Period for scheduling a recurring bill.
      enum:
      - DAILY
      - WEEKLY
      - MONTHLY
      - YEARLY
      - NONE
    RecurringInvoiceLineItemResponseDto:
      type: object
      properties:
        id:
          type: string
          description: 'BILL-generated ID of the recurring invoice line item. The value begins with `ril`.

            '
        amount:
          type: number
          description: Recurring invoice line item amount. For a recurring invoice in an international currency (not USD), this value is in the local currency.
        description:
          type: string
          description: Recurring invoice line item description
        price:
          type: number
          description: Recurring invoice line item unit price. For a recurring invoice in an international currency (not USD), this value is in the local currency.
        quantity:
          type: number
          description: Recurring invoice line item unit quantity
        classifications:
          allOf:
          - $ref: '#/components/schemas/RecurringInvoiceLineItemClassificationsDto'
          - description: General ledger classifications information for the recurring invoice line item
        taxable:
          type: boolean
          description: Set as `true` if the recurring invoice line item is taxable
      description: Recurring Invoice Line Item.
    ListResponseDto_RecurringInvoiceResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
        prevPage:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecurringInvoiceResponseDto'
      description: Response from a list API request with paging references.
    RecurringInvoiceLineItemDto:
      type: object
      properties:
        amount:
          type: number
          description: Recurring invoice line item amount. For a recurring invoice in an international currency (not USD), this value is in the local currency.
        description:
          maxLength: 4000
          type: string
          description: Recurring invoice line item description
        price:
          type: number
          description: Recurring invoice line item unit price. For a recurring invoice in an international currency (not USD), this value is in the local currency.
        quantity:
          type: number
          description: Recurring invoice line item unit quantity
        classifications:
          allOf:
          - $ref: '#/components/schemas/RecurringInvoiceLineItemClassificationsDto'
          - description: General ledger classifications information for the recurring invoice line item
      description: Recurring Invoice Create Request Line Item.
    BdcError:
      required:
      - category
      - code
      - severity
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        category:
          $ref: '#/components/schemas/Category'
        message:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        detail:
          type: string
        help:
          type: string
    CreateRecurringInvoiceRequestDto:
      required:
      - customerId
      - recurringInvoiceLineItems
      - schedule
      type: object
      properties:
        customerId:
          minLength: 1
          type: string
          description: BILL-generated ID of the customer. The value begins with `0cu`.
        paymentTermId:
          type: string
        description:
          maxLength: 4000
          type: string
          description: User-generated invoice number. This value can be your chosen number scheme or invoice due date.
        schedule:
          allOf:
          - $ref: '#/components/schemas/InvoiceScheduleRequest'
          - description: Recurring invoice scheduling information
        recurringInvoiceLineItems:
          type: array
          description: Recurring invoice line item information
          items:
            $ref: '#/components/schemas/RecurringInvoiceLineItemDto'
        sendEmail:
          type: boolean
          description: Set as `true` to send an email to the customer when an invoice is created.
      description: Create a recurring invoice
