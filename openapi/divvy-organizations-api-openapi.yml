openapi: 3.2.0
info:
  title: BILL v3 Organizations API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Organizations
paths:
  /v3/organizations/industries:
    get:
      tags:
      - Organizations
      summary: Get list of organization industries
      description: Get a list of available values for the `industry` field for an organization. Use this information to set the `industry` field in your `POST /v3/partner/organizations` or `PATCH /v3/organizations/{organizationId}` request.
      operationId: listIndustries
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      responses:
        '200':
          description: Get list of organization industries response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIndustriesResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/organizations/{organizationId}:
    get:
      tags:
      - Organizations
      summary: Get organization details
      description: 'Get details about an existing organization. The currently signed-in user must have the `ADMINISTRATOR` user role in the BILL organization to perform this operation.


        See Organizations and Users in the Guides section for more information, sample requests, and responses.'
      operationId: getOrganization
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: organizationId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
          example: '{{organization_id}}'
      responses:
        '200':
          description: Get organization details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Organizations
      summary: Update an organization
      description: 'Update details about an existing organization. The currently signed-in user must have the `ADMINISTRATOR` user role in the BILL organization to perform this operation.


        See Organizations and Users in the Guides section for more information, sample requests, and responses.'
      operationId: updateOrganization
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: organizationId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
          example: '{{organization_id}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Update an organization response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/organizations/{organizationId}/billing-statements:
    get:
      tags:
      - Organizations
      summary: Get list of billing statements
      description: 'Get a list of billing statements for the organization. BILL generates a monthly billing invoice statement for all the billing activities in the organization.


        In the request, set `invoiceDateFrom` and `invoiceDateTo` to get the billing invoice statements for the specified date range.


        You can set `max` and `page` in the request only when both `invoiceDateFrom` and `invoiceDateTo` are not set. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.


        See Search operations with lists in the Guides section for filtering, sorting, and pagination examples.'
      operationId: listBillingStatements
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
          example: '{{organization_id}}'
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results. You can set `max` only when both `invoiceDateFrom` and `invoiceDateTo` are not set.
          format: int32
      - name: invoiceDateFrom
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Billing invoice start date. The value is in the `yyyy-MM-dd` format. This field is required if `invoiceDateTo` is set.
      - name: invoiceDateTo
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Billing invoice end date. The value is in the `yyyy-MM-dd` format. This field is required if `invoiceDateFrom` is set.
      - name: page
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results. You can set `page` only when both `invoiceDateFrom` and `invoiceDateTo` are not set.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set `page` as the `nextPage` or `prevPage` value for navigation.'
      responses:
        '200':
          description: Get list of billing statements response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBillingStatementResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/organizations/{organizationId}/billing-statements/{billingStatementId}:
    get:
      tags:
      - Organizations
      summary: Get billing statement details
      description: 'Get details about a billing statement for the organization. BILL generates a monthly billing invoice statement for all the billing activities in the organization.


        From the response, use `downloadLink` in a GET request to download a billing statement.


        ```

        curl ''{downloadLink}'' --header ''sessionId: {session_id}'' --output {statement_name}

        ```'
      operationId: getBillingStatementDetail
      parameters:
      - name: organizationId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
          example: '{{organization_id}}'
      - name: billingStatementId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the billing statement. The value begins with `0S0`.
          example: '{{billing_statement_id}}'
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      responses:
        '200':
          description: Get billing statement details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatementDetailResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/organizations/{organizationId}/price-plan:
    get:
      tags:
      - Organizations
      summary: Get organization price plan details
      description: 'Get the BILL price plan details for an existing organization. The currently signed-in user must have the `ADMINISTRATOR` user role in the BILL organization to perform this operation.


        A BILL price plan for an organization provides a range of information, including monthly subscription fees and the terms and conditions for additional charges in the price plan.


        In the response, the `planTerms` object includes information about charges for price plan features based on a combination of charge `tier`, `quantity`, and `price`. We explain plan terms with an example.

        * If `"tier": 1`, `"quantity": 5`, and `"price": 10`, the first 5 users will be charged $10 each.

        * If `"tier": 2`, `"quantity": 10`, and `"price": 8`, the next 10 users will be charged $8 each. At this level, if there is no `tier` information, all users after tier 1 will be charged $8 each.'
      operationId: getPricePlan
      parameters:
      - name: sessionId
        in: header
        schema:
          type:
          - string
          - 'null'
          description: API session ID generated with `/v3/login`
          example: '{{session_id}}'
      - name: devKey
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Developer key generated with your BILL developer account
          example: '{{developer_key}}'
      - name: organizationId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
          example: '{{organization_id}}'
      responses:
        '200':
          description: Get organization price plan details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricePlanResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    TaxIdTypeRequest:
      type: string
      description: The enum Tax id type enum.
      enum:
      - EIN
      - SSN
    BillingStatementDetailResponseDto:
      required:
      - amount
      - billingPeriod
      - description
      - downloadLink
      - id
      - invoiceDate
      - invoiceNumber
      - paymentStatus
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the billing statement. The value begins with `0S0`.
        invoiceNumber:
          type: string
          description: Billing invoice number
        invoiceDate:
          type: string
          description: Billing invoice date
          format: date
        description:
          type: string
          description: Billing invoice description
        billingPeriod:
          allOf:
          - $ref: '#/components/schemas/BillingPeriodDto'
          - description: Billing period information
        paymentStatus:
          allOf:
          - $ref: '#/components/schemas/BillingStatementPaymentStatus'
          - description: Billing invoice payment status
        paymentDate:
          type: string
          description: Billing invoice payment date
          format: date
        amount:
          type: number
          description: Billing invoice amount
        statementDetails:
          type: array
          description: Statement details. This includes billing invoice line item information.
          items:
            $ref: '#/components/schemas/BillingStatementDetailLineItemDto'
        downloadLink:
          allOf:
          - $ref: '#/components/schemas/DownloadLinkDto'
          - description: Billing statement download link information
      description: BillingStatementDetail response Dto.
    BusinessCategoryRequest:
      type: string
      description: Business Category.
      enum:
      - CORPORATION
      - LLC
      - NON_PROFIT
      - GOVERNMENT
      - SOLE_PROPRIETOR
      - INDIVIDUAL
      - TRUST
      - UNKNOWN
    DownloadLinkDto:
      required:
      - csv
      - pdf
      type: object
      properties:
        csv:
          type: string
          description: CSV format
        pdf:
          type: string
          description: PDF format
      description: DownloadLink response Dto.
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    PlanTerm:
      type: object
      properties:
        type:
          type: string
          description: Plan charge type
        name:
          allOf:
          - $ref: '#/components/schemas/PlanTermItemName'
          - description: Plan charge name
        tier:
          type: number
          description: Plan charge tier
        quantity:
          type: number
          description: Quantity for the plan charge
        price:
          type: number
          description: Plan charge
      description: Plan Term.
