    OrganizationResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the organization. The value begins with `008`.
        archived:
          type: boolean
          description: Set as `true` if the organization is archived. You cannot archive an organization with the API.
        name:
          type: string
          description: Organization name
        displayName:
          type: string
          description: Organization display name (DBA trade name)
        address:
          allOf:
          - $ref: '#/components/schemas/AddressResponse'
          - description: Organization physical address
        mailingAddress:
          allOf:
          - $ref: '#/components/schemas/AddressResponse'
          - description: Organization mailing address
        phone:
          type: string
          description: Organization phone number
        companyOwner:
          allOf:
          - $ref: '#/components/schemas/CompanyOwner'
          - description: Company owner information
        taxId:
          type: string
          description: Organization tax ID. This value is required by the IRS for tax purposes.
        taxIdType:
          allOf:
          - $ref: '#/components/schemas/TaxIdTypeResponse'
          - description: Organization tax ID type.
        industry:
          type: string
          description: Organization industry
        businessCategory:
          allOf:
          - $ref: '#/components/schemas/BusinessCategoryResponse'
          - description: Organization business category.
        accountType:
          allOf:
          - $ref: '#/components/schemas/OrganizationAccountTypeResponse'
          - description: Organization account type.
        processingOptions:
          allOf:
          - $ref: '#/components/schemas/OrganizationProcessingOptions'
          - description: Organization processing options
        partnerName:
          type: string
          description: 'Partner name.


            This field is available only when select BILL partners create an organization. Partner name is part of the information that BILL uses to identify partners.'
        createdTime:
          type: string
          description: Created date and time
          format: date-time
        updatedTime:
          type: string
          description: Updated date and time
          format: date-time
      description: Organization response.
    TaxIdTypeResponse:
      type: string
      description: The enum Tax id type enum.
      enum:
      - EIN
      - SSN
      - UNDEFINED
    OrganizationAccountTypeResponse:
      type: string
      description: Organization Account Type.
      enum:
      - BUSINESS
      - CONTRACTOR
      - EMPLOYEE_OR_INDIVIDUAL
      - OTHER
      - CONSUMER
      - UNDEFINED
    ListBillingStatementResponseDto:
      type: object
      description: Response DTO for listing billing statements.
      allOf:
      - $ref: '#/components/schemas/ListResponseDto_BillingStatementResponseDto_'
    PricePlanResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the price plan. The value begins with `ppl`.
        name:
          type: string
          description: Price plan name
        monthlyPrice:
          type: number
          description: Price plan monthly subscription fee
        allowTrial:
          type: boolean
          description: Set as `true` if the price plan allows a trial
        priceVariesPerUser:
          type: boolean
          description: Set as `true` if the price plan has per-user pricing
        planTerms:
          type: array
          description: Terms and conditions for additional charges in the price plan. These charges are for price plan features based on a combination of charge `type`, `tier`, `quantity`, and `price`.
          items:
            $ref: '#/components/schemas/PlanTerm'
      description: Organization price plan response.
    BillingStatementDetailLineItemDto:
      type: object
      properties:
        quantity:
          type: integer
          description: Billing invoice line item quantity
          format: int32
        description:
          type: string
          description: Billing invoice line item description
        type:
          type: string
          description: Billing invoice line item type
        amount:
          type: number
          description: Billing invoice line item amount
      description: BillingStatementDetailLineItem response Dto.
    AddressUpdate:
      type: object
      properties:
        line1:
          pattern: ^.{0,1000}$
          type: string
          description: Address line 1
        line2:
          pattern: ^.{0,100}$
          type: string
          description: Address line 2
        city:
          pattern: ^.{0,100}$
          type: string
          description: Address city
        stateOrProvince:
          pattern: ^.{0,100}$
          type: string
          description: State or province
        zipOrPostalCode:
          pattern: ^.{0,30}$
          type: string
          description: Zip or postal code
        country:
          allOf:
          - $ref: '#/components/schemas/CountryCode'
          - description: Country code (ISO2)
      description: The type Address Update dto.
    BusinessCategoryResponse:
      type: string
      description: Business Category.
      enum:
      - UNDEFINED
      - CORPORATION
      - LLC
      - NON_PROFIT
      - GOVERNMENT
      - SOLE_PROPRIETOR
      - INDIVIDUAL
      - TRUST
      - UNKNOWN
    ListResponseDto_BillingStatementResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
        prevPage:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/BillingStatementResponseDto'
      description: Response from a list API request with paging references.
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    OrganizationAccountTypeRequest:
      type: string
      description: Organization Account Type.
      enum:
      - BUSINESS
      - CONTRACTOR
      - EMPLOYEE_OR_INDIVIDUAL
      - OTHER
      - CONSUMER
    AddressResponse:
      required:
      - city
      - country
      - line1
      - zipOrPostalCode
      type: object
      properties:
        line1:
          minLength: 1
          pattern: ^.{0,1000}$
          type: string
          description: Address line 1
        line2:
          pattern: ^.{0,100}$
          type: string
          description: Address line 2
        city:
          minLength: 1
          pattern: ^.{0,100}$
          type: string
          description: Address city
        stateOrProvince:
          pattern: ^.{0,100}$
          type: string
          description: State or province
        zipOrPostalCode:
          minLength: 1
          pattern: ^.{0,30}$
          type: string
          description: Zip or postal code
        country:
          allOf:
          - $ref: '#/components/schemas/CountryCode'
          - description: Country code (ISO2)
        countryName:
          type: string
          description: Country name.
      description: Address response.
    OrganizationProcessingOptions:
      type: object
      properties:
        mailingAddressSameAsPhysical:
          type: boolean
          description: Set as `true` if the mailing address is the same as the physical address. The default value is `true`.
        individualTransferOut:
          type: boolean
          description: 'Rule for how ACH transfers are made from the organization funding bank account to vendors.

            * Set as `true` for an individual ACH transfer for each payment made.

            * Set as `false` for a single batch ACH transfer for all payments made in a day. The default value is `false`.


            **Note**: You can set this field only when you update an organization (`PATCH /v3/organizations/{organizationId}`).'
        individualTransferIn:
          type: boolean
          description: 'Rule for how ACH transfers are made from customers to the organization funding bank account.

            * Set as `true` for an individual ACH transfer for each payment received.

            * Set as `false` for a single batch ACH transfer for all payments received in a day. The default value is `false`.


            **Note**: You can set this field only when you update an organization (`PATCH /v3/organizations/{organizationId}`).'
      description: User provided options for having the same mailing address as the physical address.
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
