openapi: 3.2.0
info:
  title: BILL v3 Cards API
  description: BILL is a cloud-based financial operations platform for an organization's accounts payable (AP), accounts receivable (AR), and spend & expense (S&E) automation.
  version: '1'
servers:
- url: https://gateway.stage.bill.com/connect
  description: sandbox
tags:
- name: Cards
paths:
  /v3/spend/cards:
    get:
      tags:
      - Cards
      summary: Get list of cards
      description: Get a list of card objects. By default, you get 20 results on one page of results. Set `max` in your request to get up to 100 results on one page.
      operationId: listCards
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: nextPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: 'Next page of results.


            When a list has multiple pages, the `nextPage` and `prevPage` values in the response enable you to navigate between the pages of results. Set this field as the `nextPage` value for navigation.'
      - name: prevPage
        in: query
        schema:
          type:
          - string
          - 'null'
          description: Previous page of results. Set this field as the `prevPage` value for navigation.
      - name: max
        in: query
        schema:
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
          description: Maximum number of results
          format: int64
          example: 10
      - name: sort
        in: query
        schema:
          type:
          - string
          - 'null'
          description: "Field name and sort order. You can set only one sort field.\n\nThe format is `sort={field}:{sort_order}`.\n\nThe sortable fields are:\n - `name`\n - `lastFour`\n - `status`"
          example: status
      - name: filters
        in: query
        schema:
          type:
          - string
          - 'null'
          description: "Field name, operator, and value. You can set multiple filters.\n\nThe format is `filters={field_01}:{op}:{value},{field_02}:{op}:{value}`.\n\nExample: `filters=status:eq:ACTIVATED,budgetIds:in:\"abc,def\"`\n\nThe filterable fields are:\n - `status` - `ACTIVATED`, `NOT_ACTIVATED`, `FROZEN`, `DELETED`. Operators: `eq`.\n - `budgetIds` - List of string IDs or UUIDs. Operators: `eq`, `in`.\n - `cardIds` - List of string IDs or UUIDs. Operators: `eq`, `in`.\n - `userIds` - List of string IDs or UUIDs. Operators: `eq`, `in`.\n - `types` - `PHYSICAL`, `VIRTUAL_MEMBER`, `VIRTUAL_VENDOR`. Operators: `eq`, `in`."
          example: cardIds:eq:{{se_card_uuid}}
      responses:
        '200':
          description: Get list of cards response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCardsResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    post:
      tags:
      - Cards
      summary: Create a vendor card
      description: 'Create a new vendor card.


        See Vendor cards in the Guides section for more information, sample requests, and responses.'
      operationId: createBudgetCard
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequestDto'
        required: true
      responses:
        '200':
          description: Create a vendor card response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/cards/{cardId}:
    get:
      tags:
      - Cards
      summary: Get vendor card details
      description: Get details about an existing vendor card.
      operationId: getCard
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: cardId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the card
          example: '{{se_card_uuid}}'
      responses:
        '200':
          description: Get vendor card details response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    delete:
      tags:
      - Cards
      summary: Delete a vendor card
      description: Delete an existing vendor card. A deleted card cannot be restored. The deleted card is not available in the list of cards.
      operationId: deleteCard
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: cardId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the card
          example: '{{se_card_uuid}}'
      - name: reason
        in: query
        schema:
          allOf:
          - $ref: '#/components/schemas/UserDeletedReasonType'
          - description: Delete card reason
            example: CANCELLED
      responses:
        '200':
          description: Delete a vendor card response
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
    patch:
      tags:
      - Cards
      summary: Update a vendor card
      description: Update details about an existing vendor card.
      operationId: updateCard
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: cardId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the card
          example: '{{se_card_uuid}}'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequestDto'
        required: true
      responses:
        '200':
          description: Update a vendor card response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/cards/{cardId}/freeze:
    post:
      tags:
      - Cards
      summary: Freeze a vendor card
      description: 'Freeze an existing vendor card.


        You can freeze virtual cards and physical cards. A frozen card cannot be used for payments.'
      operationId: freezeCard
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: cardId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the card
          example: '{{se_card_uuid}}'
      responses:
        '200':
          description: Freeze a vendor card response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/cards/{cardId}/pan-jwt:
    get:
      tags:
      - Cards
      summary: Get a PAN JWT token
      description: ''
      operationId: getPanJWT
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: cardId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the card
          example: '{{se_card_uuid}}'
      responses:
        '200':
          description: Get a PAN JWT token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPanTokenResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
  /v3/spend/cards/{cardId}/unfreeze:
    post:
      tags:
      - Cards
      summary: Unfreeze a vendor card
      description: Unfreeze an existing vendor card. You can unfreeze virtual cards and physical cards.
      operationId: unfreezeCard
      parameters:
      - name: apiToken
        in: header
        schema:
          type:
          - string
          - 'null'
          description: Access token for Spend & Expense API authentication
          example: '{{api_token}}'
      - name: cardId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          description: BILL-generated ID or UUID of the card
          example: '{{se_card_uuid}}'
      responses:
        '200':
          description: Unfreeze a vendor card response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponseDto'
        4XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
        5XX:
          description: List of errors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BdcError'
components:
  schemas:
    CardType:
      type: string
      description: CardType.
      enum:
      - PHYSICAL
      - VIRTUAL_MEMBER
      - VIRTUAL_VENDOR
      - VIRTUAL
    CreateCardRequestDto:
      required:
      - budgetId
      - name
      - userId
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: Card name
        userId:
          type: string
          description: BILL-generated ID or UUID of the user linked with the card
        budgetId:
          type: string
          description: BILL-generated ID or UUID of the budget linked with the card
        limit:
          type:
          - number
          - 'null'
          description: Card spend limit for the current budget period
        recurringLimit:
          type:
          - number
          - 'null'
          description: Card spend limit for all future budget periods
        expirationDate:
          type:
          - string
          - 'null'
          description: 'User-generated expiration date. The value is in the `yyyy-MM-dd` format. BILL automatically closes the card account on this date.


            **Note**: Use the `validThru` value in the response as the expiration date in a card payment. Do not use the `expirationDate` value for this operation.'
          format: date
        shareBudgetFunds:
          type:
          - boolean
          - 'null'
          description: Set as `true` to share all the budget funds with the card. This option enables the card user to spend from unallocated budget funds when the allocation is empty.
      description: Create a virtual charge card
      example:
        budgetId: '{{se_budget_uuid}}'
        limit: '100'
        name: Happy Music Supplies card for Clark Spenderson
        userId: '{{se_user_uuid}}'
    PaginationResponseDto_CardResponseDto_:
      type: object
      properties:
        nextPage:
          type: string
          description: Next page token
        prevPage:
          type: string
          description: Previous page token
        results:
          type: array
          description: Results
          items:
            $ref: '#/components/schemas/CardResponseDto'
      description: Response from a list API request with paging references.
    Severity:
      type: string
      enum:
      - ERROR
      - WARNING
      - INFORMATION
    CardCurrentPeriodDto:
      type: object
      properties:
        limit:
          type: number
          description: Card spend limit for the current budget period
        spent:
          type: number
          description: Amount spent with the card for the current budget period
      description: DTO representing card values relevant to the current budget period.
    UpdateCardRequestDto:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Card name
        budgetId:
          type:
          - string
          - 'null'
          description: BILL-generated ID or UUID of the budget linked with the card
        availableFunds:
          type:
          - number
          - 'null'
          description: Card spend limit for the current budget period
        recurringLimit:
          type:
          - number
          - 'null'
          description: Card spend limit for all future budget periods
        expirationDate:
          type:
          - string
          - 'null'
          description: 'User-generated expiration date. The value is in the `yyyy-MM-dd` format. BILL automatically closes the card account on this date. To remove the card expiration date, set this field as `null`.


            **Note**: Use the `validThru` value in the response as the expiration date in a card payment. Do not use the `expirationDate` value for this operation.'
          format: date
        shareBudgetFunds:
          type:
          - boolean
          - 'null'
          description: Set as `true` to share all the budget funds with the card. This option enables the card user to spend from unallocated budget funds when the allocation is empty.
        recurring:
          type:
          - boolean
          - 'null'
          description: 'Card policy for recurring budget periods.

            * `true`: Renew the card funds in the next budget period

            * `false`: Card is available only for the current budget period


            If you do not set this field, the card will retain its current policy.'
      description: Update a virtual charge card (limit updated)
      example:
        limit: '120'
    CardStatus:
      type: string
      description: CardStatus.
      enum:
      - ACTIVATED
      - NOT_ACTIVATED
      - FROZEN
      - DELETED
    PaginatedCardsResponseDto:
      type: object
      description: List of cards with paging references.
      allOf:
      - $ref: '#/components/schemas/PaginationResponseDto_CardResponseDto_'
    CardPanTokenResponseDto:
      type: object
      properties:
        token:
          type: string
          description: PAN JWT token
      description: Card PAN token response.
    UserDeletedReasonType:
      type: string
      description: Delete card reason
      example: CANCELLED
      enum:
      - CANCELLED
      - LOST
      - STOLEN
      - MISPLACED
    BdcError:
      required:
      - category
      - code
      - severity
      - timestamp
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        severity:
          $ref: '#/components/schemas/Severity'
        category:
          $ref: '#/components/schemas/Category'
        message:
          type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/Param'
        detail:
          type: string
        help:
          type: string
    Param:
      required:
      - name
      - value
      type: object
      properties:
        additional:
          type: object
          additionalProperties:
            type: string
        name:
          minLength: 1
          type: string
        value:
          minLength: 1
          type: string
    Category:
      type: string
      enum:
      - REQUEST
      - APPLICATION
      - SERVER
      - DOWNSTREAM
    CardResponseDto:
      type: object
      properties:
        id:
          type: string
          description: BILL-generated ID of the card
          deprecated: true
        uuid:
          type: string
          description: BILL-generated UUID of the card
        name:
          type: string
          description: Card name
        userId:
          type: string
          description: BILL-generated ID of the user linked with the card
          deprecated: true
        userUuid:
          type: string
          description: BILL-generated UUID of the user linked with the card
        budgetId:
          type: string
          description: BILL-generated ID of the budget linked with the card
          deprecated: true
        budgetUuid:
          type: string
          description: BILL-generated UUID of the budget linked with the card
        lastFour:
          type: string
          description: Last four digits of the card number
        validThru:
          type: string
          description: 'BILL-generated card expiration date. The value is in the `MM/YY` format.


            **Note**: Use the `validThru` value as the expiration date in a card payment. Do not use the `expirationDate` value for this operation.'
        expirationDate:
          type: string
          description: 'User-generated card expiration date. This value is in the `yyyy-MM-dd` format. BILL automatically closes the card account on this date.


            **Note**: Use the `validThru` value as the expiration date in a card payment. Do not use the `expirationDate` value for this operation.'
          format: date
        status:
          allOf:
          - $ref: '#/components/schemas/CardStatus'
          - description: Card status.
        deletedReason:
          allOf:
          - $ref: '#/components/schemas/DeletedReasonType'
          - description: Delete card reason. This field is available in the response only when `status` is `DELETED`.
        type:
          allOf:
          - $ref: '#/components/schemas/CardType'
          - description: Card type.
        shareBudgetFunds:
          type: boolean
          description: Set as `true` to share all the budget funds with the card. This option enables the card user to spend from unallocated budget funds when the allocation is empty.
        recurring:
          type: boolean
          description: Set as `true` to renew the card funds in the next budget period
        recurringLimit:
          type: number
          description: Card spend limit for the all future budget periods
        currentPeriod:
          allOf:
          - $ref: '#/components/schemas/CardCurrentPeriodDto'
          - description: Current budget period information about the card
        createdTime:
          type: string
          description: Created date and time
          format: date-time
        updatedTime:
          type: string
          description: Updated date and time
          format: date-time
      description: Cards response.
    DeletedReasonType:
      type: string
      description: DeletedReasonType.
      enum:
      - CANCELLED
      - LOST
      - STOLEN
      - MISPLACED
      - FRAUD_CONFIRMED
      - SUPERSEDED_BY_NEW_ORDER
